# The signed-in user chooses their locale. It changes no sheet, so it is open while viewing as of a
# date and to a viewer, and writes no audit line. Validate first so a bad value is a 400.
validate:
  class: net.officefloor.hq.app.locale.ValidateLocale
  next: save
save:
  class: net.officefloor.hq.app.locale.SaveLocale
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.locale.RespondWithLocale
  govern: [ transaction ]
