# Import lines of name,grade,terms,contact, in order: a line naming a person on the sheet (by name or alias) updates
# them as the person form edits them; any other line adds a person as the form adds them.
# Every line is checked with the person form's rules before anything is written, so one refusal imports nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: lines
lines:
  class: net.officefloor.hq.app.person.ValidateImportPeople
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: ensure
ensure:
  class: net.officefloor.hq.app.sheet.EnsureSheet
  govern: [ transaction ]
  next: add
add:
  class: net.officefloor.hq.app.person.AddImportedPeople
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithImportPeople
  govern: [ transaction ]
