# PUT /api/sheets/{sheetId}/periods/{periodId}/unlock — unlock a locked period (a steward only).
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: period
period:
  class: net.officefloor.hq.app.period.LoadPeriod
  govern: [ transaction ]
  next: unlock
unlock:
  class: net.officefloor.hq.app.period.UnlockPeriod
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.period.AuditPeriodUnlocked
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithPeriod
  govern: [ transaction ]
