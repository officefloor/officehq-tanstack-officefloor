# PUT /api/sheets/{sheetId}/periods/{name}/soft-close — soft-close an open period, fixing its due-total (the figures of
# the counting claims dated in it) at this moment while its claims can still change. 409 for a period not on the sheet,
# already (soft-)closed, or a role not allowed to close.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: close
  govern: [ transaction ]
close:
  class: net.officefloor.hq.app.period.SoftClosePeriod
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.period.AuditPeriodSoftClosed
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.period.RespondWithPeriod
  govern: [ transaction ]
