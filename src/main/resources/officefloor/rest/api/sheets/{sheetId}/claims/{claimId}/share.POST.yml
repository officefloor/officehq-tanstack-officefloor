# Share a claim with another person on the sheet: they hold the share (a percent, two decimals, above 0.00) of its due, which counts in their due-total and comes out of the claim's own person's. A refused share (a SETTLED, VOID or DELETED claim, the claim's own person, a person already holding a share, shares adding up to more than 100.00, an unknown person or claim) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.claim.ValidateShare
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveShare
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimShared
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditShareRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
