# POST /api/sheets/{sheetId}/claims/{claimId}/reject?reason=... — a steward rejects a PENDING claim with
# a reason: it goes back to OPEN; refused (409) for anyone else or when it is not PENDING, (400) with no reason.
# A viewer may change nothing: refused before anything is read or written.
guard:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: move
move:
  class: net.officefloor.hq.app.claim.RejectClaim
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveClaim
  govern: [ transaction ]
  next: log
log:
  class: net.officefloor.hq.app.claim.LogClaimStatus
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.RecordClaimRejected
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
