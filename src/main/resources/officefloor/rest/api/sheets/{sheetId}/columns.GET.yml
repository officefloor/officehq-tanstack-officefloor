# The columns of the people list the signed-in user has switched off on the sheet: none unless chosen.
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ readonly-transaction ]
  next: columns
columns:
  class: net.officefloor.hq.app.columns.LoadColumns
  govern: [ readonly-transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.columns.RespondWithColumns
  govern: [ readonly-transaction ]
