# GET /api/sheets/{sheetId}/grades — the grades A, B and C, each with whether it is retired on the sheet.
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheetForRead
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.grade.RespondWithGrades
  govern: [ transaction ]
