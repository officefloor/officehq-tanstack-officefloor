# POST /api/sheets/{sheetId}/bulk-redate — re-date the selected claims to one date together, in list
# order, each by the rules of re-dating one; each that cannot be re-dated is left as it is. Responds with
# how many were re-dated and how many refused.
redate:
  class: net.officefloor.hq.app.claim.BulkRedateClaims
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithBulkRedate
