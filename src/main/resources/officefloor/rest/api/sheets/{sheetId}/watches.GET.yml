# Who watches whom on the sheet: one entry per person and user watching them, in the order they started.
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ readonly-transaction ]
  next: watches
watches:
  class: net.officefloor.hq.app.watch.LoadWatches
  govern: [ readonly-transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.watch.RespondWithWatches
  govern: [ readonly-transaction ]
