# PUT /api/sheets/{sheetId}/templates — save a claim template (saving a name again replaces it).
# Body: { "name": "<name>", "amount": "12.50", "note": "..." }.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: validate
validate:
  class: net.officefloor.hq.app.template.ValidateTemplate
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.template.ApplyTemplate
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.template.AuditTemplateSaved
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.template.RespondWithTemplate
  govern: [ transaction ]
