# Set the person's approver: a user name (blank: none), replacing any they had. That user may approve or reject the
# person's PENDING claims as a steward may. A viewer is refused (400), a person not on the sheet (404).
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: validate
validate:
  class: net.officefloor.hq.app.person.ValidateApproverRequest
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.person.ApplyPersonApprover
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.person.AuditApproverSet
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
