# Set the person's approver: a user who may approve or reject their PENDING claims as a steward may.
validate:
  class: net.officefloor.hq.app.person.ValidateApprover
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: set
set:
  class: net.officefloor.hq.app.person.SetApprover
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
