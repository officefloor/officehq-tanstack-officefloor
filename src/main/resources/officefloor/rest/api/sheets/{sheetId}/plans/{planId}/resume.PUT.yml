# PUT /api/sheets/{sheetId}/plans/{planId}/resume — resume the plan on the sheet's today (refused when it is not paused). Answers the sheet's plans.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: plan
plan:
  class: net.officefloor.hq.app.plan.LoadPlan
  govern: [ transaction ]
  next: resume
resume:
  class: net.officefloor.hq.app.plan.ResumePlan
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.plan.AuditPlanResumed
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlans
  govern: [ transaction ]
