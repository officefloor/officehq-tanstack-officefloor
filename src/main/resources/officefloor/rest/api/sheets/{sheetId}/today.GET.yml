# The sheet's today (a sheet never loaded is created, on the real date).
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: asof
asof:
  class: net.officefloor.hq.app.history.ValidateViewAsOf
  next: ensure
ensure:
  class: net.officefloor.hq.app.sheet.EnsureSheet
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.sheet.RespondWithSheetTodayAsOf
  govern: [ transaction ]
