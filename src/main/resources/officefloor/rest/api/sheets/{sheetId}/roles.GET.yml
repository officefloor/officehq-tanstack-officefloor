# GET /api/sheets/{sheetId}/roles — the user names given a role on the sheet (any other name is a clerk).
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheetForRead
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.role.RespondWithRoles
  govern: [ transaction ]
