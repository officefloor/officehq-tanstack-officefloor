# PUT /api/sheets/{sheetId}/people/{personId}/unstate — cancel a person's last statement: the claims it bound
# are live again. Steward only. 404 for a person not on the sheet; 409 for a user who is not a steward or a
# person with no statement.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: snapshot
  govern: [ transaction ]
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  next: load
  govern: [ transaction ]
load:
  class: net.officefloor.hq.app.person.LoadPerson
  next: cancel
  govern: [ transaction ]
cancel:
  class: net.officefloor.hq.app.statement.CancelStatement
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.statement.AuditStatementCancelled
  next: rollup
  govern: [ transaction ]
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.statement.RespondWithStatement
  govern: [ transaction ]
