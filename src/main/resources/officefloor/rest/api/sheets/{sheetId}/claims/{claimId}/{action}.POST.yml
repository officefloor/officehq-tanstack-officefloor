# open | settle | approve | reject | void a claim (reject takes ?reason=). The audit line is written last, once the change is allowed and
# saved, so a refused change (an unknown action 400, a status that forbids it, a claim dated in a
# closed period, a steward-only approve or reject, or a reject without a reason 409) writes none. A clerk settling
# above the clerk limit sends the claim to PENDING (CLAIM_PENDING).
validate:
  class: net.officefloor.hq.app.claim.ValidateClaimAction
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: unclosed
unclosed:
  class: net.officefloor.hq.app.claim.CheckClaimActionOpen
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.claim.ApplyClaimAction
  govern: [ transaction ]
  next: limit
limit:
  class: net.officefloor.hq.app.claim.ApplyClerkLimit
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveClaim
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimStatus
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
