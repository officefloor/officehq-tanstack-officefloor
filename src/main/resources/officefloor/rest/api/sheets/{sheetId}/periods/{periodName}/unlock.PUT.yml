# Unlock a period (so it can be reopened again). Only a steward may. A refused unlock (no signed-in user, not a steward,
# unknown sheet or period, not locked) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.period.ValidatePeriodClose
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: unlock
unlock:
  class: net.officefloor.hq.app.period.UnlockPeriod
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.period.AuditPeriodUnlocked
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithPeriod
  govern: [ transaction ]
