# Show or hide one people-list column on the user's screen. Validate before touching the store, so a refusal writes nothing.
sheet:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: user
user:
  class: net.officefloor.hq.app.session.ValidateColumnsUser
  next: column
column:
  class: net.officefloor.hq.app.session.ValidateColumn
  next: apply
apply:
  class: net.officefloor.hq.app.session.ApplyColumn
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.session.RespondWithColumns
  govern: [ transaction ]
