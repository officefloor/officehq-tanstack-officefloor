# PUT /api/sheets/{sheetId}/people/{personId}/unretire — unretire a retired person on the sheet's today. They are no
# longer retired; the retirement is kept as a past one, from its date to that day, and a claim dated strictly between
# the two is refused. Anyone not retired is refused with 409 and nothing is stored; 404 for a person not on the sheet.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: snapshot
  govern: [ transaction ]
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  next: load
  govern: [ transaction ]
load:
  class: net.officefloor.hq.app.person.LoadPerson
  next: unretire
  govern: [ transaction ]
unretire:
  class: net.officefloor.hq.app.person.UnretirePerson
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.person.AuditPersonUnretired
  next: rollup
  govern: [ transaction ]
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.person.RespondWithEditedPerson
  govern: [ transaction ]
