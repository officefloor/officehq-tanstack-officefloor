# POST /api/sheets/{sheetId}/claims/{claimId}/resettle — a steward freezes a SETTLED claim again at the figure it
# would have today as an open claim bound by no statement; refused (409) for anyone else or any other status,
# and (423) for a claim dated in a closed period.
# A viewer may change nothing: refused before anything is read or written.
guard:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: move
move:
  class: net.officefloor.hq.app.claim.ResettleClaim
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveClaim
  govern: [ transaction ]
  next: log
log:
  class: net.officefloor.hq.app.claim.LogClaimStatus
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.RecordClaimResettled
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
