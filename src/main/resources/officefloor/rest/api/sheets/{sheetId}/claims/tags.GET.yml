# Every tag ever used on the sheet's claims, sorted.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: asof
asof:
  class: net.officefloor.hq.app.history.ValidateViewAsOf
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithTags
  govern: [ readonly-transaction ]
