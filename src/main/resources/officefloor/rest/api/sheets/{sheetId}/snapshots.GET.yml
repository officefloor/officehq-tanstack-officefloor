# Every snapshot written on the sheet (person id, the day being left, their due-total), oldest first. 404 for an id never loaded.
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ readonly-transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.rollup.RespondWithSnapshots
  govern: [ readonly-transaction ]
