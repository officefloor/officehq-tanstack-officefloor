# The sheet's people's snapshot lines: one entry per SNAPSHOT written for a person, by person and oldest first.
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ readonly-transaction ]
  next: snapshots
snapshots:
  class: net.officefloor.hq.app.snapshot.LoadSnapshots
  govern: [ readonly-transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.snapshot.RespondWithSnapshots
  govern: [ readonly-transaction ]
