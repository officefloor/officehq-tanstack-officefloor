# Roll a fiscal year over: generate the next fiscal year's twelve periods, as the fiscal year generator
# does, and carry each person's open figure at the old year's end into the new year's first period as
# an opening balance. Validate first so a bad year is a 400, not a 404.
# A viewer may change nothing: refused before anything is read or written.
viewer:
  class: net.officefloor.hq.app.role.CheckCanChange
  next: validate
validate:
  class: net.officefloor.hq.app.period.ValidateGenerateFiscalYear
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: rollover
# Only a steward; a year with no periods is refused. Audits OPENING_SET lines, then ROLLOVER, then
# PERIOD_SOFT_CLOSED for each period of the old year still open, soft-closed in start-date order.
rollover:
  class: net.officefloor.hq.app.period.RolloverFiscalYear
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithGeneratedPeriods
  govern: [ transaction ]
