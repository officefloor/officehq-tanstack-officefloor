# GET /api/sheets/{sheetId}/audit?name= — the sheet's audit lines as the file holds them, newest first;
# with a name, only the lines carrying name=<it> or person=<it> (compared as names are), followed, for a person
# transferred here, by the lines about them on the sheet they came from.
respond:
  class: net.officefloor.hq.app.audit.RespondWithAuditLines
  govern: [ readonly-transaction ]
