# GET /api/sheets/{sheetId}/audit?name= — the sheet's audit lines exactly as the audit file holds them, newest first;
# with a name, only the lines carrying name=<it> or person=<it> (case and surrounding spaces ignored), and when the name
# is (a name or alias of) a person transferred in, after them the lines about them on the sheet they came from (under
# the name they had there), newest first, as that sheet's file holds them.
respond:
  class: net.officefloor.hq.app.auditview.RespondWithAuditLines
