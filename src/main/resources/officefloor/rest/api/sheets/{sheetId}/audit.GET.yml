# The sheet's audit lines, newest first; ?name= keeps only the lines about that person (name= or person=), followed by the
# lines about them from each of the sheet's descendants (each sheet's newest first, sheets by id), then,
# for a person transferred here, by the lines about them from the sheet they came from (newest first).
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ readonly-transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.audit.RespondWithAuditLines
  govern: [ readonly-transaction ]
