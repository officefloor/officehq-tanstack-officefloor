# GET /api/sheets/{sheetId}/audit?person= — the sheet's audit lines, newest first, read from the audit file;
# with a person, followed by the lines about them on the sheet's descendants (each newest first, sheets by id),
# then, for a person transferred here, the lines about them from the sheet they came from.
respond:
  class: net.officefloor.hq.app.audit.RespondWithAuditLines
  govern: [ readonly-transaction ]
