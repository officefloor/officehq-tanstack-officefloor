# The flags on the sheet in force on its today (today on or before the until date): person id, reason and until. 404 for an id never loaded.
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ readonly-transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.flag.RespondWithFlags
  govern: [ readonly-transaction ]
