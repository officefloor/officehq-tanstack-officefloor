# POST /api/sheets/{sheetId}/paste-claims — paste lines of name,amount,date,note, in order, each for the named person
# (a name on the sheet, case and outer spaces ignored), and open each claim as the open button would. Every line is
# checked first by the claim form's rules (see the add of a claim), a note ending in ` #<reference>` giving the claim
# that reference (not part of the note), and no reference repeated within the paste (case ignored). A line whose
# person, date and note match one of their claims as they stood before the paste (not VOID nor DELETED) updates the
# newest such DRAFT to its amount (CLAIM_EDITED when it changes) instead of adding one; matches with no DRAFT fail the
# line. Each claim added (CLAIM_ADDED) or updated is then opened (CLAIM_OPENED, then the figures it moved): a user the
# sheet does not permit to open, a note required, or a period's cap reached refuses the paste. Any failing line, an
# unknown name, or no lines at all is a 400 that writes nothing. Responds with how many lines went through.
validate:
  class: net.officefloor.hq.app.claim.ValidatePasteClaims
  next: check
check:
  class: net.officefloor.hq.app.claim.CheckPastedClaims
  govern: [ transaction ]
  next: add
add:
  class: net.officefloor.hq.app.claim.AddPastedClaims
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithPasteClaims
