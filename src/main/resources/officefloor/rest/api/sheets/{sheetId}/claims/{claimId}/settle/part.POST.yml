# Part-settle an OPEN claim: split the body's amount off it exactly as split does, then settle the new claim at once
# by the user exactly as settle does (PENDING when the clerk limit says so). The settle's four-eyes and proof rules are
# judged on the original claim, before anything is written (the new claim's opener is the user, who may still settle it).
# A split or a settle that would be refused refuses the whole action (400) and writes nothing. Responds with the new claim.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: validate
validate:
  class: net.officefloor.hq.app.claim.ValidateSplitRequest
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: checkPeriod
checkPeriod:
  class: net.officefloor.hq.app.claim.CheckClaimPeriodOpen
  govern: [ transaction ]
  next: checkSettle
checkSettle:
  class: net.officefloor.hq.app.claim.CheckClaimSettlePart
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: split
split:
  class: net.officefloor.hq.app.claim.SplitClaim
  govern: [ transaction ]
  next: splitLog
splitLog:
  class: net.officefloor.hq.app.claim.LogClaimStatus
  govern: [ transaction ]
  next: splitAudit
splitAudit:
  class: net.officefloor.hq.app.claim.AuditClaimSplit
  govern: [ transaction ]
  next: splitRollup
splitRollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: settleBefore
settleBefore:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: settle
settle:
  class: net.officefloor.hq.app.claim.SettleSplitClaim
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveClaim
  govern: [ transaction ]
  next: batch
batch:
  class: net.officefloor.hq.app.claim.SaveClaimBatch
  govern: [ transaction ]
  next: log
log:
  class: net.officefloor.hq.app.claim.LogClaimStatus
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimAction
  govern: [ transaction ]
  next: notify
notify:
  class: net.officefloor.hq.app.watch.NotifyWatchers
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
