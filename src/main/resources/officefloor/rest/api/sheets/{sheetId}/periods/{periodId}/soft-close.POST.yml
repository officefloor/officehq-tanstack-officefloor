# POST /api/sheets/{sheetId}/periods/{periodId}/soft-close — soft-close an open period, fixing its due-total and each
# person's as a close does, while claims dated inside it can still be added, edited, opened, settled and voided. A
# period not on the sheet, closed or soft-closed already, or a user the close permission does not allow, is a 400 and
# writes nothing. Responds with the period as stored.
validate:
  class: net.officefloor.hq.app.period.ValidatePeriodClose
  next: load
load:
  class: net.officefloor.hq.app.period.LoadPeriod
  govern: [ transaction ]
  next: close
close:
  class: net.officefloor.hq.app.period.SoftClosePeriod
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.period.RecordPeriodSoftClosed
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithPeriod
  govern: [ transaction ]
