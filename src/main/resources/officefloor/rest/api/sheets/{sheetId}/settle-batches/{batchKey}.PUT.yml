# PUT /api/sheets/{sheetId}/settle-batches/{batchKey} — a bulk settle is done: record its batch (BATCH_SETTLED).
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditBatchSettled
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.sheet.RespondWithSheet
  govern: [ transaction ]
