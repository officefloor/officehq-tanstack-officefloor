# POST /api/sheets/{sheetId}/people/{personId}/plans — add a plan to the person.
# Body: { "amount": "10.00", "start": "YYYY-MM-DD", "every": "7" or "day": "31", "end": "YYYY-MM-DD",
#   "sheet": a descendant sheet id the claims are generated on, or blank }. Answers the sheet's plans.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: validate
validate:
  class: net.officefloor.hq.app.plan.ValidatePlan
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: target
target:
  class: net.officefloor.hq.app.plan.ValidatePlanSheet
  govern: [ transaction ]
  next: person
person:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.plan.ApplyPlan
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.plan.AuditPlanAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlans
  govern: [ transaction ]
