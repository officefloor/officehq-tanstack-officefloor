# POST /api/sheets/{sheetId}/people/{personId}/plans — add a plan to a person: an amount the claim form takes for a
# claim that corrects nothing, a start and an end date (yyyy-MM-dd, the end not before the start) and every N days (a
# whole number, at least 1). Any other is a 400, a person not on the sheet a 404, none writing anything. Writes
# PLAN_ADDED. Responds 201 with the plan.
validate:
  class: net.officefloor.hq.app.plan.ValidatePlan
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: add
add:
  class: net.officefloor.hq.app.plan.AddPlan
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.plan.RecordPlanAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlanCreated
