# Add a plan to a person. Validate the body before touching the store, so a refusal writes nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: plan
plan:
  class: net.officefloor.hq.app.plan.ValidatePlan
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: build
build:
  class: net.officefloor.hq.app.plan.BuildPlan
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.plan.RecordPlanAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlan
  govern: [ transaction ]
