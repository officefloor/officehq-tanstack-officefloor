# POST /api/sheets/{sheetId}/periods/generate-quarters — make the four calendar quarters of a year. Body
# {"year":"2026"}: periods 2026-Q1 to 2026-Q4, from Jan-Mar to Oct-Dec; each is made as the period form adds it
# (a quarter whose name is taken or whose days overlap a period is left out).
# A year that is not yyyy is refused with 400 and nothing is stored. Responds {"made":n}.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: validate
  govern: [ transaction ]
validate:
  class: net.officefloor.hq.app.period.ValidateGenerateQuarters
  next: add
  govern: [ transaction ]
add:
  class: net.officefloor.hq.app.period.AddGeneratedPeriods
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.period.AuditPeriodsGenerated
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.period.RespondWithGenerated
  govern: [ transaction ]
