# Ends a bulk settle after its claims' own settles: writes its BATCH_SETTLED line (none when it took no batch number).
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditBatchSettled
  govern: [ transaction ]
