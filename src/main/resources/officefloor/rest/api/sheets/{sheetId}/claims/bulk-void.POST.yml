# Void the selected claims together with one void reason, in list order (people as added, each one's claims newest
# first), each exactly as its row's void. One that cannot be voided is left as it is; answers how many were voided and
# how many refused.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: selected
selected:
  class: net.officefloor.hq.app.claim.ValidateBulkVoid
  next: void
void:
  class: net.officefloor.hq.app.claim.VoidClaims
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithBulkVoid
  govern: [ transaction ]
