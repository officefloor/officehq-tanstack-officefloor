# Put a person on hold from a from-date (blank: the sheet's today) to an optional to-date.
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: validate
validate:
  class: net.officefloor.hq.app.person.ValidateHold
  next: hold
hold:
  class: net.officefloor.hq.app.person.HoldPerson
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
