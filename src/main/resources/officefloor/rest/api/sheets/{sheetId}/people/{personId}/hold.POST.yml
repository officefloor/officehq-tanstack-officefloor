# Add a hold to the person from a date (blank: the sheet's today) to an optional to-date. The audit line
# is written once it is saved, then the rollup lines: the hold takes the person's OPEN and PENDING claims
# dated within it, unless bound by a statement, out of every live total. There is no release: a hold ends
# on its to-date. A bad date or a to-date before the from-date (400), or no such person (404), writes nothing.
validate:
  class: net.officefloor.hq.app.person.ValidateHold
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: hold
hold:
  class: net.officefloor.hq.app.person.HoldPerson
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.person.AuditPersonHold
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
