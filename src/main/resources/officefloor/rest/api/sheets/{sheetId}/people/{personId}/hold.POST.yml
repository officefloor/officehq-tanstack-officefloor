# Add a hold to a person, from a date (blank: the sheet's today) to an optional to-date; a bad date or a to-date
# before the from-date is refused (400), a person not on the sheet (404). Only their open claims dated within a hold,
# and not bound by a statement, are left out of the live totals.
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: validate
validate:
  class: net.officefloor.hq.app.person.ValidateHoldRequest
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: hold
hold:
  class: net.officefloor.hq.app.person.HoldPerson
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.person.AuditPersonHeld
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
