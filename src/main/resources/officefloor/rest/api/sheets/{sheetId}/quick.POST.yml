# POST /api/sheets/{sheetId}/quick — quick-add a DRAFT claim by name. Body {"name":"...","amount":"12.50"}.
# The claim is dated the entry date (else the sheet's today) with an empty note; a name not on the sheet (ignoring case) adds
# that person first, with grade A. Refused as the person and claim forms are — 400 for a blank name or a
# bad amount, 422 for a claim whose due-by (its date plus the terms it would get) is inside a closed period — before anything is stored or recorded.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: snapshot
  govern: [ transaction ]
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  next: validate
  govern: [ transaction ]
validate:
  class: net.officefloor.hq.app.quick.ValidateQuick
  next: closed
  govern: [ transaction ]
closed:
  class: net.officefloor.hq.app.claim.RefuseClosedQuickInput
  next: person
  govern: [ transaction ]
person:
  class: net.officefloor.hq.app.quick.FindOrAddPerson
  next: retired
  govern: [ transaction ]
retired:
  class: net.officefloor.hq.app.claim.RefuseRetiredInput
  next: add
  govern: [ transaction ]
add:
  class: net.officefloor.hq.app.claim.AddClaim
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.claim.AuditClaimAdded
  next: rollup
  govern: [ transaction ]
rollup:
  class: net.officefloor.hq.app.quick.AuditQuickRollup
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
