# PUT /api/sheets/{sheetId}/claims/{claimId}/check/settle — refuse, as the claim's settle would, a settle the user cannot make; changes nothing.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: claim
claim:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: check
check:
  class: net.officefloor.hq.app.claim.CheckClaimSettle
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
