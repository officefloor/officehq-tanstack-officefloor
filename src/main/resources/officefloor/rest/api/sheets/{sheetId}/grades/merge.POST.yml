# Merge a grade into another: a steward only. Every person whose grade in force on the sheet's today is the merged
# grade is given the other from the sheet's today, in list order, each exactly as the person form's edit would (its
# PERSON_EDITED line and then how the sheet's figures moved over it), after the GRADE_MERGED line.
# Then, for each person moved, every grade record of theirs on the merged grade becomes the other (retroactively).
# A refused merge (no user, a bad grade, the same grade twice, not a steward, into a retired grade) writes nothing.
validate:
  class: net.officefloor.hq.app.grade.ValidateGradeMerge
  next: merge
merge:
  class: net.officefloor.hq.app.grade.MergeGrade
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.grade.RespondWithGradeMerge
  govern: [ transaction ]
