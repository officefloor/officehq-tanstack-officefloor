# Comment a claim, in any status: kept with the user and the sheet's today. An empty comment is refused.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: comment
comment:
  class: net.officefloor.hq.app.claim.ValidateComment
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.claim.ApplyComment
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.RecordCommentAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
