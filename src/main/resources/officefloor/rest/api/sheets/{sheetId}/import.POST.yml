# Import people: lines of name,grade,terms,contact, each added as the person form adds them, or updating the
# person on the sheet the name (or alias) matches. One change: if any line is refused, no one is changed.
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: validate
validate:
  class: net.officefloor.hq.app.importing.ValidateImport
  next: save
save:
  class: net.officefloor.hq.app.importing.ImportPeople
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.importing.RespondWithImport
