# Every tag ever given to a claim on the sheet, sorted.
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ readonly-transaction ]
  next: tags
tags:
  class: net.officefloor.hq.app.claim.LoadTags
  govern: [ readonly-transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithTags
  govern: [ readonly-transaction ]
