# Paste lines of name,amount,date,note: a claim per line, in order, for the named person, added (or a matching DRAFT
# edited) and then opened as the open button would. Any refusal, a line's check or an open's, writes nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: lines
lines:
  class: net.officefloor.hq.app.claim.ValidatePaste
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: add
add:
  class: net.officefloor.hq.app.claim.AddPastedClaims
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithPaste
  govern: [ transaction ]
