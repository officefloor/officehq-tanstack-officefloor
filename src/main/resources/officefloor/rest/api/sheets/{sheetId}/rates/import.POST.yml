# Import lines of grade,rate,from,to, in order, each set as the rate form sets it.
# Every line is checked with the rate form's rules before anything is written, so one refusal sets nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: lines
lines:
  class: net.officefloor.hq.app.rate.ValidateImportRates
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: ensure
ensure:
  class: net.officefloor.hq.app.sheet.EnsureSheet
  govern: [ transaction ]
  next: set
set:
  class: net.officefloor.hq.app.rate.SetImportedRates
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.rate.RespondWithImportRates
  govern: [ transaction ]
