# POST /api/sheets/{sheetId}/rates/import — set a rate per pasted line. Body {"text":"..."}, lines of grade,rate,from,to
# (the last two may be absent or blank). Every line is checked first by the rate form's rules: 400 for a bad line or
# none, and then nothing is stored. Otherwise each is set in order as the form sets it (replacing a rate for the same
# grade and from-date; RATE_SET, then its ROLLUP lines). Responds {"set":n}.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: snapshot
  govern: [ transaction ]
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  next: validate
  govern: [ transaction ]
validate:
  class: net.officefloor.hq.app.rate.ValidateRateImport
  next: set
  govern: [ transaction ]
set:
  class: net.officefloor.hq.app.rate.SetImportedRates
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.rate.RespondWithRateImport
  govern: [ transaction ]
