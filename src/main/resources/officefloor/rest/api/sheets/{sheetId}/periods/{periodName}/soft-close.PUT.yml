# Soft-close a period, fixing its due-total as it is now while its claims can still change. A refused close (no signed-in user, a role the permission matrix does not allow, unknown sheet or period,
# already closed or soft-closed) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.period.ValidatePeriodClose
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: close
close:
  class: net.officefloor.hq.app.period.SoftClosePeriod
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.period.AuditPeriodSoftClosed
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithPeriod
  govern: [ transaction ]
