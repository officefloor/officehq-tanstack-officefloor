# POST /api/sheets/{sheetId}/rate-withdraw — withdraw the newest version of a grade's rate (a steward only).
# Body: { "grade": "A", "from": "YYYY-MM-DD" (blank: the rate from the start) }.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: validate
validate:
  class: net.officefloor.hq.app.rate.ValidateRateWithdraw
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: withdraw
withdraw:
  class: net.officefloor.hq.app.rate.WithdrawRate
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.rate.AuditRateWithdrawn
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.rate.RespondWithRates
  govern: [ transaction ]
