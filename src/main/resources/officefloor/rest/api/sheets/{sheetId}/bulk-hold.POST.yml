# Hold the selected people together from a from-date (blank: the sheet's today) to an optional to-date
# (blank: open-ended): each, in list order (by their position), exactly as the row's hold would. Answers
# how many were held (none for a viewer).
guard:
  class: net.officefloor.hq.app.history.RefuseAsOf
  next: hold
hold:
  class: net.officefloor.hq.app.person.BulkHoldPeople
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithBulkHold
