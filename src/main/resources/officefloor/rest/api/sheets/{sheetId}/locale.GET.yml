# The signed-in user's locale on the sheet: en unless they chose another.
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ readonly-transaction ]
  next: locale
locale:
  class: net.officefloor.hq.app.locale.LoadLocale
  govern: [ readonly-transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.locale.RespondWithLocale
  govern: [ readonly-transaction ]
