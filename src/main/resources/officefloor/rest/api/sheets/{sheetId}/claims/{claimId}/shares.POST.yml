# POST /api/sheets/{sheetId}/claims/{claimId}/shares — shares a claim with another person of the sheet: their share
# (a percent, two decimals, more than 0.00) of its due counts in their due-total, settled-total and open-total, and
# comes off its own person's. The claim's own person, a person already holding a share, shares adding up to more than
# 100.00, or a SETTLED, VOID or DELETED claim is a 409 and a claim not on the sheet a 404, neither writing anything.
# Responds with the claim as stored.
validate:
  class: net.officefloor.hq.app.claim.ValidateShare
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.claim.ApplyShare
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveShare
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.RecordClaimShared
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
