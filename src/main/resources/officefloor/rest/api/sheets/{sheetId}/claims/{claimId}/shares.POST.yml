# Share a claim with another person on the sheet (the body's personId) at a percent of its due (the body's share: two
# decimals, more than 0.00): CLAIM_SHARED is written. The holder's due-total counts their part of the claim's due, and
# the claim's own person's the rest. The claim's own person, a person already holding a share, shares adding up to
# more than 100.00, or a SETTLED, VOID or DELETED claim is refused (400) and writes nothing.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: validate
validate:
  class: net.officefloor.hq.app.claim.ValidateShareRequest
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: check
check:
  class: net.officefloor.hq.app.claim.CheckClaimShare
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: share
share:
  class: net.officefloor.hq.app.claim.ShareClaim
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimShared
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
