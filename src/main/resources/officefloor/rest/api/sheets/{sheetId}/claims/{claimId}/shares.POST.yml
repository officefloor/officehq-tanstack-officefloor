# POST /api/sheets/{sheetId}/claims/{claimId}/shares — share a claim with another person on the sheet (body:
# {"personId":3,"share":"33.33"}): they hold that percent of its due, and CLAIM_SHARED is written. 422 for anything
# refused (the claim's own person, a person already holding a share, a share not more than 0.00, shares adding up to
# more than 100.00, or a SETTLED, VOID or DELETED claim); nothing is stored. 404 for a claim not on the sheet.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: snapshot
  govern: [ transaction ]
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  next: load
  govern: [ transaction ]
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  next: apply
  govern: [ transaction ]
apply:
  class: net.officefloor.hq.app.claim.ApplyShare
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.claim.AuditClaimShared
  next: rollup
  govern: [ transaction ]
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.claim.RespondWithEditedClaim
  govern: [ transaction ]
