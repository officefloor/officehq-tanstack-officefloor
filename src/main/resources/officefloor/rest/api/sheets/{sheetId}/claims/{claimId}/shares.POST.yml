# POST /api/sheets/{sheetId}/claims/{claimId}/shares — shares a claim with another person on the sheet. Body:
# { "personId": "...", "share": "33.33" }; the claim's own person, a person already holding a share, shares totalling
# more than 100.00, or a SETTLED, VOID or DELETED claim are refused.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: validate
validate:
  class: net.officefloor.hq.app.claim.ValidateShare
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: claim
claim:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.claim.ApplyShare
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimShared
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
