# PUT /api/sheets/{sheetId}/periods/{name}/unlock — unlock a period. Steward only. 409 for a period not on the sheet,
# already unlocked, or a user who is not a steward.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: unlock
  govern: [ transaction ]
unlock:
  class: net.officefloor.hq.app.period.UnlockPeriod
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.period.AuditPeriodUnlocked
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.period.RespondWithPeriod
  govern: [ transaction ]
