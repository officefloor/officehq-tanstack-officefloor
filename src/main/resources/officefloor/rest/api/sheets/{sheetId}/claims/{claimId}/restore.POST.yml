# POST /api/sheets/{sheetId}/claims/{claimId}/restore — move a DELETED claim back to DRAFT on the sheet's
# today it was deleted; refused (409) for any other status or on a later day.
# A viewer may change nothing: refused before anything is read or written.
guard:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: move
move:
  class: net.officefloor.hq.app.claim.RestoreClaim
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveClaim
  govern: [ transaction ]
  next: log
log:
  class: net.officefloor.hq.app.claim.LogClaimStatus
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.RecordClaimStatus
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
