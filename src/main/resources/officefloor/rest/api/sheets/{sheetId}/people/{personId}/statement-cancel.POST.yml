# Cancel a person's last statement, by a steward only: the claims it bound are live again and the person shows the
# statement before it (or none); a person with no statement, or a user who is not a steward, is refused (400).
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: cancel
cancel:
  class: net.officefloor.hq.app.statement.CancelStatement
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.statement.AuditStatementCancelled
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
