# GET /api/sheets/{sheetId}/delegations — the steward role delegations made on the sheet, oldest first.
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheetForRead
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.role.RespondWithDelegations
  govern: [ transaction ]
