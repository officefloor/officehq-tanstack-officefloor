# The sheet's delegations of the steward role.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: asof
asof:
  class: net.officefloor.hq.app.history.ValidateViewAsOf
  next: respond
respond:
  class: net.officefloor.hq.app.access.RespondWithDelegations
  govern: [ readonly-transaction ]
