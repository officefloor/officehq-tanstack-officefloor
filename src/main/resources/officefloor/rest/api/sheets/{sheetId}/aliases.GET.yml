# The sheet's people's aliases: one entry per person and alias they are known by.
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ readonly-transaction ]
  next: aliases
aliases:
  class: net.officefloor.hq.app.alias.LoadAliases
  govern: [ readonly-transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.alias.RespondWithAliases
  govern: [ readonly-transaction ]
