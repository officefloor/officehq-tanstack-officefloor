# PUT /api/sheets/{sheetId}/periods/{periodId}/lock — lock a period (a steward only), so it cannot be reopened.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: period
period:
  class: net.officefloor.hq.app.period.LoadPeriod
  govern: [ transaction ]
  next: lock
lock:
  class: net.officefloor.hq.app.period.LockPeriod
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.period.AuditPeriodLocked
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithPeriod
  govern: [ transaction ]
