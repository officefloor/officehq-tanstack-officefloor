# Set a DRAFT, OPEN or PENDING claim's due-by directly to the body's date (yyyy-MM-dd). Only a steward sets a due-by;
# any other status, a claim whose due-by falls inside a closed period or a new due-by inside one is refused (400) and
# writes nothing. A due-by set so stays as set: a holiday added later does not move it. Overdue, the late charge,
# grace and the claim's period follow it.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: validate
validate:
  class: net.officefloor.hq.app.claim.ValidateDueByRequest
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: checkPeriod
checkPeriod:
  class: net.officefloor.hq.app.claim.CheckClaimPeriodOpen
  govern: [ transaction ]
  next: check
check:
  class: net.officefloor.hq.app.claim.CheckClaimDueBy
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: set
set:
  class: net.officefloor.hq.app.claim.SetClaimDueBy
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimDueBySet
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
