# Set the due-by of a DRAFT, OPEN or PENDING claim directly (a steward only). The due-by stays as set: a holiday added later does not move it; its overdue, late charge, grace and period follow it. A refused set (not a steward, not DRAFT, OPEN or PENDING, a claim due in a closed period or a new due-by inside one) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.claim.ValidateDueBySet
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: closed
closed:
  class: net.officefloor.hq.app.period.RefuseClosedClaimDueBySet
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveDueBySet
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimDueBySet
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditDueBySetRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
