# PUT /api/sheets/{sheetId}/claims/{claimId}/due-by — a steward sets the due-by of a DRAFT, OPEN or PENDING claim. Body
# {"dueBy":"yyyy-mm-dd"}. A due-by set this way stays as set (a holiday added later does not move it); overdue, the late
# charge, grace and the claim's period follow it. Refused with 422 for anyone but a steward, any other status, a due-by
# before the claim's date, or a claim (or the new due-by) in a closed period; nothing is stored. 404 for a claim not on
# the sheet.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: snapshot
  govern: [ transaction ]
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  next: load
  govern: [ transaction ]
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  next: closed
  govern: [ transaction ]
closed:
  class: net.officefloor.hq.app.claim.RefuseClosedClaim
  next: apply
  govern: [ transaction ]
apply:
  class: net.officefloor.hq.app.claim.ApplyDueBy
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.claim.AuditClaimDueBySet
  next: rollup
  govern: [ transaction ]
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.claim.RespondWithEditedClaim
  govern: [ transaction ]
