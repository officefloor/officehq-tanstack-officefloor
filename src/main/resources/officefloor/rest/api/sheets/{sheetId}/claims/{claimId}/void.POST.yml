# POST /api/sheets/{sheetId}/claims/{claimId}/void?reason=... — move a claim to VOID; refused (409) when its
# status does not allow it, (400) without a reason from the sheet's void reasons while it has any.
# A viewer may change nothing: refused before anything is read or written.
guard:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: move
move:
  class: net.officefloor.hq.app.claim.VoidClaim
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveClaim
  govern: [ transaction ]
  next: log
log:
  class: net.officefloor.hq.app.claim.LogClaimStatus
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.RecordClaimStatus
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
