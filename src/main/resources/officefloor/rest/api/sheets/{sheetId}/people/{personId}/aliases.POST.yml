# Give a person an alias (not blank; not equal, ignoring case, to any name or alias on the sheet).
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: add
add:
  class: net.officefloor.hq.app.person.AddAlias
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
