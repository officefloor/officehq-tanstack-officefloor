# Give a person another name they are known by. A blank alias, or one equal (ignoring case) to any name or
# alias on the sheet, is refused (400); a person not on the sheet (404).
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: validate
validate:
  class: net.officefloor.hq.app.alias.ValidateAliasRequest
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: build
build:
  class: net.officefloor.hq.app.alias.BuildAlias
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.alias.SaveAlias
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.alias.AuditAliasAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.alias.RespondWithAlias
  govern: [ transaction ]
