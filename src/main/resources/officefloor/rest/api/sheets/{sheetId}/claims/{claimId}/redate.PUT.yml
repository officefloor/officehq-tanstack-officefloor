# Re-date an OPEN or PENDING claim (a steward only). Its due-by stays as it was fixed and a figure a statement bound it to stays bound; its period follows the new date, and when the sheet numbers claims by period and the period changes it takes the next number of its new period's sequence (its old number is never used again). A refused re-date (not a steward, not OPEN or PENDING, a date after its person's retirement, a claim dated in a closed period or a new date inside one) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.claim.ValidateRedate
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: closed
closed:
  class: net.officefloor.hq.app.period.RefuseClosedClaimRedate
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveRedate
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimRedated
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRedateRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
