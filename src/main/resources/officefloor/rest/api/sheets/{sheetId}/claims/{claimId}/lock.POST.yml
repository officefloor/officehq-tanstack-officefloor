# Opening a claim's editor locks the claim for other users.
validate:
  class: net.officefloor.hq.app.claim.ValidateLock
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.claim.ApplyLock
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveLock
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
