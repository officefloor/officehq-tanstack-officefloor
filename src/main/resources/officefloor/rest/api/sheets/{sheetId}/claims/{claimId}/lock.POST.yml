# Open a claim's editor: locks the claim for every other user until the editor is saved or cancelled, or the sheet's
# today changes. Refused (400), taking no lock, for a viewer, a claim that cannot be edited (not a DRAFT, or dated
# inside a closed period) and a claim another user has locked.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: checkDraft
checkDraft:
  class: net.officefloor.hq.app.claim.CheckClaimDraft
  govern: [ transaction ]
  next: checkPeriod
checkPeriod:
  class: net.officefloor.hq.app.claim.CheckClaimPeriodOpen
  govern: [ transaction ]
  next: checkLock
checkLock:
  class: net.officefloor.hq.app.claim.CheckClaimNotLocked
  govern: [ transaction ]
  next: lock
lock:
  class: net.officefloor.hq.app.claim.LockClaim
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
