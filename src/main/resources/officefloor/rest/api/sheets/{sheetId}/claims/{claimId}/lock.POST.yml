# Open a claim's editor: take its lock for the user. Refused for a viewer, for a claim that cannot be edited (not a
# DRAFT, or in a closed period), which takes no lock, and while another user holds it (409).
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: by
by:
  class: net.officefloor.hq.app.claim.ValidateClaimLock
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: draft
draft:
  class: net.officefloor.hq.app.claim.RefuseNonDraftEdit
  govern: [ transaction ]
  next: closed
closed:
  class: net.officefloor.hq.app.claim.RefuseClosedClaim
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.claim.ApplyClaimLock
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
