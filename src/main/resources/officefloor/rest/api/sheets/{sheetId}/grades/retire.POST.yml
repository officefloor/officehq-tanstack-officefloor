# POST /api/sheets/{sheetId}/grades/retire — retires a grade on the sheet. Body {"grade":"A|B|C"}. Another grade, or one
# already retired, is refused with 422 and nothing is stored or recorded. Responds with the grades, as GET grades does.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: validate
  govern: [ transaction ]
validate:
  class: net.officefloor.hq.app.grade.ValidateGradeRetire
  next: retire
  govern: [ transaction ]
retire:
  class: net.officefloor.hq.app.grade.RetireGrade
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.grade.AuditGradeRetired
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.grade.RespondWithGrades
  govern: [ transaction ]
