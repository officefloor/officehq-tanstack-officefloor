# Retire a grade on the sheet; an unknown grade, or one already retired, is refused.
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: retire
retire:
  class: net.officefloor.hq.app.settings.RetireGrade
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.settings.RespondWithSettings
