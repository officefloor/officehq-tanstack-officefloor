# Retire a grade (GRADE_RETIRED): it can no longer be chosen for a person, by the form, the quick-add bar or an import;
# those on it keep it. A grade other than A, B, C, or one already retired, is refused (400). Responds with the grades.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: validate
validate:
  class: net.officefloor.hq.app.grade.ValidateGradeRetireRequest
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.grade.SaveGradeRetired
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.grade.AuditGradeRetired
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.grade.RespondWithGrades
  govern: [ transaction ]
