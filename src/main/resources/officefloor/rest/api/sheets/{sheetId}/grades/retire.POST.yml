# POST /api/sheets/{sheetId}/grades/retire — retire a grade: from then on it cannot be chosen for a person (see
# GradeRepository); people on it keep it. A grade other than A, B or C, or one already retired, is a 400 and writes
# nothing. Writes GRADE_RETIRED. Responds with the grades (see the grades' GET).
validate:
  class: net.officefloor.hq.app.grade.ValidateRetireGrade
  next: retire
retire:
  class: net.officefloor.hq.app.grade.RetireGrade
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.grade.RecordGradeRetired
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.grade.RespondWithGrades
  govern: [ transaction ]
