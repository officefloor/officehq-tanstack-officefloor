# POST /api/sheets/{sheetId}/grades/retire — retire a grade. Body: { "grade": "A|B|C" }.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: validate
validate:
  class: net.officefloor.hq.app.grade.ValidateGradeRetire
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.grade.ApplyGradeRetire
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.grade.AuditGradeRetired
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.grade.RespondWithGrades
  govern: [ transaction ]
