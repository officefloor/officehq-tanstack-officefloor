# Opening import: lines of name,period,amount (blank lines are skipped): a person on the sheet by name or alias
# (ignoring case), a period on the sheet, an amount of two decimals, 0.00 or more. Every line is checked first; any
# line refused refuses the whole import (400) and nothing is added. Otherwise each line, in order, adds its amount to
# the person's carried figure for the period (OPENING_SET). Answers how many lines went through.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: validate
validate:
  class: net.officefloor.hq.app.opening.ValidateImportOpeningsRequest
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: find
find:
  class: net.officefloor.hq.app.opening.FindOpeningTargets
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.opening.SaveOpenings
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.opening.RespondWithImportOpeningsResult
  govern: [ transaction ]
