# GET /api/sheets/{sheetId}/tree — the ids of the other sheets of its tree (its ancestors and descendants), by id.
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.sheet.RespondWithTree
  govern: [ transaction ]
