# The ids of the other sheets of the sheet's tree: its ancestors nearest first, then its descendants nearest first.
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ readonly-transaction ]
  next: tree
tree:
  class: net.officefloor.hq.app.sheet.LoadTree
  govern: [ readonly-transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.sheet.RespondWithTree
  govern: [ readonly-transaction ]
