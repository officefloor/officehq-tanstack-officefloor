# Defer an OPEN claim until a date after the sheet's today. Until the sheet's today reaches that date the claim counts in no total, is not overdue, cannot be settled and is left unbound by a statement. A refused deferral (not OPEN, a date not after today, unknown claim, a claim dated in a closed period) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.claim.ValidateDefer
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: closed
closed:
  class: net.officefloor.hq.app.period.RefuseClosedClaim
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveDefer
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimDeferred
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditDeferRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
