# POST /api/sheets/{sheetId}/periods/{name}/unlock — unlock a period; refused (409) for anyone but a steward,
# or when it is not locked. A locked period cannot be reopened.
unlock:
  class: net.officefloor.hq.app.period.UnlockPeriod
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.period.RecordPeriodUnlocked
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithPeriod
