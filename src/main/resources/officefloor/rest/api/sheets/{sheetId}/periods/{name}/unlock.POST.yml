# Unlock a period. Only a steward may; an unknown period is a 400; a unlock by anyone else, or of a period
# already unlocked, is a 409.
load:
  class: net.officefloor.hq.app.period.LoadPeriod
  govern: [ transaction ]
  next: unlock
unlock:
  class: net.officefloor.hq.app.period.UnlockPeriod
  govern: [ transaction ]
  next: record
# Audit only once the period is unlocked: a refused unlock writes no line.
record:
  class: net.officefloor.hq.app.period.RecordPeriodUnlocked
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithUnlockedPeriod
  govern: [ transaction ]
