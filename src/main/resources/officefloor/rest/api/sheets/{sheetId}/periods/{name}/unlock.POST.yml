# Unlock a period, by a steward only; an unknown or already unlocked period, or a user who is
# not a steward, is refused (400).
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.period.LoadPeriod
  govern: [ transaction ]
  next: unlock
unlock:
  class: net.officefloor.hq.app.period.UnlockPeriod
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.period.SavePeriodLocked
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.period.AuditPeriodUnlocked
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithPeriod
  govern: [ transaction ]
