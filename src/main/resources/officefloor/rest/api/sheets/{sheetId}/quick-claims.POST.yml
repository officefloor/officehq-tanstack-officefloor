# Quick-add: a DRAFT claim of the amount, dated the sheet's today with an empty note, for the person with the
# typed name (ignoring case), adding them first with grade A when they are not on the sheet. Refused (400) on
# the person and claim forms' terms, all checked before anything is written, so a refusal adds no person.
validate:
  class: net.officefloor.hq.app.quickadd.ValidateQuickAddRequest
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: checkNewPeriod
checkNewPeriod:
  class: net.officefloor.hq.app.claim.CheckClaimInputPeriodOpen
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: person
person:
  class: net.officefloor.hq.app.quickadd.FindQuickPerson
  govern: [ transaction ]
  next: savePerson
savePerson:
  class: net.officefloor.hq.app.quickadd.SaveQuickPerson
  govern: [ transaction ]
  next: personRollup
personRollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: beforeClaim
beforeClaim:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: build
build:
  class: net.officefloor.hq.app.claim.BuildClaim
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveClaim
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimAdded
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
