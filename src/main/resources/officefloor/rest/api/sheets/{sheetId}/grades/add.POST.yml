# Add a grade (GRADE_ADDED): a code of one to three capital letters (surrounding spaces ignored) not yet a grade on the
# sheet; it follows A, B, C and those added before it. Anything else is refused (400). Responds with the grades.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: validate
validate:
  class: net.officefloor.hq.app.grade.ValidateGradeAddRequest
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.grade.SaveGradeAdded
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.grade.AuditGradeAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.grade.RespondWithGrades
  govern: [ transaction ]
