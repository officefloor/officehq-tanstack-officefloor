# POST /api/sheets/{sheetId}/grades/add — add a grade: a code of one to three capital letters (trimmed) not yet a grade
# on the sheet. Body: { "grade": "D" }. Records GRADE_ADDED; responds with the sheet's grades.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: validate
validate:
  class: net.officefloor.hq.app.grade.ValidateGradeAdd
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.grade.ApplyGradeAdd
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.grade.AuditGradeAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.grade.RespondWithGrades
  govern: [ transaction ]
