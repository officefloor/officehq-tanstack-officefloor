# Hold or release an OPEN or PENDING claim (a toggle): held, an OPEN one not bound by a statement counts in no due figure, as a held person's claims do, though its amount still counts in claimed and the claimed-total. A refused toggle (another status, unknown claim) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.claim.ValidateClaimHold
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveClaimHold
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimHold
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditClaimHoldRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
