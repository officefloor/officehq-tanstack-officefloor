# POST /api/sheets/{sheetId}/generate-plans — make the DRAFT claims every plan on the sheet is due, up to the sheet's
# today, by the claim form's rules (a refused date is skipped and tried again next time). Responds { "made": n }.
# A viewer, who changes nothing, makes no claim: the generate step answers 0 for them.
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: generate
generate:
  class: net.officefloor.hq.app.plan.GeneratePlans
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithGeneratedPlans
  govern: [ transaction ]
