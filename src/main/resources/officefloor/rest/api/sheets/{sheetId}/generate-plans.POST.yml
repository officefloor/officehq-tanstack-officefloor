# Make the plans' claims: for every plan, in the order added, a DRAFT claim for each plan date up
# to its end and the sheet's today that it has none for yet, by the claim form's rules (a refused
# date is skipped and tried again next time). Answers how many were made.
validate:
  class: net.officefloor.hq.app.plan.ValidateGeneratePlans
  next: snapshot
# Keep the figures as they were, so the change can audit the ones it moves.
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: generate
generate:
  class: net.officefloor.hq.app.plan.GeneratePlans
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithGeneratedPlans
  govern: [ transaction ]
