# Set a grade's rate from a from-date (blank: from the start) through an optional to-date (blank: no end), replacing any it had for that from-date; a bad from- or to-date, a to-date before the from-date, a bad grade, or a percent that is missing, negative or has more than two decimals, is refused (400).
validate:
  class: net.officefloor.hq.app.rate.ValidateRateRequest
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: build
build:
  class: net.officefloor.hq.app.rate.BuildRate
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.rate.SaveRate
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.rate.AuditRateSet
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.rate.RespondWithRate
  govern: [ transaction ]
