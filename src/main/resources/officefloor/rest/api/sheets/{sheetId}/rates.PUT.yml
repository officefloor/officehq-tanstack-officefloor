# Set a grade's rate, replacing any it had; a bad grade, or a percent that is missing, negative or has more than two decimals, is refused (400).
validate:
  class: net.officefloor.hq.app.rate.ValidateRateRequest
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: build
build:
  class: net.officefloor.hq.app.rate.BuildRate
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.rate.SaveRate
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.rate.AuditRateSet
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.rate.RespondWithRate
  govern: [ transaction ]
