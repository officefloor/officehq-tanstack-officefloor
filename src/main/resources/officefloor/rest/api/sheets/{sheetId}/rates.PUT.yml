# PUT /api/sheets/{sheetId}/rates — set a grade's rate. Body: { "grade": "A|B|C", "pct": "12.50", "from": "YYYY-MM-DD" (optional) }.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: validate
validate:
  class: net.officefloor.hq.app.rate.ValidateRate
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.rate.ApplyRate
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.rate.AuditRateSet
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.rate.RespondWithRate
  govern: [ transaction ]
