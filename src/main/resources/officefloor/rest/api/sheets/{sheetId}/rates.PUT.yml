# Set a grade's rate. Validate the body before touching the store, so a refusal writes nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: rate
rate:
  class: net.officefloor.hq.app.rate.ValidateRate
  next: ensure
ensure:
  class: net.officefloor.hq.app.sheet.EnsureSheet
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.rate.ApplyRate
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.rate.RecordRateSet
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.rate.RespondWithRate
  govern: [ transaction ]
