# PUT /api/sheets/{sheetId}/rates — set a grade's rate. Body: { "grade": "A|B|C", "pct": "12.50" }.
validate:
  class: net.officefloor.hq.app.rate.ValidateRate
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.rate.ApplyRate
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.rate.AuditRateSet
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.rate.RespondWithRate
  govern: [ transaction ]
