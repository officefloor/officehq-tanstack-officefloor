# POST /api/sheets/{sheetId}/people/{personId}/merge-undo — the steward who made the last merge into the person undoes
# it, on the same sheet-today it was made: the merged person is back at the end of the list (their id, grades, terms,
# contact and tags as before) with the claims that came from them (their numbers and status as they are now) and their
# own aliases, which leave the person's; patron and pool changes stay. Records PERSON_MERGE_UNDONE, then the ROLLUP and
# TOTALS lines. 422, storing nothing, for anyone else, any later day, or a person with no merge to undo; 404 for a
# person not on the sheet. Responds with the person restored.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: snapshot
  govern: [ transaction ]
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  next: load
  govern: [ transaction ]
load:
  class: net.officefloor.hq.app.person.LoadPerson
  next: undo
  govern: [ transaction ]
undo:
  class: net.officefloor.hq.app.person.UndoMerge
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.person.AuditPersonMergeUndone
  next: rollup
  govern: [ transaction ]
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.person.RespondWithEditedPerson
  govern: [ transaction ]
