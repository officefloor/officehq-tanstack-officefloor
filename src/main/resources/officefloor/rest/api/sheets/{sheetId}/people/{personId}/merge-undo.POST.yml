# POST /api/sheets/{sheetId}/people/{personId}/merge-undo — undo the last merge into a person, by the steward who made it,
# on the sheet's today it was made. The merged person is back as they stood before it, at the end of the list, with the
# claims that came from them (still the other's) as they are now and their own aliases, which leave the other's (the
# alias their name became is dropped); patron, pool and every other change the merge made stays. Writes
# PERSON_MERGE_UNDONE name=<person restored> from=<person merged into>, then the figures it moved. A person not on the
# sheet is a 404; a user other than that steward, any later day, a person with no merge to undo (or its undo already
# made), or the merged person's name now another person's, is a 400 — none writes anything. Responds with the person
# restored, as stored.
validate:
  class: net.officefloor.hq.app.person.ValidateMergeUndo
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: check
check:
  class: net.officefloor.hq.app.person.CheckMergeUndo
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: undo
undo:
  class: net.officefloor.hq.app.person.UndoMerge
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.person.RecordMergeUndone
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithMergeUndone
