# POST /api/sheets/{sheetId}/crew-members — adds a person to a crew. Body {"crew":"...","personId":1}. The crew's lead, or
# a person already in the crew, is refused with 422 and nothing is stored or recorded.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: validate
  govern: [ transaction ]
validate:
  class: net.officefloor.hq.app.crew.ValidateCrewMember
  next: add
  govern: [ transaction ]
add:
  class: net.officefloor.hq.app.crew.AddCrewMember
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.crew.AuditCrewMemberAdded
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.crew.RespondWithCrewMember
  govern: [ transaction ]
