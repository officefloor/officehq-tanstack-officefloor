# Add a person to a crew. The crew's lead, or a person already in the crew, is refused (a 400) and
# writes nothing.
viewer:
  class: net.officefloor.hq.app.role.CheckCanChange
  next: validate
validate:
  class: net.officefloor.hq.app.crew.ValidateCrewMember
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.crew.SaveCrewMember
  govern: [ transaction ]
  next: audit
# Last before the response: every rule has passed and the change is saved.
audit:
  class: net.officefloor.hq.app.crew.AuditCrewMemberAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.crew.RespondWithCrewMember
  govern: [ transaction ]
