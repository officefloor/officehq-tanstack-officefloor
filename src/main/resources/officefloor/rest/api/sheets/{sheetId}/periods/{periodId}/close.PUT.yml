# PUT /api/sheets/{sheetId}/periods/{periodId}/close — close a period, fixing its due-total.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: period
period:
  class: net.officefloor.hq.app.period.LoadPeriod
  govern: [ transaction ]
  next: close
close:
  class: net.officefloor.hq.app.period.ClosePeriod
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.period.AuditPeriodClosed
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithPeriod
  govern: [ transaction ]
