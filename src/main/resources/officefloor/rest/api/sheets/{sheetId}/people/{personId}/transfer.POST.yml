# POST /api/sheets/{sheetId}/people/{personId}/transfer — transfer a person to another sheet by id, by a steward. The person
# arrives there with every grade they were given (and its from-date), their terms, contact and aliases, and their claims
# with their status, dates, notes, tags, frozen figures and logs; each claim that had a number receives the next number of
# the other sheet, in the order the claims were opened (by the sheet's today when each was opened, then as added). Each claim
# keeps the figure a statement bound it to, and their statements go with them; references are not carried. They leave this sheet
# entirely (patron links, pool memberships, holds and watches dropped). A body without the sheet is a 400, a person not on
# the sheet a 404. When one of their names (name or alias, as names are compared) is already a name or alias of a person
# on the other sheet, they merge into that person there as a merge does: their claims follow that person's, their statements join that person's (who keeps their own last statement, or having
# none takes the transferred person's), their name and
# aliases join that person's aliases, and their grades, terms and contact are lost. A user other than a steward, a retired
# person, this sheet's own id, an archived sheet, names leading to more than one person there or to a retired one, or
# (when not merging) a contact already on the other sheet is a 400 — none writes anything. Responds with the person as
# stored there (the person merged into, when merged).
validate:
  class: net.officefloor.hq.app.person.ValidateTransfer
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: check
check:
  class: net.officefloor.hq.app.person.CheckTransfer
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: transfer
transfer:
  class: net.officefloor.hq.app.person.TransferPerson
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.person.RecordPersonTransferred
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithTransfer
