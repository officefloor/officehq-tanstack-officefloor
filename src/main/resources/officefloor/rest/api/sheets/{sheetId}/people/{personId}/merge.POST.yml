# Merge a person into another on the sheet. Validate the body before touching the store, so a refusal writes nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: merge
merge:
  class: net.officefloor.hq.app.person.ValidateMerge
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: rollup-before
rollup-before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.person.MergePerson
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.person.RecordPersonMerged
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
