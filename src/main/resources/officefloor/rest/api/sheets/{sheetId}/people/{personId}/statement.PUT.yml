# PUT /api/sheets/{sheetId}/people/{personId}/statement — take a statement for the person.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: person
person:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: take
take:
  class: net.officefloor.hq.app.statement.TakeStatement
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.statement.AuditStatement
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
