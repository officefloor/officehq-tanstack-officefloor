# Close a period (an open or soft-closed one), fixing its due-total afresh. An unknown period is a
# 400; one already closed (not soft-closed), or a close by a role the permission matrix does not
# allow, is a 409.
load:
  class: net.officefloor.hq.app.period.LoadPeriod
  govern: [ transaction ]
  next: close
close:
  class: net.officefloor.hq.app.period.ClosePeriod
  govern: [ transaction ]
  next: record
# Audit only once the period is closed: a refused close writes no line.
record:
  class: net.officefloor.hq.app.period.RecordPeriodClosed
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithClosedPeriod
  govern: [ transaction ]
