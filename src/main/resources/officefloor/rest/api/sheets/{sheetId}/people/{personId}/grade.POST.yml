# Give a person a grade from the sheet's today, from their row, exactly as the person form would save it.
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: grade
grade:
  class: net.officefloor.hq.app.person.GradePerson
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
