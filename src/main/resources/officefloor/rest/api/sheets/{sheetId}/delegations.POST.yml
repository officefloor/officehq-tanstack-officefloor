# A steward delegates the steward role to a user, from a date to a date (inclusive).
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: validate
validate:
  class: net.officefloor.hq.app.settings.ValidateDelegation
  next: save
save:
  class: net.officefloor.hq.app.settings.SaveDelegation
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.settings.RespondWithSettings
