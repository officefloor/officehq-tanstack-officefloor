# A steward delegates the steward role to a user from a from-date to a to-date, both included, by the sheet's today.
# A refused delegation (no name, bad dates, to before from, not made by a steward) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.delegation.ValidateDelegation
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.delegation.SaveDelegation
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.delegation.AuditDelegated
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.delegation.RespondWithDelegation
  govern: [ transaction ]
