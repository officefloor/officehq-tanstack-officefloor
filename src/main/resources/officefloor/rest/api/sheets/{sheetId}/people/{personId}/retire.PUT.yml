# PUT /api/sheets/{sheetId}/people/{personId}/retire — retire the person from a date.
# Body: { "date": "YYYY-MM-DD" } (blank = the sheet's today).
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: validate
validate:
  class: net.officefloor.hq.app.person.ValidateRetire
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: person
person:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.person.ApplyRetire
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.person.AuditPersonRetired
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
