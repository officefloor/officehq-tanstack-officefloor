# PUT /api/sheets/{sheetId}/people/{personId}/retire — retire a person from a date. Body
# {"from":"yyyy-mm-dd"}; a blank date is the sheet's today. A date that is not real is refused with
# 400 and nothing is stored; 404 for a person not on the sheet. Retiring again moves the date.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: validate
  govern: [ transaction ]
validate:
  class: net.officefloor.hq.app.person.ValidateRetire
  next: load
  govern: [ transaction ]
load:
  class: net.officefloor.hq.app.person.LoadPerson
  next: retire
  govern: [ transaction ]
retire:
  class: net.officefloor.hq.app.person.RetirePerson
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.person.AuditPersonRetired
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.person.RespondWithEditedPerson
  govern: [ transaction ]
