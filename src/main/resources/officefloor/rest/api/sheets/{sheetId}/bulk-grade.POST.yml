# Give the selected people a grade together: each, in list order (by their position), gets the
# grade from the from-date (blank: the sheet's today) exactly as the person form would save it. Answers
# how many were graded (none for a viewer).
guard:
  class: net.officefloor.hq.app.history.RefuseAsOf
  next: grade
grade:
  class: net.officefloor.hq.app.person.BulkGradePeople
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithBulkGrade
