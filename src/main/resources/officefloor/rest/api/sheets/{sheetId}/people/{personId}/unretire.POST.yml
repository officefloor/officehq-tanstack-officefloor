# Unretire a retired person on the sheet's today; the retirement is kept as a past one (from - the day unretired).
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: unretire
unretire:
  class: net.officefloor.hq.app.person.UnretirePerson
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
