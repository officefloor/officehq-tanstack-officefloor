# Unretire a retired person on the sheet's today: their retirement is kept as a past one.
validate:
  class: net.officefloor.hq.app.person.ValidateUnretire
  next: snapshot
# The sheet's figures before the change, so the change can audit what it moved.
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: unretire
unretire:
  class: net.officefloor.hq.app.person.UnretirePerson
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
