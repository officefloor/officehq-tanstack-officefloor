# Unretire a retired person on the sheet's today; one not retired is refused (400), a person not on the sheet (404).
# The retirement is kept as a past one, from its date to the sheet's today: a claim dated after the one and before
# the other is refused as one after a retirement is.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: unretire
unretire:
  class: net.officefloor.hq.app.person.UnretirePerson
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.person.AuditPersonUnretired
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
