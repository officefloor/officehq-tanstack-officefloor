# Archive the sheet: a steward only. Everything stays visible; every change after is refused.
guard:
  class: net.officefloor.hq.app.history.RefuseAsOf
  next: archive
archive:
  class: net.officefloor.hq.app.sheet.ArchiveSheet
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.sheet.RespondWithSheet
