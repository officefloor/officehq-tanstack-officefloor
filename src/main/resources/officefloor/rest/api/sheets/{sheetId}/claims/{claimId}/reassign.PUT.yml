# Move a DRAFT, OPEN or PENDING claim to another person on the sheet (by default a steward only; the sheet's permission matrix decides). It keeps its date, takes the next number in its sequence when it has one (a draft stays unnumbered), and loses any figure a statement bound it to. A refused move (a role the permission matrix does not allow, a SETTLED or VOID claim, a correction, an unknown or retired person, a claim whose due-by falls in a closed period) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.claim.ValidateReassign
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: closed
closed:
  class: net.officefloor.hq.app.period.RefuseClosedClaimMove
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveReassign
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimReassigned
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditReassignRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
