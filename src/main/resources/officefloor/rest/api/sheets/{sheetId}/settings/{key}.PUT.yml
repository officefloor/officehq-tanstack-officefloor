# PUT /api/sheets/{sheetId}/settings/{key} — set a sheet setting. The keys are clerk-limit: an amount with up to
# two decimals, or blank for no limit; cap: likewise, the most a person's due-total may be (blank: none); and floor: an amount with up to two decimals, the least a claim's live due
# may be (1.00 until set); terms; late-pct; and policy-date: yyyy-MM-dd, or blank for the sheet's today; entry-date: yyyy-MM-dd, or blank for off (undated). Writes the figures the change moved (ROLLUP, TOTALS). An unknown key or a value that is not such an amount is a 400 and writes
# nothing. grace-days: a whole number of days, or blank for off (undated). Every key but policy-date,
# period-numbering-from and grace-days is dated: the body's from (yyyy-MM-dd; blank: the
# sheet's today) is the date its value is in force from, keeping the values from other dates (one from the same date
# is replaced); a from that is not such a date is a 400. Responds with the setting as stored.
validate:
  class: net.officefloor.hq.app.setting.ValidateSetting
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.setting.SaveSetting
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.setting.RecordSettingChanged
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.setting.RespondWithSetting
