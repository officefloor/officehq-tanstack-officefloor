# PUT /api/sheets/{sheetId}/settings/{key} — set a sheet setting. The only key is clerk-limit: an amount with up to
# two decimals, or blank for no limit. An unknown key or a value that is not such an amount is a 400 and writes
# nothing. Responds with the setting as stored.
validate:
  class: net.officefloor.hq.app.setting.ValidateSetting
  next: save
save:
  class: net.officefloor.hq.app.setting.SaveSetting
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.setting.RecordSettingChanged
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.setting.RespondWithSetting
