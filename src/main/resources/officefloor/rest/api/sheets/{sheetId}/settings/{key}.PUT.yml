# PUT /api/sheets/{sheetId}/settings/{key} — set a sheet setting. The keys are clerk-limit: an amount with up to
# two decimals, or blank for no limit; cap: likewise, the most a person's due-total may be (blank: none); and floor: an amount with up to two decimals, the least a claim's live due
# may be (1.00 until set); terms; late-pct; and policy-date: yyyy-MM-dd, or blank for the sheet's today. Writes the figures the change moved (ROLLUP, TOTALS). An unknown key or a value that is not such an amount is a 400 and writes
# nothing. Responds with the setting as stored.
validate:
  class: net.officefloor.hq.app.setting.ValidateSetting
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.setting.SaveSetting
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.setting.RecordSettingChanged
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.setting.RespondWithSetting
