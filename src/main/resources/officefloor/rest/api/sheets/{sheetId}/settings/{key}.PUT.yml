# Validate first so an unknown key or invalid value is a 400 and nothing is written. The audit line
# is written once the setting is stored, then the ROLLUP/TOTALS lines for any figure it moved (the floor).
validate:
  class: net.officefloor.hq.app.setting.ValidateSetting
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.setting.SaveSetting
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.setting.AuditSettingChanged
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.setting.RespondWithSetting
  govern: [ transaction ]
