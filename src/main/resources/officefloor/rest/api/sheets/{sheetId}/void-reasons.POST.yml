# Add a void reason to the sheet. While the list is not empty a claim is voided only with a reason chosen from it.
# A refused add (blank, a reason already on the list) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.voidreason.ValidateVoidReason
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.voidreason.SaveVoidReason
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.voidreason.AuditVoidReasonAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.voidreason.RespondWithVoidReason
  govern: [ transaction ]
