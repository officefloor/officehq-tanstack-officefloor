# POST /api/sheets/{sheetId}/void-reasons — adds a void reason to the sheet (body: {reason, user}), trimmed.
# A blank reason, one already on the list, or a viewer is refused (400) and nothing is stored. Recorded as
# VOID_REASON_ADDED.
validate:
  class: net.officefloor.hq.app.voidreason.ValidateVoidReason
  next: save
save:
  class: net.officefloor.hq.app.voidreason.SaveVoidReason
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.voidreason.AuditVoidReasonAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.voidreason.RespondWithVoidReason
  govern: [ transaction ]
