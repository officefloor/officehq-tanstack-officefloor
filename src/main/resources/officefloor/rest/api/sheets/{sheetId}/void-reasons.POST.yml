# Add a reason (trimmed) to the sheet's void reasons (VOID_REASON_ADDED); a blank reason or one already on the list
# is refused (400). Responds with the sheet's void reasons, in the order they were added.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: validate
validate:
  class: net.officefloor.hq.app.voidreason.ValidateVoidReasonRequest
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.voidreason.SaveVoidReason
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.voidreason.AuditVoidReasonAdded
  govern: [ transaction ]
  next: reasons
reasons:
  class: net.officefloor.hq.app.voidreason.LoadVoidReasons
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.voidreason.RespondWithVoidReasons
  govern: [ transaction ]
