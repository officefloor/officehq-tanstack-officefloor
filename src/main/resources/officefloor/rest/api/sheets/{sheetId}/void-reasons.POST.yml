# POST /api/sheets/{sheetId}/void-reasons — add a void reason. Body: { "reason": "<text>" }.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: validate
validate:
  class: net.officefloor.hq.app.voidreason.ValidateVoidReason
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.voidreason.ApplyVoidReason
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.voidreason.AuditVoidReasonAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.voidreason.RespondWithVoidReason
  govern: [ transaction ]
