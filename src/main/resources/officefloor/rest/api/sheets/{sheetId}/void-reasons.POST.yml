# Add a reason to the sheet's void reasons; a blank one, or one already on the list, is refused.
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: validate
validate:
  class: net.officefloor.hq.app.settings.ValidateVoidReason
  next: save
save:
  class: net.officefloor.hq.app.settings.SaveVoidReason
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.settings.RespondWithSettings
