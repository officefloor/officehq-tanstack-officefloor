# POST /api/sheets/{sheetId}/void-reasons — add a void reason (trimmed) to the sheet. A blank one or one already on the
# sheet's list is a 400 and writes nothing. Responds 201 with the reason.
validate:
  class: net.officefloor.hq.app.voidreason.ValidateVoidReason
  next: add
add:
  class: net.officefloor.hq.app.voidreason.AddVoidReason
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.voidreason.RecordVoidReasonAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.voidreason.RespondWithVoidReasonCreated
