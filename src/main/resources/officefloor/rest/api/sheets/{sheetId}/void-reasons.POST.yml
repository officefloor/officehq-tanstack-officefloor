# Add a void reason. Validate the body before touching the store, so a refusal writes nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: reason
reason:
  class: net.officefloor.hq.app.voidreason.ValidateVoidReason
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: ensure
ensure:
  class: net.officefloor.hq.app.sheet.EnsureSheet
  govern: [ transaction ]
  next: build
build:
  class: net.officefloor.hq.app.voidreason.BuildVoidReason
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.voidreason.RecordVoidReasonAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.voidreason.RespondWithVoidReason
  govern: [ transaction ]
