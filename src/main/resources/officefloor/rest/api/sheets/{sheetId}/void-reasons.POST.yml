# POST /api/sheets/{sheetId}/void-reasons — add a void reason to the sheet; refused for a blank one or
# one already on the list. A viewer may change nothing: refused before anything is read or written.
guard:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: validate
validate:
  class: net.officefloor.hq.app.voidreason.ValidateVoidReason
  govern: [ transaction ]
  next: add
add:
  class: net.officefloor.hq.app.voidreason.AddVoidReason
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.voidreason.RecordVoidReasonAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.voidreason.RespondWithVoidReason
