# POST /api/sheets/{sheetId}/periods/{periodId}/unlock — unlock a period (a locked period cannot be reopened). Only a steward
# may unlock. A period not on the sheet or already unlocked, or a user who is not a steward, is a 400 and writes nothing.
# Responds with the period as stored.
validate:
  class: net.officefloor.hq.app.period.ValidatePeriodClose
  next: load
load:
  class: net.officefloor.hq.app.period.LoadPeriod
  govern: [ transaction ]
  next: unlock
unlock:
  class: net.officefloor.hq.app.period.UnlockPeriod
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.period.RecordPeriodUnlocked
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithPeriod
  govern: [ transaction ]
