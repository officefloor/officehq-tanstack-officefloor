# PUT /api/sheets/{sheetId}/periods/{name}/close — close a period, fixing its due-total (the figures of
# the counting claims dated in it) at this moment. 409 for a period not on the sheet or already closed.
close:
  class: net.officefloor.hq.app.period.ClosePeriod
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.period.AuditPeriodClosed
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.period.RespondWithPeriod
  govern: [ transaction ]
