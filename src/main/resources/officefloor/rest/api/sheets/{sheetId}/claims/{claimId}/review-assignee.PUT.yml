# PUT /api/sheets/{sheetId}/claims/{claimId}/review-assignee — a steward assigns a REVIEW claim to the user given. A blank
# user, a claim of any other status, or anyone else is a 409 and a claim not on the sheet a 404, neither writing anything.
# Responds with the claim as stored.
validate:
  class: net.officefloor.hq.app.claim.ValidateReviewAssign
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.claim.ApplyReviewAssign
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveReviewAssign
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.RecordReviewAssigned
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
