# Assign a REVIEW claim's review to the body's user (trimmed), replacing any earlier one, and write REVIEW_ASSIGNED.
# A blank user, a claim in any other status, or a user who is not a steward (by role or delegation) is refused (400)
# and writes nothing.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: validate
validate:
  class: net.officefloor.hq.app.claim.ValidateReviewAssignRequest
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: check
check:
  class: net.officefloor.hq.app.claim.CheckReviewAssign
  govern: [ transaction ]
  next: assign
assign:
  class: net.officefloor.hq.app.claim.AssignReview
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditReviewAssigned
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
