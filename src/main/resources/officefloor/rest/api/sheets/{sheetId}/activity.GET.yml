# The sheet's activity: for every user (by=) and every event in the sheet's audit lines, "<user> <EVENT> <count>",
# sorted by user then event. 404 for an id never loaded.
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ readonly-transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.audit.RespondWithActivity
  govern: [ readonly-transaction ]
