# The sheet's activity: one line "<user> <EVENT> <count>" for every user and event in its audit lines, sorted by user then event.
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ readonly-transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.audit.RespondWithActivity
  govern: [ readonly-transaction ]
