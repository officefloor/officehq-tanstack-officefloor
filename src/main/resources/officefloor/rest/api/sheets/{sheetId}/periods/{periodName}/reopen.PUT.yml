# Reopen a closed period, making its due-total live again. Only a role the sheet's permission matrix allows may (by default a steward). A refused reopen (no signed-in user,
# a role the permission matrix does not allow, unknown sheet or period, not closed) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.period.ValidatePeriodClose
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: reopen
reopen:
  class: net.officefloor.hq.app.period.ReopenPeriod
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.period.AuditPeriodReopened
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithPeriod
  govern: [ transaction ]
