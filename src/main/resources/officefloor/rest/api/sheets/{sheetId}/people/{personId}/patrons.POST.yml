# Name another person on the sheet as one of a person's patrons (not themselves, not twice).
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: add
add:
  class: net.officefloor.hq.app.person.AddPatron
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
