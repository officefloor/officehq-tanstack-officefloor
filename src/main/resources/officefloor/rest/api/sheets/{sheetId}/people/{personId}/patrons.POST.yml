# Name another person on the sheet as one of the person's patrons. The person themselves, someone not on the
# sheet, or someone already their patron is refused (400); a person not on the sheet (404).
validate:
  class: net.officefloor.hq.app.patron.ValidatePatronRequest
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: build
build:
  class: net.officefloor.hq.app.patron.BuildPatron
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.patron.SavePatron
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.patron.AuditPatronAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.patron.RespondWithPatron
  govern: [ transaction ]
