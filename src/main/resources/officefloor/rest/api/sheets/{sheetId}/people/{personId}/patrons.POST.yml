# POST /api/sheets/{sheetId}/people/{personId}/patrons — name another person on the sheet as the person's patron.
# Body: { "patronId": <id> }.
validate:
  class: net.officefloor.hq.app.person.ValidatePatron
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: person
person:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.person.ApplyPatron
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.person.AuditPatronAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
