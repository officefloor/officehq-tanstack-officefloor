# Add a grade to the sheet: a code of one to three capital letters (trimmed) not yet one of its grades; anything
# else is refused. It is listed after the sheet's other grades.
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: add
add:
  class: net.officefloor.hq.app.settings.AddGrade
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.settings.RespondWithSettings
