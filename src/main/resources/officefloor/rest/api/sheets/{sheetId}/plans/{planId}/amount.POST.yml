# Change a plan's amount from the sheet's today. Refused (400, nothing written) when the amount is bad.
validate:
  class: net.officefloor.hq.app.plan.ValidatePlanAmount
  next: snapshot
# Keep the figures as they were, so the drafts' edits can audit the ones they move.
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.plan.LoadPlan
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.plan.ChangePlanAmount
  govern: [ transaction ]
  next: drafts
# The claims the plan made that are still DRAFT take the new amount, as the claim form edits them.
drafts:
  class: net.officefloor.hq.app.plan.ChangePlanDrafts
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlans
  govern: [ transaction ]
