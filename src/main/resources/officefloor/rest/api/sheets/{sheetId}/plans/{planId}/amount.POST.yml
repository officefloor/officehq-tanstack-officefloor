# Change a plan's amount from the sheet's today: the claims generated from then on are made of the new amount, those
# already generated keep theirs, but for those still DRAFT, which are edited to it as the claim form would edit them (one
# the claim form would refuse keeps its amount). A refused change (a bad amount, no today, unknown plan) writes nothing, not even an
# audit line.
validate:
  class: net.officefloor.hq.app.plan.ValidatePlanAmount
  next: load
load:
  class: net.officefloor.hq.app.plan.LoadPlan
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.plan.SavePlanAmount
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.plan.AuditPlanAmount
  govern: [ transaction ]
  next: drafts
drafts:
  class: net.officefloor.hq.app.plan.EditPlanDrafts
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlan
  govern: [ transaction ]
