# Change a plan's amount from the sheet's today (a bad amount is refused), its generated DRAFT claims taking it too.
# One change: if any draft's edit is refused, nothing is written. The change step runs its own transaction
# (rolled back on a refusal), so it is not governed here. Answers the sheet's plans.
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: change
change:
  class: net.officefloor.hq.app.plan.ChangePlanAmount
  next: load
load:
  class: net.officefloor.hq.app.plan.LoadPlans
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlans
