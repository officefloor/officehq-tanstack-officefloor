# Change a plan's amount on the sheet's today: claims generated from then on take it, and the claims it
# already generated that are still DRAFT are edited to it as the claim form edits them (CLAIM_EDITED);
# claims in any other status keep theirs. An amount the claim form would refuse is a 400 and writes nothing.
# A viewer may change nothing: refused before anything is read or written.
viewer:
  class: net.officefloor.hq.app.role.CheckCanChange
  next: validate
validate:
  class: net.officefloor.hq.app.plan.ValidatePlanAmount
  next: loadSheet
loadSheet:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: loadPlan
loadPlan:
  class: net.officefloor.hq.app.plan.LoadPlan
  govern: [ transaction ]
  next: before
# The sheet's figures before the change, so the rollup lines tell which moved.
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: change
change:
  class: net.officefloor.hq.app.plan.ChangePlanAmount
  govern: [ transaction ]
  next: drafts
drafts:
  class: net.officefloor.hq.app.claim.EditPlanDrafts
  govern: [ transaction ]
  next: rollup
# After the change's own lines: the figures it moved.
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithPausedPlan
  govern: [ transaction ]
