# POST /api/sheets/{sheetId}/plans/{planId}/amount — change a plan's amount (body: {amount, user}) on the
# sheet's today. The claims it generates from then on are of the new amount; those already generated that are
# still DRAFT are edited to it as the claim form would (CLAIM_EDITED; one it would refuse keeps its amount), the
# others keep theirs. The plan lists its changes, oldest first. Refused (400), storing nothing, by a viewer, on an archived
# sheet, for a plan not on the sheet, or when the amount is not a number with up to two decimals. Recorded as
# PLAN_CHANGED. Answers the plan.
validate:
  class: net.officefloor.hq.app.plan.ValidatePlanAmount
  next: load
load:
  class: net.officefloor.hq.app.plan.LoadPlan
  govern: [ transaction ]
  next: change
change:
  class: net.officefloor.hq.app.plan.ChangePlanAmount
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlan
  govern: [ transaction ]
