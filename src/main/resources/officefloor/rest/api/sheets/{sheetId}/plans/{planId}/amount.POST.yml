# Changes the plan's amount from the sheet's today (PLAN_CHANGED): claims generated from then on are of the new amount,
# those already generated keep theirs. A bad amount is refused (400).
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: validate
validate:
  class: net.officefloor.hq.app.plan.ValidatePlanAmountRequest
  next: load
load:
  class: net.officefloor.hq.app.plan.LoadPlan
  govern: [ transaction ]
  next: change
change:
  class: net.officefloor.hq.app.plan.ChangePlanAmount
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlan
  govern: [ transaction ]
