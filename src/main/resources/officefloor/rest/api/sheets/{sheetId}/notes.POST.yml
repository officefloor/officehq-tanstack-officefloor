# Add a note to the sheet, dated the sheet's today. A refused add (blank) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.note.ValidateNote
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.note.SaveNote
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.note.AuditNoteAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.note.RespondWithNote
  govern: [ transaction ]
