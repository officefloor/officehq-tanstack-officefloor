# Add a note (trimmed) to the sheet, dated the sheet's today (NOTE_ADDED); a blank note is refused (400). Responds
# with the sheet's notes, newest first.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: validate
validate:
  class: net.officefloor.hq.app.note.ValidateNoteRequest
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.note.SaveNote
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.note.AuditNoteAdded
  govern: [ transaction ]
  next: notes
notes:
  class: net.officefloor.hq.app.note.LoadNotes
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.note.RespondWithNotes
  govern: [ transaction ]
