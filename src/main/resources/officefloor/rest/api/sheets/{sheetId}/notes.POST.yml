# POST /api/sheets/{sheetId}/notes — add a note. Body: { "text": "..." }.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: validate
validate:
  class: net.officefloor.hq.app.note.ValidateNote
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.note.ApplyNote
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.note.AuditNoteAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.note.RespondWithNote
  govern: [ transaction ]
