# Soft-close a period, fixing its due-total and each person's figure as they stand now while claims dated in it can
# still be added and changed; an unknown, already closed or soft-closed period, or a user whose role the permission matrix does not allow closing, is refused (400).
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.period.LoadPeriod
  govern: [ transaction ]
  next: softClose
softClose:
  class: net.officefloor.hq.app.period.SoftClosePeriod
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.period.SavePeriodClosed
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.period.AuditPeriodSoftClosed
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithPeriod
  govern: [ transaction ]
