# The sheet's rates, by grade and from-date (from the start first).
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ readonly-transaction ]
  next: rates
rates:
  class: net.officefloor.hq.app.rate.LoadRates
  govern: [ readonly-transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.rate.RespondWithRates
  govern: [ readonly-transaction ]
