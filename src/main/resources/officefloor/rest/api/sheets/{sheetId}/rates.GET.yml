# The sheet's rates, one per grade that has one.
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ readonly-transaction ]
  next: rates
rates:
  class: net.officefloor.hq.app.rate.LoadRates
  govern: [ readonly-transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.rate.RespondWithRates
  govern: [ readonly-transaction ]
