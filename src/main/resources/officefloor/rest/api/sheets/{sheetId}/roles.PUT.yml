# Assign a user name a role (clerk or steward). Validate the body before touching the store, so a refusal writes nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: role
role:
  class: net.officefloor.hq.app.access.ValidateRole
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: ensure
ensure:
  class: net.officefloor.hq.app.sheet.EnsureSheet
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.access.ApplyRole
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.access.RecordRoleSet
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.access.RespondWithRole
  govern: [ transaction ]
