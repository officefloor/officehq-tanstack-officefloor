# Give a user name a role on the sheet (clerk or steward), replacing any it had; a blank name or another role is refused (400).
validate:
  class: net.officefloor.hq.app.setting.ValidateRoleRequest
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.setting.SaveRole
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.setting.AuditRoleSet
  govern: [ transaction ]
  next: settings
settings:
  class: net.officefloor.hq.app.setting.LoadSettings
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.setting.RespondWithSettings
  govern: [ transaction ]
