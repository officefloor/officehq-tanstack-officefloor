# Assign a user name a role (clerk or steward). A refused assignment (no name, unknown role, unknown sheet) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.role.ValidateRole
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.role.SaveRole
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.role.AuditRoleSet
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.role.RespondWithRole
  govern: [ transaction ]
