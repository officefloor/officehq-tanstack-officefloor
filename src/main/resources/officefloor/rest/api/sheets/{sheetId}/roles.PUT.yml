# PUT /api/sheets/{sheetId}/roles — give a user name a role. Body: { "user": "<name>", "role": "clerk|steward" }.
validate:
  class: net.officefloor.hq.app.role.ValidateRole
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.role.ApplyRole
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.role.AuditRoleSet
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.role.RespondWithRole
  govern: [ transaction ]
