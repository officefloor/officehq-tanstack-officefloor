# Move a person up or down the sheet's list, swapping places with the one above or below (the top person
# cannot move up nor the bottom one down).
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: move
move:
  class: net.officefloor.hq.app.person.MovePerson
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
