# POST /api/sheets/{sheetId}/people/{personId}/move — swap the person with the one above (direction: up) or below
# (direction: down) them in the list. A body without a direction of up or down or without by, moving the top person up
# or the bottom one down, is a 400 and a person not on the sheet a 404, none writing anything. Responds with the person.
validate:
  class: net.officefloor.hq.app.person.ValidateMove
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: move
move:
  class: net.officefloor.hq.app.person.MovePerson
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.person.RecordPersonMoved
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
