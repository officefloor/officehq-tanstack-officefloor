# Move a person up or down the list (?direction=up|down), swapping them with the person above or below; the top
# person cannot move up nor the bottom one down (400), a person not on the sheet (404). The list, the rollup lines
# and every action that works in list order follow the people's positions.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: move
move:
  class: net.officefloor.hq.app.person.MovePerson
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.person.AuditPersonMoved
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
