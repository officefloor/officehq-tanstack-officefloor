# PUT /api/sheets/{sheetId}/periods/{periodId}/soft-close — soft-close a period, fixing its due-total while claims dated in it stay open to change.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: period
period:
  class: net.officefloor.hq.app.period.LoadPeriod
  govern: [ transaction ]
  next: close
close:
  class: net.officefloor.hq.app.period.SoftClosePeriod
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.period.AuditPeriodSoftClosed
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithPeriod
  govern: [ transaction ]
