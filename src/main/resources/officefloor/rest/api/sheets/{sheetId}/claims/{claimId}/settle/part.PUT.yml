# PUT /api/sheets/{sheetId}/claims/{claimId}/settle/part?amount=N.NN — split an amount off an OPEN claim, as the split does,
# and settle the new claim at once, as the settle does; a refused settle (judged on the original) or split refuses it all.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: claim
claim:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: check
check:
  class: net.officefloor.hq.app.claim.CheckPartSettle
  govern: [ transaction ]
  next: split
split:
  class: net.officefloor.hq.app.claim.ApplySplit
  govern: [ transaction ]
  next: settle
settle:
  class: net.officefloor.hq.app.claim.ApplyPartSettle
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditPartSettle
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
