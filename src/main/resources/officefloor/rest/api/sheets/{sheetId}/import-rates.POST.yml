# The rate import box: lines of grade,rate,from,to, each set as the rate form would. Every line is
# checked by the rate form's rules before any is set; one refused line sets nothing.
validate:
  class: net.officefloor.hq.app.rate.ValidateImportRates
  next: save
save:
  class: net.officefloor.hq.app.rate.SaveImportRates
  govern: [ transaction ]
