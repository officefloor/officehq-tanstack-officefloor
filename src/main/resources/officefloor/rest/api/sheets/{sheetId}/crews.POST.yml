# Add a crew with its lead. Validate the body before touching the store, so a refusal writes nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: crew
crew:
  class: net.officefloor.hq.app.crew.ValidateCrew
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: ensure
ensure:
  class: net.officefloor.hq.app.sheet.EnsureSheet
  govern: [ transaction ]
  next: build
build:
  class: net.officefloor.hq.app.crew.BuildCrew
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.crew.RecordCrewAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.crew.RespondWithCrewsNow
  govern: [ transaction ]
