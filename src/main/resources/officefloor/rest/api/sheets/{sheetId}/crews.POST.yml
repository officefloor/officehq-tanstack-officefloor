# POST /api/sheets/{sheetId}/crews — add a crew. Body: { "name": "<text>", "leadId": <id> }. Answers the sheet's crews.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: validate
validate:
  class: net.officefloor.hq.app.crew.ValidateCrew
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.crew.ApplyCrew
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.crew.AuditCrewAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.crew.RespondWithCrews
  govern: [ transaction ]
