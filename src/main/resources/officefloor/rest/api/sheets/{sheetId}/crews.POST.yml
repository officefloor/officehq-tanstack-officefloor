# Add a crew (CREW_ADDED): a name (trimmed) and a lead (a person on the sheet). A blank name, one already a crew's on
# the sheet, or a lead not on the sheet, is refused (400). Responds with the sheet's crews.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: validate
validate:
  class: net.officefloor.hq.app.crew.ValidateCrewRequest
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.crew.SaveCrew
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.crew.AuditCrewAdded
  govern: [ transaction ]
  next: crews
crews:
  class: net.officefloor.hq.app.crew.LoadCrews
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.crew.RespondWithCrews
  govern: [ transaction ]
