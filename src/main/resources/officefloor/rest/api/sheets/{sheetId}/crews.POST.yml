# POST /api/sheets/{sheetId}/crews — adds a crew. Body {"name":"...","leadId":1}, the name trimmed. A blank name, one
# already a crew of the sheet, or a lead not a person of the sheet, is refused with 422 and nothing is stored or recorded.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: validate
  govern: [ transaction ]
validate:
  class: net.officefloor.hq.app.crew.ValidateCrew
  next: add
  govern: [ transaction ]
add:
  class: net.officefloor.hq.app.crew.AddCrew
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.crew.AuditCrewAdded
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.crew.RespondWithCrew
  govern: [ transaction ]
