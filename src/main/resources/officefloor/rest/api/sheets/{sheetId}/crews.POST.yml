# Add a crew: a name (required, trimmed, unique on the sheet) and a lead (a person on the sheet). Answers the sheet's crews.
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: validate
validate:
  class: net.officefloor.hq.app.crew.ValidateCrew
  next: save
save:
  class: net.officefloor.hq.app.crew.SaveCrew
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.crew.LoadCrews
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.crew.RespondWithCrews
