# Add a crew with its lead to the sheet. A refused add (blank, a name already a crew, an unknown lead) writes
# nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.crew.ValidateCrew
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.crew.SaveCrew
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.crew.AuditCrewAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.crew.RespondWithCrew
  govern: [ transaction ]
