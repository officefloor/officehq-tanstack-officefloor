# Year-end rollover, by a steward only: generates the next fiscal year's twelve monthly periods exactly as
# generate-fiscal-year does (each audited as PERIOD_ADDED), then adds each person's open figure at the end of the old
# year's last period (the dues of their claims belonging to a period of the old year, OPEN or PENDING at that period's
# end, counted as the period figures count them) to their carried figure for the new year's first period, each
# audited as OPENING_SET, then records ROLLOVER fy=<old FY> periods=<made>, then
# soft-closes every period of the old year still open, in start-date order, each as a soft close would
# (PERIOD_SOFT_CLOSED). A year that is not four digits, a user who
# is not a steward, or an old year with no periods is refused (400). Answers how many periods were made.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: build
build:
  class: net.officefloor.hq.app.rollover.BuildRollover
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.period.SaveGeneratedPeriods
  govern: [ transaction ]
  next: auditPeriods
auditPeriods:
  class: net.officefloor.hq.app.period.AuditGeneratedPeriods
  govern: [ transaction ]
  next: record
record:
  class: net.officefloor.hq.app.rollover.RecordRollover
  govern: [ transaction ]
  next: carry
carry:
  class: net.officefloor.hq.app.rollover.CarryOpenings
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.rollover.AuditRollover
  govern: [ transaction ]
  next: softClose
softClose:
  class: net.officefloor.hq.app.rollover.SoftCloseOldPeriods
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithGeneratedPeriods
  govern: [ transaction ]
