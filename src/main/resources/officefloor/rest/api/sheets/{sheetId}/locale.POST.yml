# Save the signed-in user's locale (en or de; anything else is refused, 400). It only changes how the
# screen shows that user figures, so even a viewer may choose one, and nothing is audited.
validate:
  class: net.officefloor.hq.app.locale.ValidateLocaleRequest
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.locale.SaveLocale
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.locale.RespondWithLocale
  govern: [ transaction ]
