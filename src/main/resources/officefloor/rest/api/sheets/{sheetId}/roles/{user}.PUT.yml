# PUT /api/sheets/{sheetId}/roles/{user} — give a user name a role on the sheet: clerk or steward. A blank name or
# any other role is a 400 and writes nothing. Responds with the role as stored.
validate:
  class: net.officefloor.hq.app.role.ValidateRole
  next: save
save:
  class: net.officefloor.hq.app.role.SaveRole
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.role.RecordRoleSet
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.role.RespondWithRole
