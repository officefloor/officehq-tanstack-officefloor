# PUT /api/sheets/{sheetId}/roles/{user} — give the user name a role. Body {"role":"steward"}: clerk or
# steward; anything else is refused with 400 and nothing is stored.
validate:
  class: net.officefloor.hq.app.setting.ValidateRole
  next: apply
  govern: [ transaction ]
apply:
  class: net.officefloor.hq.app.setting.ApplyRole
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.setting.AuditRoleSet
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.setting.RespondWithRole
  govern: [ transaction ]
