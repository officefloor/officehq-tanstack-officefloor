# Change a sheet setting (the clerk limit, the floor, the terms, a grade's terms, the late percent, the policy date or the cap). Validate the body before touching the store, so a refusal
# writes nothing. A dated setting (all but the policy date and period numbering from) records its value from its from-date
# (blank: the sheet's today), keeping the others. The floor, the late percent, the policy date and the cap move dues (the terms do not: a claim's due-by is fixed when it is added, by the terms in force on its date), so the figures it moved are recorded after the change.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: setting
setting:
  class: net.officefloor.hq.app.access.ValidateSetting
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: ensure
ensure:
  class: net.officefloor.hq.app.sheet.EnsureSheet
  govern: [ transaction ]
  next: rollup-before
rollup-before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.access.ApplySetting
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.access.RecordSettingChanged
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.access.RespondWithSetting
  govern: [ transaction ]
