# Set the sheet's clerk limit (blank: no limit), its floor (blank: 1.00) and its terms in days (blank: 14) and its late percent (blank: 0.00) and its policy date (blank: the sheet's today), each only when the request carries it;
# a value that is negative or has more than two decimals (terms: not whole days) is refused (400). A floor, terms, late percent or policy date moves the dues, so the
# figures it moved are recorded after it.
validate:
  class: net.officefloor.hq.app.setting.ValidateSettingsRequest
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.setting.SaveClerkLimit
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.setting.AuditClerkLimit
  govern: [ transaction ]
  next: saveFloor
saveFloor:
  class: net.officefloor.hq.app.setting.SaveFloor
  govern: [ transaction ]
  next: auditFloor
auditFloor:
  class: net.officefloor.hq.app.setting.AuditFloor
  govern: [ transaction ]
  next: saveTerms
saveTerms:
  class: net.officefloor.hq.app.setting.SaveTerms
  govern: [ transaction ]
  next: auditTerms
auditTerms:
  class: net.officefloor.hq.app.setting.AuditTerms
  govern: [ transaction ]
  next: saveLatePct
saveLatePct:
  class: net.officefloor.hq.app.setting.SaveLatePct
  govern: [ transaction ]
  next: auditLatePct
auditLatePct:
  class: net.officefloor.hq.app.setting.AuditLatePct
  govern: [ transaction ]
  next: savePolicyDate
savePolicyDate:
  class: net.officefloor.hq.app.setting.SavePolicyDate
  govern: [ transaction ]
  next: auditPolicyDate
auditPolicyDate:
  class: net.officefloor.hq.app.setting.AuditPolicyDate
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: settings
settings:
  class: net.officefloor.hq.app.setting.LoadSettings
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.setting.RespondWithSettings
  govern: [ transaction ]
