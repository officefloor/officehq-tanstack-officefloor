# Save the sheet's settings (the clerk limit, the floor). A refused save (bad limit or floor, unknown sheet) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.setting.ValidateSettings
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.setting.SaveSettings
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.setting.AuditSettingChanged
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditSettingsRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.setting.RespondWithSettings
  govern: [ transaction ]
