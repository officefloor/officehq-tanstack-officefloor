# Set the sheet's clerk limit (blank: no limit); a limit that is negative or has more than two decimals is refused (400).
validate:
  class: net.officefloor.hq.app.setting.ValidateSettingsRequest
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.setting.SaveClerkLimit
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.setting.AuditClerkLimit
  govern: [ transaction ]
  next: settings
settings:
  class: net.officefloor.hq.app.setting.LoadSettings
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.setting.RespondWithSettings
  govern: [ transaction ]
