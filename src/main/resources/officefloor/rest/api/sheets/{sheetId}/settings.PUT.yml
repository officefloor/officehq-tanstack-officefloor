# PUT /api/sheets/{sheetId}/settings — set the sheet's clerk limit, floor and terms. Body: { "clerkLimit": "1.50", "floor": "2.00", "terms": "14" }
# (clerk limit blank: no limit; floor blank: 1.00; terms blank: 14; a key left out is not changed).
validate:
  class: net.officefloor.hq.app.setting.ValidateSettings
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.setting.ApplySettings
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.setting.AuditSettingChanged
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.setting.RespondWithSettings
  govern: [ transaction ]
