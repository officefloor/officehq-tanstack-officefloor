# PUT /api/sheets/{sheetId}/settings — set the sheet's clerk limit. Body: { "clerkLimit": "1.50" } (blank: no limit).
validate:
  class: net.officefloor.hq.app.setting.ValidateSettings
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.setting.ApplySettings
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.setting.AuditSettingChanged
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.setting.RespondWithSettings
  govern: [ transaction ]
