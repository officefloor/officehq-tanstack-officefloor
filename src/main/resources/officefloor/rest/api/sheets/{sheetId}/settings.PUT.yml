# Change a sheet setting (the clerk limit, the floor, the terms, a grade's terms, the late percent, the policy date, the cap or the parent). A parent that is the sheet itself, a sheet never loaded, or one with this sheet as an ancestor is refused. Validate the body before touching the store, so a refusal
# writes nothing. A dated setting (all but the policy date and period numbering from) records its value from its from-date
# (blank: the sheet's today), keeping the others. The floor, the late percent, the policy date, the cap and the parent move dues (the terms do not: a claim's terms are fixed when it is added, those in force on its date), so the figures it moved are recorded after the change.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: setting
setting:
  class: net.officefloor.hq.app.access.ValidateSetting
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: parent
parent:
  class: net.officefloor.hq.app.access.RefuseBadParent
  govern: [ transaction ]
  next: ensure
ensure:
  class: net.officefloor.hq.app.sheet.EnsureSheet
  govern: [ transaction ]
  next: rollup-before
rollup-before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.access.ApplySetting
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.access.RecordSettingChanged
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.access.RespondWithSetting
  govern: [ transaction ]
