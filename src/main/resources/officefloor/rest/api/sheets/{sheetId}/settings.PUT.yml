# PUT /api/sheets/{sheetId}/settings — save the sheet's settings. Body {"clerkLimit":"1.50","floor":"1.00"}:
# amounts with up to two decimals, kept with two. A blank clerk limit is no limit (left as it is when a
# floor is saved with it); a blank or missing floor is left as it is. Anything else is refused with 400
# and nothing is stored. Every saved setting is audited, even the value already in force, then the
# ROLLUP and TOTALS lines of the figures the floor moved.
validate:
  class: net.officefloor.hq.app.setting.ValidateSettings
  next: snapshot
  govern: [ transaction ]
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  next: apply
  govern: [ transaction ]
apply:
  class: net.officefloor.hq.app.setting.ApplySettings
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.setting.AuditSettingChanged
  next: rollup
  govern: [ transaction ]
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.setting.RespondWithSettings
  govern: [ transaction ]
