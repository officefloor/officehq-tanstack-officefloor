# Set the sheet's clerk limit (blank: no limit), its floor (blank: 1.00) and its terms in days (blank: 14) and each grade's own terms in days (blank: none, the sheet's terms) and its late percent (blank: 0.00) and its policy date (blank: the sheet's today) and its period numbering from date (blank: off) and its cap (blank: none) and its proof threshold (blank: none) and its permission matrix (by action, the roles allowed it, comma separated; blank: the standing rule), each only when the request carries it;
# a value that is negative or has more than two decimals (terms: not whole days) is refused (400). A floor, late percent, policy date or cap moves the dues (terms do not: a claim's due-by is fixed when it is created), so the
# figures it moved are recorded after it.
validate:
  class: net.officefloor.hq.app.setting.ValidateSettingsRequest
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.setting.SaveClerkLimit
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.setting.AuditClerkLimit
  govern: [ transaction ]
  next: saveFloor
saveFloor:
  class: net.officefloor.hq.app.setting.SaveFloor
  govern: [ transaction ]
  next: auditFloor
auditFloor:
  class: net.officefloor.hq.app.setting.AuditFloor
  govern: [ transaction ]
  next: saveTerms
saveTerms:
  class: net.officefloor.hq.app.setting.SaveTerms
  govern: [ transaction ]
  next: auditTerms
auditTerms:
  class: net.officefloor.hq.app.setting.AuditTerms
  govern: [ transaction ]
  next: saveGradeTerms
saveGradeTerms:
  class: net.officefloor.hq.app.setting.SaveGradeTerms
  govern: [ transaction ]
  next: auditGradeTerms
auditGradeTerms:
  class: net.officefloor.hq.app.setting.AuditGradeTerms
  govern: [ transaction ]
  next: saveLatePct
saveLatePct:
  class: net.officefloor.hq.app.setting.SaveLatePct
  govern: [ transaction ]
  next: auditLatePct
auditLatePct:
  class: net.officefloor.hq.app.setting.AuditLatePct
  govern: [ transaction ]
  next: savePolicyDate
savePolicyDate:
  class: net.officefloor.hq.app.setting.SavePolicyDate
  govern: [ transaction ]
  next: auditPolicyDate
auditPolicyDate:
  class: net.officefloor.hq.app.setting.AuditPolicyDate
  govern: [ transaction ]
  next: savePeriodNumberingFrom
savePeriodNumberingFrom:
  class: net.officefloor.hq.app.setting.SavePeriodNumberingFrom
  govern: [ transaction ]
  next: auditPeriodNumberingFrom
auditPeriodNumberingFrom:
  class: net.officefloor.hq.app.setting.AuditPeriodNumberingFrom
  govern: [ transaction ]
  next: saveCap
saveCap:
  class: net.officefloor.hq.app.setting.SaveCap
  govern: [ transaction ]
  next: auditCap
auditCap:
  class: net.officefloor.hq.app.setting.AuditCap
  govern: [ transaction ]
  next: saveProofThreshold
saveProofThreshold:
  class: net.officefloor.hq.app.setting.SaveProofThreshold
  govern: [ transaction ]
  next: auditProofThreshold
auditProofThreshold:
  class: net.officefloor.hq.app.setting.AuditProofThreshold
  govern: [ transaction ]
  next: savePermissions
savePermissions:
  class: net.officefloor.hq.app.setting.SavePermissions
  govern: [ transaction ]
  next: auditPermissions
auditPermissions:
  class: net.officefloor.hq.app.setting.AuditPermissions
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: settings
settings:
  class: net.officefloor.hq.app.setting.LoadSettings
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.setting.RespondWithSettings
  govern: [ transaction ]
