# Set the sheet's clerk limit (blank: no limit) and its floor (blank: 1.00), each only when the request carries it;
# a value that is negative or has more than two decimals is refused (400). A floor moves the live dues, so the
# figures it moved are recorded after it.
validate:
  class: net.officefloor.hq.app.setting.ValidateSettingsRequest
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.setting.SaveClerkLimit
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.setting.AuditClerkLimit
  govern: [ transaction ]
  next: saveFloor
saveFloor:
  class: net.officefloor.hq.app.setting.SaveFloor
  govern: [ transaction ]
  next: auditFloor
auditFloor:
  class: net.officefloor.hq.app.setting.AuditFloor
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: settings
settings:
  class: net.officefloor.hq.app.setting.LoadSettings
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.setting.RespondWithSettings
  govern: [ transaction ]
