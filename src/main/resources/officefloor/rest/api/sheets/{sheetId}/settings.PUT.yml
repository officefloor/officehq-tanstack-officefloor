# Change a sheet setting (the clerk limit or the floor). Validate the body before touching the store, so a refusal
# writes nothing. The floor moves live dues, so the figures it moved are recorded after the change.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: setting
setting:
  class: net.officefloor.hq.app.access.ValidateSetting
  next: ensure
ensure:
  class: net.officefloor.hq.app.sheet.EnsureSheet
  govern: [ transaction ]
  next: rollup-before
rollup-before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.access.ApplySetting
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.access.RecordSettingChanged
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.access.RespondWithSetting
  govern: [ transaction ]
