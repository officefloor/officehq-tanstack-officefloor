# Part-settle an OPEN claim: split an amount off it as the split button does, then settle the new
# claim as the settle button does. Validate before Load so a bad amount is a 400, not a 404; a split
# or a settle that would be refused refuses the whole action (a 409) and writes nothing.
validate:
  class: net.officefloor.hq.app.claim.ValidateClaimSplit
  next: settle
# Runs in a transaction of its own (not governed), so a refused settle rolls back the split before it;
# audits the split, the settle and the figures each moved only once the whole action went through.
settle:
  class: net.officefloor.hq.app.claim.SettleClaimPart
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaimSplit
