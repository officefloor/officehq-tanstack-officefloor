# POST /api/sheets/{sheetId}/claims/{claimId}/settle-part — part-settle an OPEN claim: split the amount off it exactly
# as the split does, and settle the new claim at once by the same user exactly as the settle does (PENDING when a
# clerk's settle is above the clerk limit). The four-eyes rules and the proof rule are judged on the original claim.
# A split or a settle that would be refused is a 409 and a claim not on the sheet a 404, neither writing anything.
# Responds 201 with the new claim as stored.
validate:
  class: net.officefloor.hq.app.claim.ValidateSplit
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: settle
settle:
  class: net.officefloor.hq.app.claim.SettlePart
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithSplit
