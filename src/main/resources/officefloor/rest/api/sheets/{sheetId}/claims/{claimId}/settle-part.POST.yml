# Part-settle an OPEN claim, first step: refuse it (writing nothing, not even an audit line) when a split of the amount would be refused, or when the settle button would refuse the user's settle of the claim; else split the amount off exactly as a split does and answer the new claim, which the screen then settles exactly as the settle button does.
validate:
  class: net.officefloor.hq.app.claim.ValidateSplit
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: closed
closed:
  class: net.officefloor.hq.app.period.RefuseClosedClaim
  govern: [ transaction ]
  next: settleable
settleable:
  class: net.officefloor.hq.app.claim.RefuseUnsettleablePart
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveSplit
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimSplit
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditSplitRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
