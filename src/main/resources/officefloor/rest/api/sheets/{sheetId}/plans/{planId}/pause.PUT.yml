# PUT /api/sheets/{sheetId}/plans/{planId}/pause — pause the plan on the sheet's today (refused when it is already paused). Answers the sheet's plans.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: plan
plan:
  class: net.officefloor.hq.app.plan.LoadPlan
  govern: [ transaction ]
  next: pause
pause:
  class: net.officefloor.hq.app.plan.PausePlan
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.plan.AuditPlanPaused
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlans
  govern: [ transaction ]
