# Save the sheet's settings. Validate first so a bad value is refused (400) and writes nothing.
# Each changed setting is saved and then recorded as SETTING_CHANGED.
validate:
  class: net.officefloor.hq.app.setting.ValidateSettings
  next: save
save:
  class: net.officefloor.hq.app.setting.SaveSettings
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.setting.RespondWithSettings
  govern: [ transaction ]
