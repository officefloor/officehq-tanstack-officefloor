# Change the sheet's settings given: its clerk limit (0.00 or more with up to two decimals; blank means
# no limit), its floor (0.00 or more with up to two decimals) its terms (whole days, 0 to 3650) and each grade's terms
# (likewise; blank means the sheet's terms). A setting left out stays as it is. A setting with a figure is
# recorded from its from-date (blank: the sheet's today), keeping the values recorded from other dates.
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: validate
validate:
  class: net.officefloor.hq.app.settings.ValidateSettings
  next: save
save:
  class: net.officefloor.hq.app.settings.SaveSettings
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.settings.RespondWithSettings
