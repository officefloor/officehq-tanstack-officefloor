# Set the rate for a grade. A refused set (bad grade or rate, unknown sheet) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.rate.ValidateRate
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.rate.SaveRate
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.rate.AuditRateSet
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRateRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.rate.RespondWithRate
  govern: [ transaction ]
