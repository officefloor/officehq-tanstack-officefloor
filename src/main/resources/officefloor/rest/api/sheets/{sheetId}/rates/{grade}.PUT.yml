# PUT /api/sheets/{sheetId}/rates/{grade} — set the grade's rate. Body {"rate":"12.50","from":"2026-03-05","to":"2026-03-31"}:
# from is optional (blank: from the beginning of time); a rate with the same grade and from is kept as an older version
# and this one added as the newest (the response carries its version); to is optional
# (blank: no end) and a to before the from is refused. A percent of
# 0.00 or more with up to two decimals. Another grade or a bad rate is refused with 400 and nothing
# is stored.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: snapshot
  govern: [ transaction ]
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  next: validate
  govern: [ transaction ]
validate:
  class: net.officefloor.hq.app.rate.ValidateRate
  next: apply
  govern: [ transaction ]
apply:
  class: net.officefloor.hq.app.rate.ApplyRate
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.rate.AuditRateSet
  next: rollup
  govern: [ transaction ]
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.rate.RespondWithRate
  govern: [ transaction ]
