# Show or switch off one column of the people list for the signed-in user (an unknown column is
# refused, 400). It only changes what that user's screen shows, so even a viewer may, and nothing is
# audited. Responds with the columns now switched off.
validate:
  class: net.officefloor.hq.app.columns.ValidateColumnRequest
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.columns.SaveColumn
  govern: [ transaction ]
  next: columns
columns:
  class: net.officefloor.hq.app.columns.LoadColumns
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.columns.RespondWithColumns
  govern: [ transaction ]
