# PUT /api/sheets/{sheetId}/claims/{claimId}/unlock — cancel a claim's editor: releases its lock if the user holds it.
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: claim
claim:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: release
release:
  class: net.officefloor.hq.app.claim.ReleaseLock
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
