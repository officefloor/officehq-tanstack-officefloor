# PUT /api/sheets/{sheetId}/claims/{claimId}/unlock — cancel the claim's editor: releases the user's lock on it, if they hold it.
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  next: release
  govern: [ transaction ]
release:
  class: net.officefloor.hq.app.claim.ReleaseClaimLock
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.claim.RespondWithUnlockedClaim
  govern: [ transaction ]
