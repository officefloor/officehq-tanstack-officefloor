# Cancel a claim's editor: release the user's lock on it (another user's lock is left as it is).
validate:
  class: net.officefloor.hq.app.claim.ValidateClaimLock
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveClaimUnlock
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
