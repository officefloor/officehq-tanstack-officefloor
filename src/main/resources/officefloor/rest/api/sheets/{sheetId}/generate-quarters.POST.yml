# POST /api/sheets/{sheetId}/generate-quarters — add the year's four calendar quarters as periods named yyyy-Q1 to yyyy-Q4,
# each from the first day of its first month to the last day of its third, as the period form would add it (a quarter
# whose name the sheet already has, or whose days overlap a period, is left out). Body: { "year": "yyyy" }.
# A year that is not four digits is refused. Responds { "generated": n }.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: validate
validate:
  class: net.officefloor.hq.app.period.ValidateGenerateQuarters
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: generate
generate:
  class: net.officefloor.hq.app.period.GenerateQuarters
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.period.AuditPeriodsGenerated
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithGeneratedPeriods
  govern: [ transaction ]
