# Generate a calendar year's four quarterly periods, named yyyy-Q1 to yyyy-Q4, each from its first month's first day
# to its last month's last day, made as the period form adds them: a quarter whose name is already a period on the
# sheet, or whose days overlap one, is left out and the others are still made, each audited as PERIOD_ADDED.
# A year that is not four digits is refused (400). Answers how many were made.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: build
build:
  class: net.officefloor.hq.app.period.BuildQuarterPeriods
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.period.SaveGeneratedPeriods
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.period.AuditGeneratedPeriods
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithGeneratedPeriods
  govern: [ transaction ]
