# Add a proof, of a kind (receipt or photo; none chosen: a receipt), to a claim. A SETTLED or VOID
# claim is a 409 and writes nothing; any other kind is a 400 and writes nothing.
# A viewer may change nothing: refused before anything is read or written.
viewer:
  class: net.officefloor.hq.app.role.CheckCanChange
  next: validate
validate:
  class: net.officefloor.hq.app.claim.ValidateProof
  next: loadSheet
loadSheet:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: closed
# A claim due by a date inside a closed period is a 409 and writes nothing.
closed:
  class: net.officefloor.hq.app.period.CheckClaimPeriod
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.claim.AddProof
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveClaim
  govern: [ transaction ]
  next: audit
# Last before the response: every rule has passed and the change is saved.
audit:
  class: net.officefloor.hq.app.claim.AuditClaimProofAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
