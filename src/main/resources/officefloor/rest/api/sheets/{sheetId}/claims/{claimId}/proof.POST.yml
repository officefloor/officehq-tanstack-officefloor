# POST /api/sheets/{sheetId}/claims/{claimId}/proof — raise a claim's proofs count by one. The body may choose its kind, receipt or photo (none chosen: a receipt). Refused with 422 for a
# SETTLED or VOID claim, or a claim dated inside a closed period; nothing is stored. 404 for a claim not on the sheet.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: load
  govern: [ transaction ]
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  next: closed
  govern: [ transaction ]
closed:
  class: net.officefloor.hq.app.claim.RefuseClosedClaim
  next: apply
  govern: [ transaction ]
apply:
  class: net.officefloor.hq.app.claim.ApplyProof
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.claim.AuditClaimProofAdded
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.claim.RespondWithEditedClaim
  govern: [ transaction ]
