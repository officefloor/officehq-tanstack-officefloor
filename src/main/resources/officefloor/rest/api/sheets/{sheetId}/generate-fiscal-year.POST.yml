# Generate a fiscal year's periods: the twelve calendar months from the year's first day (the first of the sheet's
# fiscal start month in the year typed, yyyy; a fiscal year is named by the calendar year its first day falls in),
# made exactly as generate-periods makes them: each from the month's first to its last day, named yyyy-mm; a month
# whose name is already a period on the sheet, or whose days overlap one, is left out and the others are still made,
# each audited as PERIOD_ADDED. A year that is not four digits is refused (400). Answers how many were made.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: build
build:
  class: net.officefloor.hq.app.period.BuildFiscalYearPeriods
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.period.SaveGeneratedPeriods
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.period.AuditGeneratedPeriods
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithGeneratedPeriods
  govern: [ transaction ]
