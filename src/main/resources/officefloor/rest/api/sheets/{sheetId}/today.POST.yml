# Change a sheet's today. Validate first so a bad date is refused (400) and writes nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateToday
  next: apply
apply:
  class: net.officefloor.hq.app.sheet.ApplyToday
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.sheet.RespondWithSheet
