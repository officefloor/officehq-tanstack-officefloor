validate:
  class: net.officefloor.hq.app.sheet.ValidateToday
  next: snapshot
# The sheet's figures before the change, so the change can audit what it moved.
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.sheet.SaveToday
  govern: [ transaction ]
