# Add a pool (POOL_ADDED): a name (trimmed). A blank name, or one already a pool's on the sheet, is refused (400).
# Responds with the sheet's pools.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: validate
validate:
  class: net.officefloor.hq.app.pool.ValidatePoolRequest
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.pool.SavePool
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.pool.AuditPoolAdded
  govern: [ transaction ]
  next: pools
pools:
  class: net.officefloor.hq.app.pool.LoadPools
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.pool.RespondWithPools
  govern: [ transaction ]
