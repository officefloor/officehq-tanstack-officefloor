# Add a pool to the sheet. A refused add (blank, a name already a pool) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.pool.ValidatePool
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.pool.SavePool
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.pool.AuditPoolAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.pool.RespondWithPool
  govern: [ transaction ]
