# POST /api/sheets/{sheetId}/pools — add a pool. Body: { "name": "<text>" }. Answers the sheet's pools.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: validate
validate:
  class: net.officefloor.hq.app.pool.ValidatePool
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.pool.ApplyPool
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.pool.AuditPoolAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.pool.RespondWithPools
  govern: [ transaction ]
