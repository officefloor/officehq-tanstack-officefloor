# POST /api/sheets/{sheetId}/pools — adds a pool. Body {"name":"..."}, trimmed. A blank name, or one already a pool of
# the sheet, is refused with 422 and nothing is stored or recorded.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: validate
  govern: [ transaction ]
validate:
  class: net.officefloor.hq.app.pool.ValidatePool
  next: add
  govern: [ transaction ]
add:
  class: net.officefloor.hq.app.pool.AddPool
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.pool.AuditPoolAdded
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.pool.RespondWithPool
  govern: [ transaction ]
