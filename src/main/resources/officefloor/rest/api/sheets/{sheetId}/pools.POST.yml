# Add a pool: a name (required, trimmed, unique on the sheet). Answers the sheet's pools.
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: validate
validate:
  class: net.officefloor.hq.app.pool.ValidatePool
  next: save
save:
  class: net.officefloor.hq.app.pool.SavePool
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.pool.LoadPools
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.pool.RespondWithPools
