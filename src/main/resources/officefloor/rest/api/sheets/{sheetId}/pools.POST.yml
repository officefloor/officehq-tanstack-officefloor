# POST /api/sheets/{sheetId}/pools — add a pool (name trimmed) to the sheet. A blank name or one already taken on the
# sheet is a 400 and writes nothing. Responds 201 with the pool.
validate:
  class: net.officefloor.hq.app.pool.ValidatePool
  next: add
add:
  class: net.officefloor.hq.app.pool.AddPool
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.pool.RecordPoolAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.pool.RespondWithPoolCreated
