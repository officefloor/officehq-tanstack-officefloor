# Add a pool. Validate the body before touching the store, so a refusal writes nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: pool
pool:
  class: net.officefloor.hq.app.pool.ValidatePool
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: ensure
ensure:
  class: net.officefloor.hq.app.sheet.EnsureSheet
  govern: [ transaction ]
  next: build
build:
  class: net.officefloor.hq.app.pool.BuildPool
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.pool.RecordPoolAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.pool.RespondWithPoolsNow
  govern: [ transaction ]
