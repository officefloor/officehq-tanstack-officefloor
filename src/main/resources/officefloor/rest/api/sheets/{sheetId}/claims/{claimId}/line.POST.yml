# Add a line to a DRAFT claim: its amount becomes its lines' total. Refused for a claim that is not a DRAFT, in a closed
# period, or whose editor another user holds open; adding a line counts as editing the claim.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: line
line:
  class: net.officefloor.hq.app.claim.ValidateLine
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: locked
locked:
  class: net.officefloor.hq.app.claim.RefuseLockedClaim
  govern: [ transaction ]
  next: draft
draft:
  class: net.officefloor.hq.app.claim.RefuseNonDraftEdit
  govern: [ transaction ]
  next: closed
closed:
  class: net.officefloor.hq.app.claim.RefuseClosedClaim
  govern: [ transaction ]
  next: rollup-before
rollup-before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.claim.ApplyLine
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.RecordLineAdded
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
