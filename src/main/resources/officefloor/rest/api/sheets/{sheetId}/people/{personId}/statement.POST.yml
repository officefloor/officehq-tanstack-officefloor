# Take a statement for the person. The audit line is written last, once the statement is saved.
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: take
take:
  class: net.officefloor.hq.app.statement.TakeStatement
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.statement.AuditStatement
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
