# Take a person's statement: record their due-total and bind their counting claims to their figures.
validate:
  class: net.officefloor.hq.app.person.ValidateStatement
  next: snapshot
# Keep the figures as they were, so the change can audit the ones it moves.
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: take
take:
  class: net.officefloor.hq.app.person.TakeStatement
  govern: [ transaction ]
  next: record
# Audit only once the statement is saved.
record:
  class: net.officefloor.hq.app.person.RecordStatement
  govern: [ transaction ]
  next: rollup
# After the change's own lines: a line per person whose figures moved, then the totals if they did.
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
