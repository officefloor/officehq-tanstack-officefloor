# Take a person's statement: binds their counting claims to their figures now, or as they stood at
# the end of the date given (on or before the sheet's today). Validate first so a bad date is a 400,
# not a 404. An unknown person is a 404.
# A viewer may change nothing: refused before anything is read or written.
viewer:
  class: net.officefloor.hq.app.role.CheckCanChange
  next: validate
validate:
  class: net.officefloor.hq.app.statement.ValidateStatement
  next: loadSheet
loadSheet:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: before
# The sheet's figures before the change, so the rollup lines tell which moved.
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: take
take:
  class: net.officefloor.hq.app.statement.TakeStatement
  govern: [ transaction ]
  next: audit
# Last before the response: the statement is saved.
audit:
  class: net.officefloor.hq.app.statement.AuditStatement
  govern: [ transaction ]
  next: rollup
# After the change's own lines: the figures it moved.
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
