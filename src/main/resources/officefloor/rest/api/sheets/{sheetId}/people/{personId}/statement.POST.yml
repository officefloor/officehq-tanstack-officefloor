# POST /api/sheets/{sheetId}/people/{personId}/statement — take a statement of a person: record their
# due-total now and bind each of their counting claims to its figure now. Body {"asOf":"yyyy-mm-dd"} takes it as
# of that date instead (blank: now): their claims and figures as they stood at the end of it. 404 for a person not
# on the sheet; 409 for a date that is not real, after the sheet's today, or before the person was on the sheet.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: validate
  govern: [ transaction ]
validate:
  class: net.officefloor.hq.app.statement.ValidateStatement
  next: snapshot
  govern: [ transaction ]
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  next: load
  govern: [ transaction ]
load:
  class: net.officefloor.hq.app.person.LoadPerson
  next: take
  govern: [ transaction ]
take:
  class: net.officefloor.hq.app.statement.TakeStatement
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.statement.AuditStatement
  next: rollup
  govern: [ transaction ]
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.statement.RespondWithStatement
  govern: [ transaction ]
