# Take a statement for the person: record their due-total now and bind their counting claims to their figures.
validate:
  class: net.officefloor.hq.app.statement.ValidateStatement
  next: snapshot
# The sheet's figures before the change, so the change can audit what it moved.
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: take
take:
  class: net.officefloor.hq.app.statement.TakeStatement
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.statement.AuditStatement
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
