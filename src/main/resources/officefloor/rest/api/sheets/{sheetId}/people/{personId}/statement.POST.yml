# Take a person's statement: record their due-total now and bind each of their counting claims to the
# figure it has now (unbinding the rest); a person not on the sheet is refused (404). Taken as of a date (on or before
# the sheet's today), it works on the sheet as it stood at the end of that date; a later date, or a bad one, is
# refused (400).
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: validate
validate:
  class: net.officefloor.hq.app.statement.ValidateStatementRequest
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: take
take:
  class: net.officefloor.hq.app.statement.TakeStatement
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.statement.AuditStatement
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
