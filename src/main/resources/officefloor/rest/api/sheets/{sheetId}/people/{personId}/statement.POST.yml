# POST /api/sheets/{sheetId}/people/{personId}/statement — take a statement of a person: record their
# due-total now and bind each of their counting claims to its figure now. 404 for a person not on the sheet.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: snapshot
  govern: [ transaction ]
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  next: load
  govern: [ transaction ]
load:
  class: net.officefloor.hq.app.person.LoadPerson
  next: take
  govern: [ transaction ]
take:
  class: net.officefloor.hq.app.statement.TakeStatement
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.statement.AuditStatement
  next: rollup
  govern: [ transaction ]
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.statement.RespondWithStatement
  govern: [ transaction ]
