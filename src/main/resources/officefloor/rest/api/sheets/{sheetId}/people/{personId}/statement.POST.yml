# Take a person's statement, now or as of a date on or before the sheet's today (blank: now): record
# their due-total, and bind each of their counting claims to the figure it had then (unbinding the
# rest), until their next statement.
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: validate
validate:
  class: net.officefloor.hq.app.statement.ValidateStatement
  next: take
take:
  class: net.officefloor.hq.app.statement.TakeStatement
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
