# POST /api/sheets/{sheetId}/roles — assign a role to a user name (body: {user, role, by}). The role
# is clerk or steward; an empty user name or any other role is refused (400) and nothing is stored.
# A stored role is recorded in the audit file as ROLE_SET; a refused one records nothing.
validate:
  class: net.officefloor.hq.app.role.ValidateRole
  next: save
save:
  class: net.officefloor.hq.app.role.SaveRole
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.role.AuditRoleSet
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.role.RespondWithRole
  govern: [ transaction ]
