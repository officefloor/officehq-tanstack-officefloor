# Assign a user's role. Validate first so a bad role is a 400, not a 404.
validate:
  class: net.officefloor.hq.app.role.ValidateRole
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.role.SaveRole
  govern: [ transaction ]
  next: audit
# Last before the response: every rule has passed and the change is saved.
audit:
  class: net.officefloor.hq.app.role.AuditRoleSet
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.role.RespondWithRole
  govern: [ transaction ]
