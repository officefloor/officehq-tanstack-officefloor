# Give a user name a role on the sheet. Validate first so an unknown role is a 400 and writes nothing.
validate:
  class: net.officefloor.hq.app.settings.ValidateRole
  next: save
save:
  class: net.officefloor.hq.app.settings.SaveRole
  govern: [ transaction ]
  next: record
# Audit only once the change is saved: a refused change writes no line.
record:
  class: net.officefloor.hq.app.settings.RecordRoleSet
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.settings.RespondWithSettings
  govern: [ transaction ]
