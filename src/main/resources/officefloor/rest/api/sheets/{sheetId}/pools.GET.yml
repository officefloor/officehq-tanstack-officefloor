# GET /api/sheets/{sheetId}/pools — the sheet's pools, in the order added, each with its members (in the order added),
# its total share (a retired member's share counting 0.00) and whether it is balanced (the total is exactly 100.00),
# and each member's cut of the sheet's pot when the pool is balanced and there is a pot (a member held on the sheet's
# today has none, their share spread over the members with a cut), and its cut as it stood at the end of each period
# whose to-date is on or before the sheet's today (read from the store as of that to-date).
respond:
  class: net.officefloor.hq.app.pool.RespondWithPools
  govern: [ readonly-transaction ]
