# The sheet's pools in the order they were added, each with its members, total share and whether it is balanced.
# 404 for an id never loaded.
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ readonly-transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.pool.RespondWithPools
  govern: [ readonly-transaction ]
