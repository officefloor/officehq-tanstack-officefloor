# GET /api/sheets/{sheetId}/pools — the sheet's pools with their members, totals and whether each is balanced.
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.pool.RespondWithPools
  govern: [ transaction ]
