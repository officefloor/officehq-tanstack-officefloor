# The sheet's pools with their members, total share and whether they are balanced.
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ readonly-transaction ]
  next: pools
pools:
  class: net.officefloor.hq.app.pool.LoadPools
  govern: [ readonly-transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.pool.RespondWithPools
  govern: [ readonly-transaction ]
