# POST /api/sheets/{sheetId}/crews/members — add a person to a crew. An unknown crew or person, the crew's lead, or a
# person already in the crew is a 400 and writes nothing. Responds 201 with the member.
validate:
  class: net.officefloor.hq.app.crew.ValidateCrewMember
  next: add
add:
  class: net.officefloor.hq.app.crew.AddCrewMember
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.crew.RecordCrewMemberAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.crew.RespondWithCrewMemberCreated
