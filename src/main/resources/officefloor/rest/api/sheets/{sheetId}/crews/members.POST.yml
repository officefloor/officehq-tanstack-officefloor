# Add a person to a crew. Validate the body before touching the store, so a refusal writes nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: member
member:
  class: net.officefloor.hq.app.crew.ValidateCrewMember
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: ensure
ensure:
  class: net.officefloor.hq.app.sheet.EnsureSheet
  govern: [ transaction ]
  next: add
add:
  class: net.officefloor.hq.app.crew.AddCrewMember
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.crew.RecordCrewMemberAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.crew.RespondWithCrewsNow
  govern: [ transaction ]
