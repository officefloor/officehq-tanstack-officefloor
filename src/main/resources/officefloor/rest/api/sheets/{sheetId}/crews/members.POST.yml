# Add a member to a crew. Validate first so the crew's lead, or a person already in the crew, is a 400
# and writes nothing.
validate:
  class: net.officefloor.hq.app.crew.ValidateCrewMember
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.crew.SaveCrewMember
  govern: [ transaction ]
  next: record
# Audit only once the member is saved: a refused one writes no line.
record:
  class: net.officefloor.hq.app.crew.RecordCrewMemberAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.crew.RespondWithCrews
  govern: [ transaction ]
