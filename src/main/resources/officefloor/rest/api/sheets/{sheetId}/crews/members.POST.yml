# Add a member to a crew: a person on the sheet, neither its lead nor already in it. Answers the sheet's crews.
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: validate
validate:
  class: net.officefloor.hq.app.crew.ValidateCrewMember
  next: add
add:
  class: net.officefloor.hq.app.crew.AddCrewMember
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.crew.LoadCrews
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.crew.RespondWithCrews
