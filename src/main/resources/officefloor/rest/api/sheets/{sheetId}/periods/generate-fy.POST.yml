# POST /api/sheets/{sheetId}/periods/generate-fy — make the twelve monthly periods of a fiscal year. Body
# {"year":"2026"}: fiscal year FY2026 starts on the first of the sheet's fiscal start month in 2026; each of
# its months is made as the period generator makes it (a month whose name is taken or whose days overlap a
# period is left out). A year that is not yyyy is refused with 400 and nothing is stored. Responds {"made":n}.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: validate
  govern: [ transaction ]
validate:
  class: net.officefloor.hq.app.period.ValidateGenerateFiscalYear
  next: add
  govern: [ transaction ]
add:
  class: net.officefloor.hq.app.period.AddGeneratedPeriods
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.period.AuditPeriodsGenerated
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.period.RespondWithGenerated
  govern: [ transaction ]
