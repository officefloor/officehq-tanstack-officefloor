# POST /api/sheets/{sheetId}/periods/{periodName}/unlock — unlock the period (body: {user}); a locked period cannot be
# reopened. Refused (400) when the user is not a steward, the period is not on the sheet or is not locked;
# nothing is stored then. Recorded in the audit file as PERIOD_UNLOCKED.
validate:
  class: net.officefloor.hq.app.period.ValidateClose
  next: unlock
unlock:
  class: net.officefloor.hq.app.period.UnlockPeriod
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.period.AuditPeriodUnlocked
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithClosedPeriod
  govern: [ transaction ]
