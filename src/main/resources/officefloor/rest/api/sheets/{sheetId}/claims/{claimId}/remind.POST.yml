# POST /api/sheets/{sheetId}/claims/{claimId}/remind — remind an OPEN or PENDING claim: its reminded date becomes the
# sheet's today and REMIND is written. Refused with 422 for a claim in any other status, or one already reminded on the
# sheet's today; nothing is stored. 404 for a claim not on the sheet. With an escalation gap set (escalate-after), a
# reminder at least that many days after the claim's previous one escalates it, once per claim ever: ESCALATE is
# written after REMIND.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: load
  govern: [ transaction ]
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  next: apply
  govern: [ transaction ]
apply:
  class: net.officefloor.hq.app.claim.ApplyRemind
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.claim.AuditClaimReminded
  next: escalate
  govern: [ transaction ]
escalate:
  class: net.officefloor.hq.app.claim.ApplyEscalation
  next: auditEscalated
  govern: [ transaction ]
auditEscalated:
  class: net.officefloor.hq.app.claim.AuditClaimEscalated
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.claim.RespondWithEditedClaim
  govern: [ transaction ]
