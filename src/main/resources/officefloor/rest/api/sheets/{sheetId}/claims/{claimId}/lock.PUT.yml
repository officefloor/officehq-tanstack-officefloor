# PUT /api/sheets/{sheetId}/claims/{claimId}/lock — open the claim's editor: locks it for the user until they save or
# cancel it, or the sheet's today changes (releasing any other lock they hold on the sheet). 422 for a viewer, a claim
# that cannot be edited (not a draft, or dated inside a closed period) or one another user has locked; nothing is locked.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: load
  govern: [ transaction ]
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  next: draft
  govern: [ transaction ]
draft:
  class: net.officefloor.hq.app.claim.RefuseNonDraftClaim
  next: closed
  govern: [ transaction ]
closed:
  class: net.officefloor.hq.app.claim.RefuseClosedClaim
  next: lock
  govern: [ transaction ]
lock:
  class: net.officefloor.hq.app.claim.LockClaim
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.claim.RespondWithEditedClaim
  govern: [ transaction ]
