# Open a claim's editor: lock it for the user until the editor is saved or cancelled, or the sheet's today changes. A refused lock (unknown claim, a claim that is not a DRAFT or is dated in a closed period, a claim another user holds locked) writes nothing.
validate:
  class: net.officefloor.hq.app.claim.ValidateClaimLock
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: draft
draft:
  class: net.officefloor.hq.app.claim.RefuseNonDraftClaimEdit
  govern: [ transaction ]
  next: closed
closed:
  class: net.officefloor.hq.app.period.RefuseClosedClaim
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveClaimLock
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
