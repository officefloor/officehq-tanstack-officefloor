# A claim from a template: the claim form with the template's amount and note, saved by its rules.
validate:
  class: net.officefloor.hq.app.claim.ValidateTemplateClaim
  next: snapshot
# The sheet's figures before the change, so the change can audit what it moved.
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveClaimCreated
  govern: [ transaction ]
