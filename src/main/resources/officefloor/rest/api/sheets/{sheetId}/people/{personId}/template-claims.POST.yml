# Add a DRAFT claim to a person from a template: its amount and note as they are now, no date, then every rule of the
# claim form (claims.POST), except that its date (never given) may fall in a closed period: only its due-by may not.
# An unknown template is refused like a bad claim; a refused add writes nothing.
validate:
  class: net.officefloor.hq.app.template.ValidateTemplateClaim
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: retired
retired:
  class: net.officefloor.hq.app.claim.RefuseRetiredNewClaim
  govern: [ transaction ]
  next: correction
correction:
  class: net.officefloor.hq.app.claim.RefuseInvalidNewCorrection
  govern: [ transaction ]
  next: ref
ref:
  class: net.officefloor.hq.app.claim.RefuseUsedNewRef
  govern: [ transaction ]
  next: closed
closed:
  class: net.officefloor.hq.app.template.RefuseClosedTemplateClaim
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveNewClaim
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimAdded
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditClaimRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaimCreated
  govern: [ transaction ]
