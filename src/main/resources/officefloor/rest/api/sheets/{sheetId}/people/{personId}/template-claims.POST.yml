# Add a DRAFT claim to a person from a claim template: the template's amount and note at this moment, with no date
# (the sheet's entry date, else its today), by every rule of the claim form (CLAIM_ADDED as the form writes it).
# A template not on the sheet is refused (400). Later changes to the template do not alter the claim.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: validate
validate:
  class: net.officefloor.hq.app.template.ValidateTemplateClaimRequest
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: checkRetired
checkRetired:
  class: net.officefloor.hq.app.claim.CheckClaimInputNotRetired
  govern: [ transaction ]
  next: checkNewPeriod
checkNewPeriod:
  class: net.officefloor.hq.app.claim.CheckClaimInputPeriodOpen
  govern: [ transaction ]
  next: checkCorrects
checkCorrects:
  class: net.officefloor.hq.app.claim.CheckClaimInputCorrects
  govern: [ transaction ]
  next: checkRef
checkRef:
  class: net.officefloor.hq.app.claim.CheckClaimInputRef
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: build
build:
  class: net.officefloor.hq.app.claim.BuildClaim
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveClaim
  govern: [ transaction ]
  next: ref
ref:
  class: net.officefloor.hq.app.claim.SaveClaimRef
  govern: [ transaction ]
  next: tags
tags:
  class: net.officefloor.hq.app.claim.SaveClaimTags
  govern: [ transaction ]
  next: log
log:
  class: net.officefloor.hq.app.claim.LogClaimStatus
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimAdded
  govern: [ transaction ]
  next: late
late:
  class: net.officefloor.hq.app.claim.MarkLateEntry
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
