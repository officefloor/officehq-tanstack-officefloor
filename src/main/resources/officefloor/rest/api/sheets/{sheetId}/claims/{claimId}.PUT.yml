# Edit a claim's amount, date, note and reference. A refused edit (bad amount or date, unknown claim, a claim that is not a DRAFT, a claim whose editor another user holds locked, an amount other than its lines' total on a claim with lines, a correction that names no SETTLED claim of the person, a reference another claim on the sheet already has (without regard to case), a claim dated in a closed period, a date after the person's retirement date) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.claim.ValidateClaim
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: draft
draft:
  class: net.officefloor.hq.app.claim.RefuseNonDraftClaimEdit
  govern: [ transaction ]
  next: locked
locked:
  class: net.officefloor.hq.app.claim.RefuseLockedClaimEdit
  govern: [ transaction ]
  next: lined
lined:
  class: net.officefloor.hq.app.claim.RefuseLinedAmountEdit
  govern: [ transaction ]
  next: retired
retired:
  class: net.officefloor.hq.app.claim.RefuseRetiredClaimEdit
  govern: [ transaction ]
  next: correction
correction:
  class: net.officefloor.hq.app.claim.RefuseInvalidCorrectionEdit
  govern: [ transaction ]
  next: ref
ref:
  class: net.officefloor.hq.app.claim.RefuseUsedRefEdit
  govern: [ transaction ]
  next: closed
closed:
  class: net.officefloor.hq.app.period.RefuseClosedClaimEdit
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveClaim
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimEdited
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditClaimRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
