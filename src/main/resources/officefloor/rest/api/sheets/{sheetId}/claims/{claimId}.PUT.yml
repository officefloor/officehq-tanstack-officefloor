# PUT /api/sheets/{sheetId}/claims/{claimId} — edit a claim's amount, date and note (body as an
# add). Refused (400) like an add, when the claim is not on the sheet, or
# when its date or its new date falls in a closed period; nothing is stored then.
# A stored change is recorded in the audit file as CLAIM_EDITED; a refused one records nothing.
validate:
  class: net.officefloor.hq.app.claim.ValidateClaim
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: checkClaim
checkClaim:
  class: net.officefloor.hq.app.claim.CheckClaimPeriod
  govern: [ transaction ]
  next: checkDate
checkDate:
  class: net.officefloor.hq.app.claim.CheckDatePeriod
  govern: [ transaction ]
  next: snapshot
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.claim.ApplyClaim
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveClaim
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimEdited
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
