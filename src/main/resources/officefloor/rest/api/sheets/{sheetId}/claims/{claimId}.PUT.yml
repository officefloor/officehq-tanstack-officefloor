# Edit a claim (amount, date, note); refused while another user's editor holds it, and saving drops the user's lock. Validate the body before touching the store, so a refusal writes nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: claim
claim:
  class: net.officefloor.hq.app.claim.ValidateClaim
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: locked
locked:
  class: net.officefloor.hq.app.claim.RefuseLockedClaim
  govern: [ transaction ]
  next: draft
draft:
  class: net.officefloor.hq.app.claim.RefuseNonDraftEdit
  govern: [ transaction ]
  next: correction
correction:
  class: net.officefloor.hq.app.claim.RefuseBadEditedCorrection
  govern: [ transaction ]
  next: ref
ref:
  class: net.officefloor.hq.app.claim.RefuseUsedEditedRef
  govern: [ transaction ]
  next: closed
closed:
  class: net.officefloor.hq.app.claim.RefuseClosedClaim
  govern: [ transaction ]
  next: retired
retired:
  class: net.officefloor.hq.app.claim.RefuseRetiredClaimDate
  govern: [ transaction ]
  next: rollup-before
rollup-before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.claim.ApplyClaim
  govern: [ transaction ]
  next: release
release:
  class: net.officefloor.hq.app.claim.ReleaseClaimLock
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.RecordClaimEdited
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
