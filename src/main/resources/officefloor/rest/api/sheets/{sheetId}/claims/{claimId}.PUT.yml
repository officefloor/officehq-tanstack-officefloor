# PUT /api/sheets/{sheetId}/claims/{claimId} — edit a claim's amount, date and note. Body as for an
# add; refused the same way (400), 404 for a claim not on the sheet, and 422 for a claim dated, or
# being dated, inside a closed period.
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  next: validate
  govern: [ transaction ]
validate:
  class: net.officefloor.hq.app.claim.ValidateClaim
  next: load
  govern: [ transaction ]
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  next: closed
  govern: [ transaction ]
closed:
  class: net.officefloor.hq.app.claim.RefuseClosedClaim
  next: closedTo
  govern: [ transaction ]
closedTo:
  class: net.officefloor.hq.app.claim.RefuseClosedInput
  next: apply
  govern: [ transaction ]
apply:
  class: net.officefloor.hq.app.claim.ApplyClaim
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.claim.AuditClaimEdited
  next: rollup
  govern: [ transaction ]
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.claim.RespondWithEditedClaim
  govern: [ transaction ]
