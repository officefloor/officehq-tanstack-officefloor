# PUT /api/sheets/{sheetId}/claims/{claimId} — edit a claim's amount, date and note (body as an
# add). Refused (400) like an add, or when the claim is not on the sheet; nothing is stored then.
validate:
  class: net.officefloor.hq.app.claim.ValidateClaim
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.claim.ApplyClaim
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveClaim
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
