# Edit a claim's amount, date and note; refused (400) on the same terms as an add.
# Only a DRAFT claim can be edited; any other is refused (400).
# A claim whose due-by (kept by the edit, whatever its new date) falls inside a closed period is refused (400).
# A claim edited to a date after its person's retirement date is refused (400).
# An external reference another claim on the sheet has, ignoring case, is refused (400); a blank one clears it.
# Tags replace the claim's (blank: none), as on an add.
# A correction is refused (400) on the same terms as an add.
# The editing user is recorded as the claim's last editor: they cannot settle or approve it.
# A claim with lines takes no other amount than its lines make (400).
# A claim another user has locked (their editor is open on it) is refused (400); a save releases the user's lock.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: validate
validate:
  class: net.officefloor.hq.app.claim.ValidateClaimRequest
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: checkLock
checkLock:
  class: net.officefloor.hq.app.claim.CheckClaimNotLocked
  govern: [ transaction ]
  next: checkDraft
checkDraft:
  class: net.officefloor.hq.app.claim.CheckClaimDraft
  govern: [ transaction ]
  next: checkPeriod
checkPeriod:
  class: net.officefloor.hq.app.claim.CheckClaimPeriodOpen
  govern: [ transaction ]
  next: checkLines
checkLines:
  class: net.officefloor.hq.app.claim.CheckClaimLinesAmount
  govern: [ transaction ]
  next: person
person:
  class: net.officefloor.hq.app.claim.LoadClaimPerson
  govern: [ transaction ]
  next: checkRetired
checkRetired:
  class: net.officefloor.hq.app.claim.CheckClaimInputNotRetired
  govern: [ transaction ]
  next: checkCorrects
checkCorrects:
  class: net.officefloor.hq.app.claim.CheckClaimEditCorrects
  govern: [ transaction ]
  next: checkRef
checkRef:
  class: net.officefloor.hq.app.claim.CheckClaimRef
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.claim.ApplyClaim
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveClaim
  govern: [ transaction ]
  next: edited
edited:
  class: net.officefloor.hq.app.claim.MarkClaimEdited
  govern: [ transaction ]
  next: ref
ref:
  class: net.officefloor.hq.app.claim.SaveClaimRef
  govern: [ transaction ]
  next: tags
tags:
  class: net.officefloor.hq.app.claim.SaveClaimTags
  govern: [ transaction ]
  next: unlock
unlock:
  class: net.officefloor.hq.app.claim.UnlockClaim
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimEdited
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
