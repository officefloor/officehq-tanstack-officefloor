# Edit a DRAFT claim's amount, date and note. Validate before Load so an invalid body is a 400, not masked
# by a 404.
validate:
  class: net.officefloor.hq.app.claim.ValidateClaim
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: editable
# Only a DRAFT can be edited: any other status is refused (409) and writes nothing. To change an OPEN
# claim, void it and add a new one.
editable:
  class: net.officefloor.hq.app.claim.CheckClaimEditable
  govern: [ transaction ]
  next: check
# A claim dated inside a closed period, before or after the edit, is refused (409) and writes nothing.
check:
  class: net.officefloor.hq.app.claim.CheckClaimPeriod
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.claim.ApplyClaim
  govern: [ transaction ]
  next: recheck
recheck:
  class: net.officefloor.hq.app.claim.CheckClaimPeriod
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveClaim
  govern: [ transaction ]
  next: audit
# Record the change only once it is saved, so a refused change writes no audit line.
audit:
  class: net.officefloor.hq.app.claim.AuditClaimEdited
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
