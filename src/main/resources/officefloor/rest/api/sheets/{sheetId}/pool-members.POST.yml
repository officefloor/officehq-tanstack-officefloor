# POST /api/sheets/{sheetId}/pool-members — adds a person, or another pool, to a pool. Body
# {"pool":"...","personId":1,"share":"50.00"} or {"pool":"...","memberPool":"...","share":"50.00"}. A person already in
# the pool, a pool already a member of a pool, a pool containing itself through any chain, a chain more than three deep,
# or a share that is not more than 0.00 and at most 100.00 with at most two decimals, is refused with 422 and nothing is stored or recorded.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: validate
  govern: [ transaction ]
validate:
  class: net.officefloor.hq.app.pool.ValidatePoolMember
  next: add
  govern: [ transaction ]
add:
  class: net.officefloor.hq.app.pool.AddPoolMember
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.pool.AuditPoolMemberAdded
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.pool.RespondWithPoolMember
  govern: [ transaction ]
