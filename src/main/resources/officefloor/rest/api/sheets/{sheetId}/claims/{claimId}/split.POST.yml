# Split an amount (more than 0.00, less than the claim's) off an OPEN claim: it keeps the rest and loses any figure a statement bound it to; a new OPEN claim with the split-off amount, the same date and note, the next number, opened by the user, its due-by fixed now and the original's number as its split-from, is added under the person. A refused split (not OPEN, deferred, an amount out of range, unknown claim, a claim dated in a closed period) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.claim.ValidateSplit
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: closed
closed:
  class: net.officefloor.hq.app.period.RefuseClosedClaim
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveSplit
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimSplit
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditSplitRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
