# PUT /api/sheets/{sheetId}/periods/{periodId}/reopen — reopen a closed period (a role the permission matrix allows; a steward by the standing rule), making its due-total live again.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: period
period:
  class: net.officefloor.hq.app.period.LoadPeriod
  govern: [ transaction ]
  next: reopen
reopen:
  class: net.officefloor.hq.app.period.ReopenPeriod
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.period.AuditPeriodReopened
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithPeriod
  govern: [ transaction ]
