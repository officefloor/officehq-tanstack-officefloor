# Quick-add a draft claim for a person named by the bar, adding the person (grade A) when the name is not on
# the sheet. One change: every check runs before anything is written, so a refusal leaves no person behind.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: fields
fields:
  class: net.officefloor.hq.app.quickadd.ValidateQuickAdd
  next: ensure
ensure:
  class: net.officefloor.hq.app.sheet.EnsureSheet
  govern: [ transaction ]
  next: closed
closed:
  class: net.officefloor.hq.app.claim.RefuseClosedDate
  govern: [ transaction ]
  next: person-rollup-before
person-rollup-before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: person
person:
  class: net.officefloor.hq.app.quickadd.ResolvePerson
  govern: [ transaction ]
  next: person-audit
person-audit:
  class: net.officefloor.hq.app.quickadd.RecordQuickAddPerson
  govern: [ transaction ]
  next: person-rollup
person-rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: rollup-before
rollup-before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: build
build:
  class: net.officefloor.hq.app.claim.BuildClaim
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.RecordClaimAdded
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
