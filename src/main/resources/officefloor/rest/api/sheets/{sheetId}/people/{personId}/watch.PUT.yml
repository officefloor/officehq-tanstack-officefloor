# Start or stop the signed-in user watching a person. Watching is the user's own: a watch already in place (or an
# unwatch of one not in place) changes nothing and writes nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: watch
watch:
  class: net.officefloor.hq.app.person.ValidateWatch
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.person.ApplyWatch
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.person.RecordPersonWatch
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
