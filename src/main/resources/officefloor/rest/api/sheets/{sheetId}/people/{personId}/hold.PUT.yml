# PUT /api/sheets/{sheetId}/people/{personId}/hold — add a hold to the person.
# Body: { "from": "YYYY-MM-DD" (blank: the sheet's today), "to": "YYYY-MM-DD" (blank: open-ended) }.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: validate
validate:
  class: net.officefloor.hq.app.person.ValidateHold
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: person
person:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.person.ApplyHold
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.person.AuditPersonHeld
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
