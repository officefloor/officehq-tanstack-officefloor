# Settle the selected claims together, in list order, by the rules of settling one. All or nothing:
# if any cannot be settled, none is and every one is refused; the response tells how many were
# settled (a claim sent to PENDING counts) and how many refused.
validate:
  class: net.officefloor.hq.app.claim.ValidateBulkSettle
  next: loadSheet
loadSheet:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: settle
# Each claim settled is audited as it is settled: its own line, then the figures it moved; then
# the batch's BATCH_SETTLED line.
settle:
  class: net.officefloor.hq.app.claim.SettleSelectedClaims
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithBulkSettle
  govern: [ transaction ]
