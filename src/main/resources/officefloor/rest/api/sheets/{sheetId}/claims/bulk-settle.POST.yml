# Settle the selected claims together, all or nothing, in list order (people as added, each one's claims newest
# first), each as settling it alone would. One left PENDING counts as settled; if any one cannot be settled, none
# is, all count as refused and nothing is written. Answers how many were settled and how many refused.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: selected
selected:
  class: net.officefloor.hq.app.claim.ValidateBulkSettle
  next: settle
settle:
  class: net.officefloor.hq.app.claim.SettleClaims
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithBulkSettle
  govern: [ transaction ]
