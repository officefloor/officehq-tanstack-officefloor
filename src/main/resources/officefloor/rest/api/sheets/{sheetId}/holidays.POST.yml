# Add a holiday. Validate first so a bad or repeated date is a 400 and writes nothing.
validate:
  class: net.officefloor.hq.app.holiday.ValidateHoliday
  govern: [ transaction ]
  next: snapshot
# Keep the figures as they were, so the change can audit the ones it moves (a re-fixed due-by moves overdues).
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.holiday.SaveHoliday
  govern: [ transaction ]
  next: refix
# Every claim not SETTLED or VOID due by the new holiday or later is re-fixed over the holidays now.
refix:
  class: net.officefloor.hq.app.holiday.RefixDueBys
  govern: [ transaction ]
  next: record
# Audit only once the holiday is saved: a refused one writes no line.
record:
  class: net.officefloor.hq.app.holiday.RecordHolidayAdded
  govern: [ transaction ]
  next: rollup
# After the change's own line: a line per person whose figures moved, then the totals if they did.
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.holiday.RespondWithHoliday
  govern: [ transaction ]
