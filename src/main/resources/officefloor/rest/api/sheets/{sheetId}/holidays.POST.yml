# Add a date to the sheet's holidays; a date already on the list is refused.
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: validate
validate:
  class: net.officefloor.hq.app.settings.ValidateHoliday
  next: save
save:
  class: net.officefloor.hq.app.settings.SaveHoliday
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.settings.RespondWithSettings
