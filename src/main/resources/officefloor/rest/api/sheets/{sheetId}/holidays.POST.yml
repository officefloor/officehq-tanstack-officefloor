# Add a date (yyyy-mm-dd) to the sheet's holidays (HOLIDAY_ADDED); a date not yyyy-mm-dd or one already on the
# list is refused (400). Every claim that is not SETTLED or VOID and is due by on or after the new holiday has its due-by
# worked out again from its date, with the terms it was fixed with, over the holidays now on the sheet; ROLLUP/TOTALS
# follow HOLIDAY_ADDED when any figure moved. Responds with the sheet's holidays, earliest first.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: validate
validate:
  class: net.officefloor.hq.app.holiday.ValidateHolidayRequest
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.holiday.SaveHoliday
  govern: [ transaction ]
  next: refix
refix:
  class: net.officefloor.hq.app.holiday.RefixDueBys
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.holiday.AuditHolidayAdded
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: holidays
holidays:
  class: net.officefloor.hq.app.holiday.LoadHolidays
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.holiday.RespondWithHolidays
  govern: [ transaction ]
