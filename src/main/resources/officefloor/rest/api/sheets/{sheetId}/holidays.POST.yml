# Add a holiday. Validate the body before touching the store, so a refusal writes nothing. The holiday re-fixes the due-by
# of each claim not SETTLED or VOID due on or after it, so the figures a new holiday moved are recorded after the change.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: holiday
holiday:
  class: net.officefloor.hq.app.holiday.ValidateHoliday
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: ensure
ensure:
  class: net.officefloor.hq.app.sheet.EnsureSheet
  govern: [ transaction ]
  next: rollup-before
rollup-before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: build
build:
  class: net.officefloor.hq.app.holiday.BuildHoliday
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.holiday.RecordHolidayAdded
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.holiday.RespondWithHoliday
  govern: [ transaction ]
