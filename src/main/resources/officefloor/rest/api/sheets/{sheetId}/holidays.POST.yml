# POST /api/sheets/{sheetId}/holidays — add a holiday to the sheet. A date that is not yyyy-MM-dd or one already on the
# sheet's list is a 400 and writes nothing. Re-fixes the due-by of every claim neither SETTLED nor VOID whose due-by is on
# or after the holiday, then writes HOLIDAY_ADDED and the figures that moved. Responds 201 with the date.
validate:
  class: net.officefloor.hq.app.holiday.ValidateHoliday
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: add
add:
  class: net.officefloor.hq.app.holiday.AddHoliday
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.holiday.RecordHolidayAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.holiday.RespondWithHolidayCreated
