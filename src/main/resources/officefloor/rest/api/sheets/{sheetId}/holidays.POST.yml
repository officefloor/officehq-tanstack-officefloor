# Add a holiday to the sheet. Each claim not SETTLED or VOID whose due-by is on or after it has its due-by re-fixed over
# the holidays now on the sheet; the rest keep theirs. HOLIDAY_ADDED is followed by the rollup lines when a figure moved.
# A refused add (bad date, a date already on the list) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.holiday.ValidateHoliday
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.holiday.SaveHoliday
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.holiday.AuditHolidayAdded
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditHolidayRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.holiday.RespondWithHoliday
  govern: [ transaction ]
