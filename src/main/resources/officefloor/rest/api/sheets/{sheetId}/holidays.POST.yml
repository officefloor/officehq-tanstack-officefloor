# POST /api/sheets/{sheetId}/holidays — add a holiday. Body: { "date": "YYYY-MM-DD" }.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: validate
validate:
  class: net.officefloor.hq.app.holiday.ValidateHoliday
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.holiday.ApplyHoliday
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.holiday.AuditHolidayAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.holiday.RespondWithHoliday
  govern: [ transaction ]
