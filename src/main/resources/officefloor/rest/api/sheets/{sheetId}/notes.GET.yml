# The notes on a sheet, newest first. Read as of a date, those added while the sheet's today was on or before it.
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ readonly-transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.note.RespondWithNotes
  govern: [ readonly-transaction ]
