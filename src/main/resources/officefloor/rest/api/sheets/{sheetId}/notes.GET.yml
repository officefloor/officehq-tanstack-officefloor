# GET /api/sheets/{sheetId}/notes — the sheet's notes, newest first; as of a date (asOf), those added by then.
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheetForRead
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.note.RespondWithNotes
  govern: [ transaction ]
