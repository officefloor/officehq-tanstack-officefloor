# GET /api/sheets/{sheetId}/notes — the sheet's notes, newest first, each its text, who added it and the sheet's today
# when they did. Read as of a date (see AsOf), only the notes added while the sheet's today was on or before it.
respond:
  class: net.officefloor.hq.app.note.RespondWithNotes
  govern: [ readonly-transaction ]
