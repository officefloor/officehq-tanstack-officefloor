# A steward flags a person with a reason until a date, replacing any flag they had. While the sheet's today is on or before
# the until date only a steward may open the person's claims. A refused flag (no signed-in user, a blank reason, a bad date,
# a user who is not a steward, unknown person) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.flag.ValidateFlag
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.flag.SaveFlag
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.flag.AuditPersonFlagged
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.flag.RespondWithFlag
  govern: [ transaction ]
