# The generate button: every plan's due claims as DRAFTs. The sheet's figures are taken first, so the change can audit what it moved.
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: generate
generate:
  class: net.officefloor.hq.app.claim.GeneratePlanClaims
  govern: [ transaction ]
