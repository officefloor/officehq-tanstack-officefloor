# For every plan on the sheet, in the order added, a DRAFT claim for each plan date up to its end and the sheet's today
# that has none yet, by the claim form's rules (a date they refuse is skipped and tried again next time). Answers how
# many were made. A viewer's press, or one on an archived sheet, goes through with nothing made.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: by
by:
  class: net.officefloor.hq.app.plan.ValidateGenerate
  next: ensure
ensure:
  class: net.officefloor.hq.app.sheet.EnsureSheet
  govern: [ transaction ]
  next: generate
generate:
  class: net.officefloor.hq.app.claim.GeneratePlanClaims
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithGenerate
  govern: [ transaction ]
