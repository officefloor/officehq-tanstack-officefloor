# Generate the plans' DRAFT claims up to the sheet's today (see GeneratePlanClaims). Responds with how many were made.
validate:
  class: net.officefloor.hq.app.plan.ValidateGenerate
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: generate
generate:
  class: net.officefloor.hq.app.plan.GeneratePlanClaims
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithGenerated
  govern: [ transaction ]
