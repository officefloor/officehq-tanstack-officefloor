# The audit line is written last, once every rule has passed, so a refused change writes none.
# A correction (a negative amount) must name a SETTLED claim of the same person by its number.
# Validate first so a bad amount or date is a 400 and nothing is written; then the person must exist.
validate:
  class: net.officefloor.hq.app.claim.ValidateClaim
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: unclosed
unclosed:
  class: net.officefloor.hq.app.claim.CheckClaimAddOpen
  govern: [ transaction ]
  next: retired
retired:
  class: net.officefloor.hq.app.claim.CheckClaimAddRetired
  govern: [ transaction ]
  next: correction
correction:
  class: net.officefloor.hq.app.claim.CheckClaimAddCorrection
  govern: [ transaction ]
  next: create
create:
  class: net.officefloor.hq.app.claim.CreateClaim
  govern: [ transaction ]
  next: log
log:
  class: net.officefloor.hq.app.claim.LogClaimStatus
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimAdded
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaimCreated
  govern: [ transaction ]
