# The audit line is written last, once every rule has passed, so a refused change writes none.
# Validate first so a bad amount or date is a 400 and nothing is written; then the person must exist.
validate:
  class: net.officefloor.hq.app.claim.ValidateClaim
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: create
create:
  class: net.officefloor.hq.app.claim.CreateClaim
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaimCreated
  govern: [ transaction ]
