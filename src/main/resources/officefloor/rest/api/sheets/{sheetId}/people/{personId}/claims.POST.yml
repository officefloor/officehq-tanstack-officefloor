# POST /api/sheets/{sheetId}/people/{personId}/claims — add a claim to a person; a missing or
# over-two-decimal amount, a date that is not a date, or a correction (a negative amount) that does
# not name by number a SETTLED claim of the person, is refused.
validate:
  class: net.officefloor.hq.app.claim.ValidateClaim
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: create
create:
  class: net.officefloor.hq.app.claim.AddClaim
  govern: [ transaction ]
  next: log
log:
  class: net.officefloor.hq.app.claim.LogClaimStatus
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.RecordClaimAdded
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
