# Add a claim to a person. Validate the body before touching the store, so a refusal writes nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: claim
claim:
  class: net.officefloor.hq.app.claim.ValidateClaim
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: build
build:
  class: net.officefloor.hq.app.claim.BuildClaim
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.RecordClaimAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
