# Add a claim to a person. Validate the body before touching the store, so a refusal writes nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: claim
claim:
  class: net.officefloor.hq.app.claim.ValidateClaim
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: correction
correction:
  class: net.officefloor.hq.app.claim.RefuseBadNewCorrection
  govern: [ transaction ]
  next: closed
closed:
  class: net.officefloor.hq.app.claim.RefuseClosedNewDate
  govern: [ transaction ]
  next: retired
retired:
  class: net.officefloor.hq.app.claim.RefuseRetiredDate
  govern: [ transaction ]
  next: rollup-before
rollup-before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: build
build:
  class: net.officefloor.hq.app.claim.BuildClaim
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.RecordClaimAdded
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
