# POST /api/sheets/{sheetId}/people/{personId}/claims — add a claim to a person. Body
# {"amount":"12.50","date":"yyyy-mm-dd","note":"...","corrects":"","ref":""}; a blank date is the entry date, else the sheet's today.
# An amount that is not a number with up to two decimals, a date that is not real, a negative amount
# (a correction) whose "corrects" is not the number of a SETTLED claim of the same person, or a
# "corrects" on an amount that is not negative, or a "ref" (trimmed; blank for none) another claim of the sheet
# already carries (ignoring case), is refused with 400 and nothing is stored; 404 for a person not on the sheet; 422 for a claim whose due-by (its date, or a
# blank date's today, plus its person's terms) is inside a closed period.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: snapshot
  govern: [ transaction ]
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  next: validate
  govern: [ transaction ]
validate:
  class: net.officefloor.hq.app.claim.ValidateClaim
  next: load
  govern: [ transaction ]
load:
  class: net.officefloor.hq.app.person.LoadPerson
  next: correction
  govern: [ transaction ]
correction:
  class: net.officefloor.hq.app.claim.RefuseInvalidCorrectionInput
  next: closed
  govern: [ transaction ]
closed:
  class: net.officefloor.hq.app.claim.RefuseClosedNewInput
  next: retired
  govern: [ transaction ]
retired:
  class: net.officefloor.hq.app.claim.RefuseRetiredInput
  next: ref
  govern: [ transaction ]
ref:
  class: net.officefloor.hq.app.claim.RefuseUsedRefInput
  next: add
  govern: [ transaction ]
add:
  class: net.officefloor.hq.app.claim.AddClaim
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.claim.AuditClaimAdded
  next: rollup
  govern: [ transaction ]
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
