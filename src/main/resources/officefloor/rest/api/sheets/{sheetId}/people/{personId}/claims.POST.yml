# Add a claim to a person. Validate before Load so a bad amount or date is a 400 and writes nothing;
# a claim given no date takes the sheet's today.
validate:
  class: net.officefloor.hq.app.claim.ValidateClaim
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: build
build:
  class: net.officefloor.hq.app.claim.BuildClaim
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.claim.ApplyClaim
  govern: [ transaction ]
  next: check
# A claim dated inside a closed period is refused (409) and writes nothing.
check:
  class: net.officefloor.hq.app.claim.CheckClaimPeriod
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveClaim
  govern: [ transaction ]
  next: audit
# Record the change only once it is saved, so a refused change writes no audit line.
audit:
  class: net.officefloor.hq.app.claim.AuditClaimAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
