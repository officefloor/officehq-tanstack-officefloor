# Add a claim to a person; an amount that is missing, negative or has more than two decimals, or a bad date, is refused (400). A blank date is the sheet's today.
# A claim whose due-by (its date plus the terms it would get) falls inside a closed period, or after its person's retirement date, is refused (400).
# An external reference (surrounding spaces removed; blank: none) another claim on the sheet has, ignoring case, is refused (400).
# A negative amount (a correction) is refused (400) unless it names, by number, a SETTLED claim of the same person.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: validate
validate:
  class: net.officefloor.hq.app.claim.ValidateClaimRequest
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: checkRetired
checkRetired:
  class: net.officefloor.hq.app.claim.CheckClaimInputNotRetired
  govern: [ transaction ]
  next: checkNewPeriod
checkNewPeriod:
  class: net.officefloor.hq.app.claim.CheckClaimInputPeriodOpen
  govern: [ transaction ]
  next: checkCorrects
checkCorrects:
  class: net.officefloor.hq.app.claim.CheckClaimInputCorrects
  govern: [ transaction ]
  next: checkRef
checkRef:
  class: net.officefloor.hq.app.claim.CheckClaimInputRef
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: build
build:
  class: net.officefloor.hq.app.claim.BuildClaim
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveClaim
  govern: [ transaction ]
  next: ref
ref:
  class: net.officefloor.hq.app.claim.SaveClaimRef
  govern: [ transaction ]
  next: log
log:
  class: net.officefloor.hq.app.claim.LogClaimStatus
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimAdded
  govern: [ transaction ]
  next: late
late:
  class: net.officefloor.hq.app.claim.MarkLateEntry
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
