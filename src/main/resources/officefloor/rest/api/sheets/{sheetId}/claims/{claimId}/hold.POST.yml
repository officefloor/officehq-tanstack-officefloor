# Toggle an OPEN or PENDING claim's hold: holding writes CLAIM_HELD, releasing CLAIM_RELEASED. A held claim leaves the
# live totals as a hold on its person would (a figure bound by a statement stays in). Any other status is refused (400)
# and writes nothing.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: check
check:
  class: net.officefloor.hq.app.claim.CheckClaimHold
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: hold
hold:
  class: net.officefloor.hq.app.claim.HoldClaim
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimHeld
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
