# Flag the person (a steward only) with a reason until a date.
validate:
  class: net.officefloor.hq.app.person.ValidateFlag
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: flag
flag:
  class: net.officefloor.hq.app.person.FlagPerson
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
