# Flag a person with a reason until a date (blank: the sheet's today), replacing any flag they had. Only a steward
# flags; anyone else, a blank reason or a bad date is refused (400), a person not on the sheet (404). While the
# sheet's today is on or before the until date, only a steward may open a claim of the person.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: steward
steward:
  class: net.officefloor.hq.app.person.CheckFlagSteward
  next: validate
validate:
  class: net.officefloor.hq.app.person.ValidateFlagRequest
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: flag
flag:
  class: net.officefloor.hq.app.person.FlagPerson
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.person.AuditPersonFlagged
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
