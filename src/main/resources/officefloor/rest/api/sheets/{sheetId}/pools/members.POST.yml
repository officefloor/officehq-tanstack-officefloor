# Add a member to a pool. Validate first so a person already in the pool, or a bad share, is a 400
# and writes nothing.
validate:
  class: net.officefloor.hq.app.pool.ValidatePoolMember
  govern: [ transaction ]
  next: snapshot
# Keep the figures as they were, so the change can audit the ones it moves (a cut lowers the cap's room).
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.pool.SavePoolMember
  govern: [ transaction ]
  next: record
# Audit only once the member is saved: a refused one writes no line.
record:
  class: net.officefloor.hq.app.pool.RecordPoolMemberAdded
  govern: [ transaction ]
  next: rollup
# After the change's own line: a line per person whose figures moved, then the totals if they did.
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.pool.RespondWithPools
  govern: [ transaction ]
