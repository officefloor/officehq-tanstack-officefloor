# POST /api/sheets/{sheetId}/pools/members — add a person, or another pool (memberPool), to a pool with a share percent.
# An unknown pool or person, a person already in the pool, a share not more than 0.00 and at most 100.00 with two
# decimals, or a member pool already a member of a pool, that would contain itself through any chain or make a chain of
# pools more than three deep, or a from-date or to-date not yyyy-MM-dd or a to-date before the from-date is a 400 and
# writes nothing. Responds 201 with the member.
validate:
  class: net.officefloor.hq.app.pool.ValidatePoolMember
  next: add
add:
  class: net.officefloor.hq.app.pool.AddPoolMember
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.pool.RecordPoolMemberAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.pool.RespondWithPoolMemberCreated
