# Add a member to a pool: a person on the sheet not yet in it, with a share percent (more than 0.00, at
# most 100.00, up to two decimals). Answers the sheet's pools.
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: validate
validate:
  class: net.officefloor.hq.app.pool.ValidatePoolMember
  next: add
add:
  class: net.officefloor.hq.app.pool.AddPoolMember
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.pool.LoadPools
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.pool.RespondWithPools
