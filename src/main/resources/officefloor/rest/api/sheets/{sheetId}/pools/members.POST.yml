# Add a person to a pool with a share. Validate the body before touching the store, so a refusal writes nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: member
member:
  class: net.officefloor.hq.app.pool.ValidatePoolMember
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: ensure
ensure:
  class: net.officefloor.hq.app.sheet.EnsureSheet
  govern: [ transaction ]
  next: add
add:
  class: net.officefloor.hq.app.pool.AddPoolMember
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.pool.RecordPoolMemberAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.pool.RespondWithPoolsNow
  govern: [ transaction ]
