# Clone the sheet to an id never used: a steward only (see SheetCloner). A refused clone writes nothing, not even an
# audit line.
validate:
  class: net.officefloor.hq.app.sheet.ValidateClone
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.sheet.SaveClone
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.sheet.RespondWithClone
  govern: [ transaction ]
