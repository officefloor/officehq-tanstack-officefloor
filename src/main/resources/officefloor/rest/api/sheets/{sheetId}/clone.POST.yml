# A steward clones the sheet to another id, one never used: its settings, people, pools, periods (all open) and
# claims (numbered afresh) are copied; statements are not.
guard:
  class: net.officefloor.hq.app.history.RefuseAsOf
  next: clone
clone:
  class: net.officefloor.hq.app.sheet.CloneSheet
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.sheet.RespondWithClone
