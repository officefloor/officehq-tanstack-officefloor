# POST /api/sheets/{sheetId}/clone — clone the sheet to another id (body: {to, user}). Only a steward clones,
# and only to a sheet never used (never loaded or changed). The clone gets this sheet's today, settings, roles,
# rates, holidays, void reasons, templates, people (grades, terms, contacts, aliases, tags, holds, retirements,
# patrons), pools, periods (all open) and claims (status, frozen figures, dates, notes, logs), the claims that
# had a number numbered afresh by the clone's own numbering in the order they were opened (by the sheet's today
# when each was opened, then in list order of their people and the order they were added). Statements, watches
# and delegations are not copied. Refused (400), storing nothing, otherwise. Recorded as SHEET_CLONE_MADE on
# this sheet, and SHEET_CLONED on the clone followed by its rollup lines for every person and its totals.
validate:
  class: net.officefloor.hq.app.sheet.ValidateClone
  next: clone
clone:
  class: net.officefloor.hq.app.sheet.CloneSheet
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.sheet.AuditCloned
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.sheet.RespondWithClone
  govern: [ transaction ]
