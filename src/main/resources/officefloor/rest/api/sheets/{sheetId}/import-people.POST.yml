# Import: a person per line of name,grade,terms,contact (terms and contact may be absent or blank), in order. Every
# line is checked first with the person form's rules (and no name or contact may repeat within the import); any line
# refused refuses the whole import (400) and nothing is written. A line whose name is a person's name or alias on the
# sheet updates that person as the form's edit does (grade from the sheet's today; terms and contact only when given;
# PERSON_EDITED); any other line is added as the form adds them (PERSON_ADDED); each followed by its rollup lines.
# Answers how many people were added and how many updated.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: validate
validate:
  class: net.officefloor.hq.app.importpeople.ValidateImportPeopleRequest
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: check
check:
  class: net.officefloor.hq.app.importpeople.CheckImportedPeopleUnique
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.importpeople.SaveImportedPeople
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.importpeople.RespondWithImportResult
  govern: [ transaction ]
