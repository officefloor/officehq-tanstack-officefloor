# POST /api/sheets/{sheetId}/import-people — add or update a person per pasted line of name,grade,terms,contact, in
# order. A line whose name is a person's name or alias on the sheet (ignoring case) updates that person as the person
# form's edit would: their grade from the sheet's today, their terms and contact when the line gives them.
# Body: { "text": "..." }. Every line is checked by the person form's rules before anything is stored (a name,
# ignoring case, or a contact repeated in the paste refuses it too), so one refused line imports nothing.
# Each person is recorded as the person form records them (PERSON_ADDED or PERSON_EDITED, then the figures it moved).
# Responds { "added": n, "updated": n }.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: validate
validate:
  class: net.officefloor.hq.app.importpeople.ValidateImportPeople
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: add
add:
  class: net.officefloor.hq.app.importpeople.AddImportedPeople
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.importpeople.RespondWithImportedPeople
  govern: [ transaction ]
