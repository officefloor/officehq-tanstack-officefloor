# POST /api/sheets/{sheetId}/import-people — add or update a person per pasted line, in order (body: {text, user}).
# Each line is name,grade,terms,contact; terms and contact may be absent or blank, and a blank grade is the sheet's default grade. A line whose name is a
# person's name or alias on the sheet (as names are compared) updates that person: the grade recorded from the
# sheet's today as the edit form would, their terms and contact set when the line gives them, recorded as
# PERSON_EDITED (and its ROLLUP) as an edit is. Any other line adds a person, recorded as PERSON_ADDED (and its
# ROLLUP), as a single add is. Every line is first checked with the person form's rules (see people.POST.yml),
# and a name (ignoring case and the spaces around it), person or contact given by an earlier line is refused
# too; refused (400), storing nothing and recording nothing, when any line fails or there is no line.
# Answers {added, updated}.
validate:
  class: net.officefloor.hq.app.peopleimport.ValidateImport
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.peopleimport.SaveImported
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.peopleimport.RespondWithImport
  govern: [ transaction ]
