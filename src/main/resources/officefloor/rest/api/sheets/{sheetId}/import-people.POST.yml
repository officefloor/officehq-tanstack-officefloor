# POST /api/sheets/{sheetId}/import-people — add or update a person per pasted line of name,grade,terms,contact (terms
# and contact may be absent or blank; a blank grade is the sheet's default grade, A while blank), in order. Every line is checked first by the person form's rules (see the add of
# a person), no name (case ignored) or contact repeated within the paste; a line failing them, or no lines at all, is a
# 400 (a name or contact already taken a 409) that writes nothing. A line whose name matches a person on the sheet (by
# name or alias, case ignored) updates them as the form edits one: the grade from the sheet's today, the terms and
# contact when the line gives them, checked as an edit and written as PERSON_EDITED; two lines matching one person is a
# 400. Every other line adds a person as the form adds one, written as PERSON_ADDED. Each writes the figures it moved.
# Responds with how many were added and how many updated.
validate:
  class: net.officefloor.hq.app.person.ValidateImportPeople
  next: check
check:
  class: net.officefloor.hq.app.person.CheckImportedPeople
  govern: [ transaction ]
  next: add
add:
  class: net.officefloor.hq.app.person.AddImportedPeople
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithImportPeople
