# Raise a claim's proofs count by one, and its count of the proof's kind (receipt or photo; none chosen: receipt). A
# SETTLED or VOID claim, a claim dated inside a closed period, or another kind, is refused (400) and writes nothing.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: validate
validate:
  class: net.officefloor.hq.app.claim.ValidateClaimProofRequest
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: checkPeriod
checkPeriod:
  class: net.officefloor.hq.app.claim.CheckClaimPeriodOpen
  govern: [ transaction ]
  next: check
check:
  class: net.officefloor.hq.app.claim.CheckClaimProof
  govern: [ transaction ]
  next: add
add:
  class: net.officefloor.hq.app.claim.AddClaimProof
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimProofAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
