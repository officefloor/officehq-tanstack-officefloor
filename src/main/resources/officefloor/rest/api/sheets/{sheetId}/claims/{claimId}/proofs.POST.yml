# POST /api/sheets/{sheetId}/claims/{claimId}/proofs — raise a claim's proofs count by one. A SETTLED or VOID claim, or
# a claim whose due-by falls inside a closed period, is a 409 and a claim not on the sheet a 404, neither writing anything. Responds
# with the claim as stored.
validate:
  class: net.officefloor.hq.app.claim.ValidateProof
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.claim.ApplyProof
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveProof
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.RecordClaimProofAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
