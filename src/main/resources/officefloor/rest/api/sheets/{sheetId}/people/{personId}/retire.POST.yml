# Retire a person from a date (blank: the sheet's today). Once the sheet's today reaches that date
# their OPEN and PENDING claims count in no live total, unless a statement binds them.
validate:
  class: net.officefloor.hq.app.person.ValidateRetire
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: snapshot
# Keep the figures as they were, so the change can audit the ones it moves.
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: retire
retire:
  class: net.officefloor.hq.app.person.RetirePerson
  govern: [ transaction ]
  next: record
# Audit only once the retirement is saved.
record:
  class: net.officefloor.hq.app.person.RecordPersonRetired
  govern: [ transaction ]
  next: rollup
# After the change's own lines: a line per person whose figures moved, then the totals if they did.
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
