# Retire a person from a date (blank: the sheet's today); a bad date is refused (400), a person not on the
# sheet (404). A claim dated after the date is refused from now on; from the day the date is reached (the sheet's
# today on or after it), their open and pending claims leave every live total as a hold's would.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: validate
validate:
  class: net.officefloor.hq.app.person.ValidateRetireRequest
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: retire
retire:
  class: net.officefloor.hq.app.person.RetirePerson
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.person.AuditPersonRetired
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
