# Retire a person from a date (blank: the sheet's today). No claim of theirs may be dated after it.
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: validate
validate:
  class: net.officefloor.hq.app.person.ValidateRetire
  next: retire
retire:
  class: net.officefloor.hq.app.person.RetirePerson
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
