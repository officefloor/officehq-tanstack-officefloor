# Resume a plan from the sheet's today. Refused (400, nothing written) when the plan is not paused.
validate:
  class: net.officefloor.hq.app.plan.ValidatePlanPause
  next: load
load:
  class: net.officefloor.hq.app.plan.LoadPlan
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.plan.ResumePlan
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlans
  govern: [ transaction ]
