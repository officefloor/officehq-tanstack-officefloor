# POST /api/sheets/{sheetId}/plans/{planId}/resume — Resumes the paused plan from the sheet's today; a plan not paused is refused. A plan not on the sheet is a 400, none writing anything. Writes PLAN_RESUMED. Responds 204.
load:
  class: net.officefloor.hq.app.plan.LoadPlan
  govern: [ transaction ]
  next: resume
resume:
  class: net.officefloor.hq.app.plan.ResumePlan
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithNoContent
