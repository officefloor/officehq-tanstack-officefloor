# Resume a paused plan on the sheet's today (resuming a running plan is refused). Answers the sheet's plans.
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: resume
resume:
  class: net.officefloor.hq.app.plan.ResumePlan
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.plan.LoadPlans
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlans
