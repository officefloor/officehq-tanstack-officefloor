# Resumes the paused plan on the sheet's today (PLAN_RESUMED); refused (400) when it is not paused.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.plan.LoadPlan
  govern: [ transaction ]
  next: resume
resume:
  class: net.officefloor.hq.app.plan.ResumePlan
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlan
  govern: [ transaction ]
