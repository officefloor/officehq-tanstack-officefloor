# Resume a plan from the sheet's today: a plan date on or after the day it was paused and before the day it was
# resumed is skipped, not postponed. A refused resume (the plan not paused, no today, unknown plan) writes nothing, not
# even an audit line.
validate:
  class: net.officefloor.hq.app.plan.ValidatePlanPause
  next: load
load:
  class: net.officefloor.hq.app.plan.LoadPlan
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.plan.SavePlanResume
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.plan.AuditPlanResume
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlan
  govern: [ transaction ]
