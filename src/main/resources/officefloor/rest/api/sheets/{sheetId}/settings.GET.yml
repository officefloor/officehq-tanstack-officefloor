# GET /api/sheets/{sheetId}/settings — the sheet's settings: its clerk limit, floor and terms.
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheetForRead
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.setting.RespondWithSettings
  govern: [ transaction ]
