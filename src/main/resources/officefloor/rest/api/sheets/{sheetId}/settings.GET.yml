# GET /api/sheets/{sheetId}/settings — the sheet's settings in force on its today: {"clerkLimit":"1.50","floor":"1.00","terms":"14",...} ("" for no limit),
# and "dated": every value recorded for each dated setting, by key: [{"from":"2026-03-05","value":"5.00"}].
respond:
  class: net.officefloor.hq.app.setting.RespondWithSettings
  govern: [ readonly-transaction ]
