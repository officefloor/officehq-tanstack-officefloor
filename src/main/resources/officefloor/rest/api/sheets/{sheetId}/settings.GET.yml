# The sheet's settings: its clerk limit (null: no limit), its floor and the roles given to user names.
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ readonly-transaction ]
  next: settings
settings:
  class: net.officefloor.hq.app.setting.LoadSettings
  govern: [ readonly-transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.setting.RespondWithSettings
  govern: [ readonly-transaction ]
