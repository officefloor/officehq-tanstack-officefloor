# Generate a period per calendar month from the from-date's month to the to-date's month, named yyyy-mm. A month
# whose name is in use or whose days overlap a period is left out; answers how many were made.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: range
range:
  class: net.officefloor.hq.app.period.ValidateGeneratePeriods
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: ensure
ensure:
  class: net.officefloor.hq.app.sheet.EnsureSheet
  govern: [ transaction ]
  next: generate
generate:
  class: net.officefloor.hq.app.period.GeneratePeriods
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithGeneratedPeriods
  govern: [ transaction ]
