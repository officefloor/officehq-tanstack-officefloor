# Add a member to a pool (POOL_MEMBER_ADDED): a person or another pool on the sheet and a share percent (more than 0.00,
# at most 100.00, two decimals), with an optional from-date and to-date (yyyy-mm-dd; a to-date before the from-date
# is refused; the audit gains from= and to= when given). A person already in the pool, a pool already a member of one, one containing this pool
# through any chain (or itself), one making a chain of pools more than three deep, or a bad share, is refused (400).
# Responds with the sheet's pools.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: validate
validate:
  class: net.officefloor.hq.app.pool.ValidatePoolMemberRequest
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.pool.SavePoolMember
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.pool.AuditPoolMemberAdded
  govern: [ transaction ]
  next: pools
pools:
  class: net.officefloor.hq.app.pool.LoadPools
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.pool.RespondWithPools
  govern: [ transaction ]
