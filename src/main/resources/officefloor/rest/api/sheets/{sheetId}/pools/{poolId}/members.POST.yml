# Add a person to a pool with a share percent. A refused add (bad share, unknown pool or person, a person already in
# the pool) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.pool.ValidatePoolMember
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.pool.SavePoolMember
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.pool.AuditPoolMemberAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.pool.RespondWithPoolMember
  govern: [ transaction ]
