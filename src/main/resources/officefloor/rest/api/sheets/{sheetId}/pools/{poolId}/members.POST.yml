# Add a member to a pool (POOL_MEMBER_ADDED): a person on the sheet and a share percent (more than 0.00, at most
# 100.00, two decimals). A person already in the pool, or a bad share, is refused (400). Responds with the sheet's pools.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: validate
validate:
  class: net.officefloor.hq.app.pool.ValidatePoolMemberRequest
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.pool.SavePoolMember
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.pool.AuditPoolMemberAdded
  govern: [ transaction ]
  next: pools
pools:
  class: net.officefloor.hq.app.pool.LoadPools
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.pool.RespondWithPools
  govern: [ transaction ]
