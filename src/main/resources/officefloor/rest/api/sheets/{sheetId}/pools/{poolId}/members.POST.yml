# POST /api/sheets/{sheetId}/pools/{poolId}/members — add a person of the sheet to the pool with a share;
# refused for a person already in it or a bad share. A viewer may change nothing: refused before
# anything is read or written.
guard:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: add
add:
  class: net.officefloor.hq.app.pool.AddPoolMember
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.pool.RecordPoolMemberAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.pool.RespondWithPools
