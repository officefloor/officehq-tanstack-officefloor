# POST /api/sheets/{sheetId}/pools/{poolId}/members — add a person to the pool.
# Body: { "personId": <id>, "share": "<percent>" }. Answers the sheet's pools.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: validate
validate:
  class: net.officefloor.hq.app.pool.ValidatePoolMember
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: pool
pool:
  class: net.officefloor.hq.app.pool.LoadPool
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.pool.ApplyPoolMember
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.pool.AuditPoolMemberAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.pool.RespondWithPools
  govern: [ transaction ]
