# Lock a period (a steward only); a locked period cannot be reopened. Validate the body before touching the store, so a refusal writes nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: by
by:
  class: net.officefloor.hq.app.period.ValidateClosePeriod
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: load
load:
  class: net.officefloor.hq.app.period.LoadPeriod
  govern: [ transaction ]
  next: lock
lock:
  class: net.officefloor.hq.app.period.LockPeriod
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.period.RecordPeriodLocked
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithLockedPeriod
  govern: [ transaction ]
