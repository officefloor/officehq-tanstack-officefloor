# Validate first so an unknown role or blank name is a 400 and nothing is written. The audit line
# is written last, once the role is stored.
validate:
  class: net.officefloor.hq.app.role.ValidateRole
  next: save
save:
  class: net.officefloor.hq.app.role.SaveRole
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.role.AuditRoleSet
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.role.RespondWithRole
  govern: [ transaction ]
