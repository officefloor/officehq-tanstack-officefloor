# GET /api/sheets/{sheetId}/void-reasons — the sheet's void reasons, in the order they were added.
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheetForRead
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.voidreason.RespondWithVoidReasons
  govern: [ transaction ]
