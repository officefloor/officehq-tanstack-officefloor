# The sheet's void reasons, in the order they were added.
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ readonly-transaction ]
  next: reasons
reasons:
  class: net.officefloor.hq.app.voidreason.LoadVoidReasons
  govern: [ readonly-transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.voidreason.RespondWithVoidReasons
  govern: [ readonly-transaction ]
