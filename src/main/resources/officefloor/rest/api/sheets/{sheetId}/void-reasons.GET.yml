# The sheet's void reasons in the order they were added, each with how many VOID claims were voided with it. 404 for
# an id never loaded.
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ readonly-transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.voidreason.RespondWithVoidReasons
  govern: [ readonly-transaction ]
