# Save a claim template (a name saved again replaces that template). Validate the body before touching the store, so a
# refusal writes nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: template
template:
  class: net.officefloor.hq.app.template.ValidateTemplate
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: ensure
ensure:
  class: net.officefloor.hq.app.sheet.EnsureSheet
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.template.SaveTemplate
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.template.RecordTemplateSaved
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.template.RespondWithTemplate
  govern: [ transaction ]
