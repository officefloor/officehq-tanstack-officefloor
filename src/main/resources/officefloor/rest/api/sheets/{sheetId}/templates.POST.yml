# POST /api/sheets/{sheetId}/templates — saves a claim template (body: {name, amount, note, user}), name and
# note trimmed; saving a name again replaces its amount and note. A blank name, an amount the claim form
# would refuse, or a viewer is refused (400) and nothing is stored. Recorded as TEMPLATE_SAVED.
validate:
  class: net.officefloor.hq.app.template.ValidateTemplate
  next: save
save:
  class: net.officefloor.hq.app.template.SaveTemplate
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.template.AuditTemplateSaved
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.template.RespondWithTemplate
  govern: [ transaction ]
