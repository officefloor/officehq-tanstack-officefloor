# POST /api/sheets/{sheetId}/templates — saves a claim template. Body {"name":"...","amount":"12.50","note":"..."}; name
# and note trimmed. Saving a name again replaces that template. A blank name, or an amount the claim form would refuse,
# is refused with 422 and nothing is stored or recorded.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: validate
  govern: [ transaction ]
validate:
  class: net.officefloor.hq.app.template.ValidateTemplate
  next: save
  govern: [ transaction ]
save:
  class: net.officefloor.hq.app.template.SaveTemplate
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.template.AuditTemplateSaved
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.template.RespondWithTemplate
  govern: [ transaction ]
