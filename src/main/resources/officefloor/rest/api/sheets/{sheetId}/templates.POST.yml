# Save a claim template, replacing one of the same name. A refused save (no signed-in user, a blank name, an amount
# the claim form would refuse) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.template.ValidateTemplate
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.template.SaveTemplate
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.template.AuditTemplateSaved
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.template.RespondWithTemplate
  govern: [ transaction ]
