# POST /api/sheets/{sheetId}/templates — save a claim template (name, amount, note); saving a name again
# replaces that template. A blank name, or an amount the claim form would refuse, is refused.
# A viewer may change nothing: refused before anything is read or written.
guard:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: validate
validate:
  class: net.officefloor.hq.app.template.ValidateTemplate
  next: save
save:
  class: net.officefloor.hq.app.template.SaveTemplate
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.template.RecordTemplateSaved
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.template.RespondWithTemplate
