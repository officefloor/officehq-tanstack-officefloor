# Save a claim template (TEMPLATE_SAVED): a name (trimmed), an amount and a note. A blank name, or an amount the claim
# form would refuse, is refused (400); saving a name again replaces its template. Responds with the sheet's templates.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: validate
validate:
  class: net.officefloor.hq.app.template.ValidateTemplateRequest
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.template.SaveTemplate
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.template.AuditTemplateSaved
  govern: [ transaction ]
  next: templates
templates:
  class: net.officefloor.hq.app.template.LoadTemplates
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.template.RespondWithTemplates
  govern: [ transaction ]
