# PUT /api/sheets/{sheetId}/claims/{claimId}/waive — a steward waives an OPEN or PENDING claim's late charge: it bears
# none from then on, whatever its overdue state, and CLAIM_WAIVED is written. Refused with 422 for anyone else, any
# other status, or a claim already waived; nothing is stored. 404 for a claim not on the sheet.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: snapshot
  govern: [ transaction ]
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  next: load
  govern: [ transaction ]
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  next: apply
  govern: [ transaction ]
apply:
  class: net.officefloor.hq.app.claim.ApplyWaive
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.claim.AuditClaimWaived
  next: rollup
  govern: [ transaction ]
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.claim.RespondWithEditedClaim
  govern: [ transaction ]
