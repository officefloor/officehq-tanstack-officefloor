# Close a period, fixing its due-total. Validate the body before touching the store, so a refusal writes nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: by
by:
  class: net.officefloor.hq.app.period.ValidateClosePeriod
  next: load
load:
  class: net.officefloor.hq.app.period.LoadPeriod
  govern: [ transaction ]
  next: close
close:
  class: net.officefloor.hq.app.period.ClosePeriod
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.period.RecordPeriodClosed
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithClosedPeriod
  govern: [ transaction ]
