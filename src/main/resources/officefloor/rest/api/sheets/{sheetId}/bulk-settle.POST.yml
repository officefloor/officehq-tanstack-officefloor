# Settle the selected claims together, all or nothing. If any cannot be settled none is, and all
# count as refused. Otherwise each is settled (or goes PENDING) and audited as a single settle would
# be, in list order, then the batch is audited. Answers how many of each.
validate:
  class: net.officefloor.hq.app.claim.ValidateBulkSettle
  next: settle
settle:
  class: net.officefloor.hq.app.claim.SettleClaims
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithBulkSettle
  govern: [ transaction ]
