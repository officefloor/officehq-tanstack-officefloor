# POST /api/sheets/{sheetId}/bulk-settle — settle the selected claims together, in list order, each by the
# rules of settling one (a claim gone to PENDING counts as settled). All or nothing: if any cannot be settled,
# none is, every one counts as refused and nothing is written; otherwise a BATCH_SETTLED line follows the
# claims' own. Responds with how many were settled and how many refused.
settle:
  class: net.officefloor.hq.app.claim.BulkSettleClaims
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithBulkSettle
