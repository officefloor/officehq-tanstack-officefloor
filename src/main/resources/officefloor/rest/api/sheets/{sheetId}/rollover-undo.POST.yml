# Undo the sheet's last rollover, by the steward who made it on the same sheet-today only: remove the periods it
# generated and take back the opening balances it added (ROLLOVER_UNDONE). Refused on a later day, by anyone else, or
# when a claim now belongs to a period it generated. Answers how many periods were removed.
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: undo
undo:
  class: net.officefloor.hq.app.period.UndoRollover
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithGenerated
