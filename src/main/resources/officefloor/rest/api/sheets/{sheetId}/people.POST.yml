# Add a person. Validate first so a blank name or bad grade is a 400 and writes nothing;
# a name already in use on the sheet is refused by Build, also a 400.
validate:
  class: net.officefloor.hq.app.person.ValidatePerson
  next: snapshot
# Keep the figures as they were, so the change can audit the ones it moves.
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: build
build:
  class: net.officefloor.hq.app.person.BuildPerson
  next: save
save:
  class: net.officefloor.hq.app.person.SavePerson
  govern: [ transaction ]
  next: record
# Audit only once the change is saved: a refused change writes no line.
record:
  class: net.officefloor.hq.app.person.RecordPersonAdded
  govern: [ transaction ]
  next: rollup
# After the change's own lines: a line per person whose figures moved, then the totals if they did.
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPersonCreated
  govern: [ transaction ]
