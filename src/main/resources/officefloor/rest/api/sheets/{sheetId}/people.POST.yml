# POST /api/sheets/{sheetId}/people — add a person; an empty or already-used name or unknown grade is refused.
validate:
  class: net.officefloor.hq.app.person.ValidatePerson
  next: create
create:
  class: net.officefloor.hq.app.person.AddPerson
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.person.RecordPersonAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
