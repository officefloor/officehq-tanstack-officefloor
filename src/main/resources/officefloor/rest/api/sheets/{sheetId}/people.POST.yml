# POST /api/sheets/{sheetId}/people — add a person. An empty name or a grade other than A, B or C is
# a 400; a name already on the sheet (case and outer spaces ignored) or used as a name or alias on
# another sheet of its tree, or a contact another person has, is a 409; neither writes anything. The name is stored without its outer spaces, the contact
# without them and lower-cased (blank: none). Responds 201 with the person as stored.
validate:
  class: net.officefloor.hq.app.person.ValidatePerson
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: check
check:
  class: net.officefloor.hq.app.person.CheckNewPersonName
  govern: [ transaction ]
  next: contact
contact:
  class: net.officefloor.hq.app.person.CheckPersonContact
  govern: [ transaction ]
  next: add
add:
  class: net.officefloor.hq.app.person.AddPerson
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.person.RecordPersonAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPersonCreated
