# Add a person to the sheet. A refused add (no name, bad grade, unknown sheet, a name already in use) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.person.ValidatePerson
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: unique
unique:
  class: net.officefloor.hq.app.person.ValidateNewPersonName
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.person.SaveNewPerson
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.person.AuditPersonAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPersonCreated
  govern: [ transaction ]
