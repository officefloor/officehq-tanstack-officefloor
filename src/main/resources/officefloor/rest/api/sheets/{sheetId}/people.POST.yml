# Add a person to the sheet: a name (required) and a grade (one of the sheet's grades).
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: validate
validate:
  class: net.officefloor.hq.app.person.ValidatePerson
  next: save
save:
  class: net.officefloor.hq.app.person.AddPerson
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
