# Add a person. Validate the body before touching the store, so a refusal writes nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: person
person:
  class: net.officefloor.hq.app.person.ValidatePerson
  next: ensure
ensure:
  class: net.officefloor.hq.app.sheet.EnsureSheet
  govern: [ transaction ]
  next: name
name:
  class: net.officefloor.hq.app.person.CheckPersonName
  govern: [ transaction ]
  next: build
build:
  class: net.officefloor.hq.app.person.BuildPerson
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.person.RecordPersonAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
