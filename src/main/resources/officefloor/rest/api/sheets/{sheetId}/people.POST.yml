# POST /api/sheets/{sheetId}/people — add a person (body: {name, grade, user}). An empty name or a
# grade other than A, B or C is refused (400) and nothing is stored.
validate:
  class: net.officefloor.hq.app.person.ValidatePerson
  next: save
save:
  class: net.officefloor.hq.app.person.SavePersonAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
