# POST /api/sheets/{sheetId}/people — add a person. Body {"name":"...","grade":"A|B|C"}. A blank
# name or another grade is refused with 400 and nothing is stored.
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  next: validate
  govern: [ transaction ]
validate:
  class: net.officefloor.hq.app.person.ValidatePerson
  next: add
  govern: [ transaction ]
add:
  class: net.officefloor.hq.app.person.AddPerson
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.person.AuditPersonAdded
  next: rollup
  govern: [ transaction ]
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
