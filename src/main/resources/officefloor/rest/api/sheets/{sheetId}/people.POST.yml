# Validate first so a blank name or unknown grade is a 400 and nothing is written.
validate:
  class: net.officefloor.hq.app.person.ValidatePerson
  next: create
create:
  class: net.officefloor.hq.app.person.CreatePerson
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPersonCreated
  govern: [ transaction ]
