# PUT /api/sheets/{sheetId}/people/{personId} — edit a person. Body as for an add; refused the same
# way (400), and 404 for a person not on the sheet.
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  next: validate
  govern: [ transaction ]
validate:
  class: net.officefloor.hq.app.person.ValidatePerson
  next: load
  govern: [ transaction ]
load:
  class: net.officefloor.hq.app.person.LoadPerson
  next: apply
  govern: [ transaction ]
apply:
  class: net.officefloor.hq.app.person.ApplyPerson
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.person.AuditPersonEdited
  next: rollup
  govern: [ transaction ]
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.person.RespondWithEditedPerson
  govern: [ transaction ]
