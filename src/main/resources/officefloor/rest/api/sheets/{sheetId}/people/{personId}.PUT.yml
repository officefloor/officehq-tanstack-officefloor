# Change a person's name and grade. Validate before Load so an invalid body is a 400, not a 404.
validate:
  class: net.officefloor.hq.app.person.ValidatePerson
  next: snapshot
# Keep the figures as they were, so the change can audit the ones it moves.
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.person.ApplyPerson
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.person.SavePerson
  govern: [ transaction ]
  next: record
# Audit only once the change is saved: a refused change writes no line.
record:
  class: net.officefloor.hq.app.person.RecordPersonEdited
  govern: [ transaction ]
  next: rollup
# After the change's own lines: a line per person whose figures moved, then the totals if they did.
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
