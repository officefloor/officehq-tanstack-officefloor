# Edit a person's name and grade; refused (400) on the same terms as an add; someone whose name or an alias is
# already used across the sheet's tree is refused every edit until it renames them clear of it (no alias clashing).
# Refused (409) when the editor loaded a version of the person someone else has saved over since.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: validate
validate:
  class: net.officefloor.hq.app.person.ValidatePersonRequest
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.person.ApplyPerson
  govern: [ transaction ]
  next: unique
unique:
  class: net.officefloor.hq.app.person.CheckPersonNameUnique
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.person.SavePerson
  govern: [ transaction ]
  next: tags
tags:
  class: net.officefloor.hq.app.person.SavePersonTags
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.person.AuditPersonEdited
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
