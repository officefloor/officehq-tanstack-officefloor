# Edit a person's name and grade. A refused edit (no name, bad grade, unknown person) writes nothing.
validate:
  class: net.officefloor.hq.app.person.ValidatePerson
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.person.SavePerson
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
