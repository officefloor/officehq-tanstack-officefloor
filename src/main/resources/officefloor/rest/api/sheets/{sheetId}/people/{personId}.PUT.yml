# Edit a person's name and grade. A refused edit (no name, bad grade, unknown person, a name already in use,
# a person saved by someone else since the version the edit was made from) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.person.ValidatePerson
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: unique
unique:
  class: net.officefloor.hq.app.person.ValidatePersonName
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.person.SavePerson
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.person.AuditPersonEdited
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
