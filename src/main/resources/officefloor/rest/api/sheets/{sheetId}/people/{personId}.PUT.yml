# The audit line is written last, once every rule has passed, so a refused change writes none.
# Validate before Load so an invalid body is a 400, not masked by a 404 for a missing person.
validate:
  class: net.officefloor.hq.app.person.ValidatePerson
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: version
version:
  class: net.officefloor.hq.app.person.CheckPersonVersion
  govern: [ transaction ]
  next: check
check:
  class: net.officefloor.hq.app.person.CheckPersonRename
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.person.ApplyPerson
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.person.SavePerson
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.person.AuditPersonEdited
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
