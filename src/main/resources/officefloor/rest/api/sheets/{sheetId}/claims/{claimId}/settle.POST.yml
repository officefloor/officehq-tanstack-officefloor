# POST /api/sheets/{sheetId}/claims/{claimId}/settle — move an OPEN claim to SETTLED (or, by a clerk above
# the clerk limit, to PENDING); refused (409) when its status does not allow it.
# A viewer may change nothing: refused before anything is read or written.
guard:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: move
move:
  class: net.officefloor.hq.app.claim.SettleClaim
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveClaim
  govern: [ transaction ]
  next: log
log:
  class: net.officefloor.hq.app.claim.LogClaimStatus
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.RecordClaimStatus
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
