# PUT /api/sheets/{sheetId}/claims/{claimId}/date — re-date an OPEN or PENDING claim, by a steward. Its due-by stays as
# it was fixed, a figure a statement bound it to stays bound, and so do its period and number (they follow its due-by).
# Anyone but a steward, any other claim, a claim whose due-by falls inside a closed period, a new date after the
# person's retirement or not a date, is a 409 and a claim not on the sheet a 404, neither writing
# anything. Responds with the claim as stored.
validate:
  class: net.officefloor.hq.app.claim.ValidateRedate
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.claim.ApplyRedate
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveRedate
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.RecordClaimRedated
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
