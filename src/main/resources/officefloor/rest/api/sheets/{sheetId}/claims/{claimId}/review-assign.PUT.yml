# PUT /api/sheets/{sheetId}/claims/{claimId}/review-assign — a steward assigns a REVIEW claim's review to a user. Body
# {"user":"<user>"}. The claim shows the user from then on (kept after it leaves REVIEW) and REVIEW_ASSIGNED is
# written. Refused with 422 for anyone else, any other status, or a blank user; nothing is stored. 404 for a claim
# not on the sheet.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: load
  govern: [ transaction ]
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  next: apply
  govern: [ transaction ]
apply:
  class: net.officefloor.hq.app.claim.ApplyReviewAssign
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.claim.AuditReviewAssigned
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.claim.RespondWithEditedClaim
  govern: [ transaction ]
