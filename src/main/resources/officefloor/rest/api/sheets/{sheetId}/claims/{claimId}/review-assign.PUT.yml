# Assign a REVIEW claim to a user to review: only a steward (by role or by delegation) may, and only a non-blank user. The claim shows the user assigned. A refused assignment (a blank user, another status, not a steward, unknown claim) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.claim.ValidateReviewAssign
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveReviewAssign
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditReviewAssigned
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
