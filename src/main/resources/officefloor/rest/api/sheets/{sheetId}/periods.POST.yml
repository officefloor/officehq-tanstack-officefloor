# POST /api/sheets/{sheetId}/periods — add a period. Body {"name":"P1","from":"2026-03-01","to":"2026-03-31","cap":"2"}:
# both dates inclusive; cap (blank: none) is how many OPEN or PENDING claims each person may have in it. A blank or
# taken name, a bad date, a to-date before the from-date, an overlap with another of the sheet's periods, or a cap that
# is not a whole number of at least 1 is refused with 400 and nothing is stored.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: validate
  govern: [ transaction ]
validate:
  class: net.officefloor.hq.app.period.ValidatePeriod
  next: add
  govern: [ transaction ]
add:
  class: net.officefloor.hq.app.period.AddPeriod
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.period.AuditPeriodAdded
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.period.RespondWithPeriod
  govern: [ transaction ]
