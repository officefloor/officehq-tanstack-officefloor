# POST /api/sheets/{sheetId}/periods — add a period; a missing or taken name, a bad date, a from-date
# after the to-date or dates overlapping another period are refused.
validate:
  class: net.officefloor.hq.app.period.ValidatePeriod
  next: add
add:
  class: net.officefloor.hq.app.period.AddPeriod
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.period.RecordPeriodAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithPeriod
