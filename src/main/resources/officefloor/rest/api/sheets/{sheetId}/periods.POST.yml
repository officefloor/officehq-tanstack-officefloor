# POST /api/sheets/{sheetId}/periods — add a period. Body: { "name": "...", "from": "YYYY-MM-DD", "to": "YYYY-MM-DD" }.
validate:
  class: net.officefloor.hq.app.period.ValidatePeriod
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.period.ApplyPeriod
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.period.AuditPeriodAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithPeriod
  govern: [ transaction ]
