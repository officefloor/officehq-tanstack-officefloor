# Add a period. Validate first so a bad name or dates are refused (400) and write nothing; then check
# the name is free and the dates overlap no other period on the sheet.
validate:
  class: net.officefloor.hq.app.period.ValidatePeriod
  next: build
build:
  class: net.officefloor.hq.app.period.BuildPeriod
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.period.SavePeriod
  govern: [ transaction ]
  next: audit
# Record the change only once it is saved, so a refused change writes no audit line.
audit:
  class: net.officefloor.hq.app.period.AuditPeriodAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithPeriod
