# Add a period to the sheet. A refused add (no name, bad dates, from after to, a name already in use, dates
# overlapping another period, unknown sheet) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.period.ValidatePeriod
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: fits
fits:
  class: net.officefloor.hq.app.period.ValidateNewPeriod
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.period.SaveNewPeriod
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.period.AuditPeriodAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithPeriodCreated
  govern: [ transaction ]
