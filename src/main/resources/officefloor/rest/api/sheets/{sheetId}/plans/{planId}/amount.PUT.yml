# PUT /api/sheets/{sheetId}/plans/{planId}/amount — change a plan's amount (body {"amount":"20.00"}) on the sheet's today.
# The claims generated from then on are of the new amount; those it generated that are still DRAFT take it too, each as
# the claim editor would save it (CLAIM_EDITED, then ROLLUP/TOTALS for figures that moved); any other keeps its amount. An amount the claim
# form would refuse is refused with 422 and nothing is stored; 404 for a plan not on the sheet.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: snapshot
  govern: [ transaction ]
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  next: load
  govern: [ transaction ]
load:
  class: net.officefloor.hq.app.plan.LoadPlan
  next: change
  govern: [ transaction ]
change:
  class: net.officefloor.hq.app.plan.ChangePlanAmount
  next: rollup
  govern: [ transaction ]
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlan
  govern: [ transaction ]
