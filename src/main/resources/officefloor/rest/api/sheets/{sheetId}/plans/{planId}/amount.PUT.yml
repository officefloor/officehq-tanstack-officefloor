# PUT /api/sheets/{sheetId}/plans/{planId}/amount — change the plan's amount on the sheet's today; the claims generated
# from then on take it, and those it generated that are still DRAFT are edited to it as the claim form would. Body: { "amount": "20.00" } (0.00 or more with up to two decimals). Answers the sheet's plans.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: validate
validate:
  class: net.officefloor.hq.app.plan.ValidatePlanAmount
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: plan
plan:
  class: net.officefloor.hq.app.plan.LoadPlan
  govern: [ transaction ]
  next: change
change:
  class: net.officefloor.hq.app.plan.ChangePlanAmount
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.plan.AuditPlanChanged
  govern: [ transaction ]
  next: drafts
drafts:
  class: net.officefloor.hq.app.plan.EditPlanDrafts
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlans
  govern: [ transaction ]
