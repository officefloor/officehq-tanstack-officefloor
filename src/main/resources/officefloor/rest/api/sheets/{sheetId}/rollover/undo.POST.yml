# Undo the sheet's last rollover, by the steward who made it, on the same sheet-today it was made: removes the periods
# it generated and the opening balances it set, then records ROLLOVER_UNDONE fy=<old FY>. Refused (400) when there is
# no rollover left to undo, the day has moved on, the user is anyone else, or a claim now belongs to a generated period.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: undo
undo:
  class: net.officefloor.hq.app.rollover.UndoRollover
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.rollover.RespondWithRolloverUndone
  govern: [ transaction ]
