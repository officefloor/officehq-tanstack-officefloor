# POST /api/sheets/{sheetId}/people/{personId}/statements/cancel — cancel the person's last statement: removes it
# and unbinds the claims it bound (live again; a figure an earlier statement bound is not restored). Only a steward
# may; anyone else, or a person with no statement, is a 400 and writes nothing. Responds 200 with the cancelled
# statement.
validate:
  class: net.officefloor.hq.app.statement.ValidateStatement
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: cancel
cancel:
  class: net.officefloor.hq.app.statement.CancelStatement
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.statement.RecordStatementCancelled
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.statement.RespondWithStatementCancelled
