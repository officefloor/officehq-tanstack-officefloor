# The sheet's people's patrons: one entry per person and patron they named.
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ readonly-transaction ]
  next: patrons
patrons:
  class: net.officefloor.hq.app.patron.LoadPatrons
  govern: [ readonly-transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.patron.RespondWithPatrons
  govern: [ readonly-transaction ]
