# POST /api/sheets/{sheetId}/plans/{planId}/pause — Pauses the plan from the sheet's today; a plan already paused is refused. A plan not on the sheet is a 400, none writing anything. Writes PLAN_PAUSED. Responds 204.
load:
  class: net.officefloor.hq.app.plan.LoadPlan
  govern: [ transaction ]
  next: pause
pause:
  class: net.officefloor.hq.app.plan.PausePlan
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithNoContent
