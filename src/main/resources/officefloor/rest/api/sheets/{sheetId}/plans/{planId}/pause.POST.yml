# Pauses the plan from the sheet's today (PLAN_PAUSED); refused (400) when it is already paused.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.plan.LoadPlan
  govern: [ transaction ]
  next: pause
pause:
  class: net.officefloor.hq.app.plan.PausePlan
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlan
  govern: [ transaction ]
