# POST /api/sheets/{sheetId}/claims/{claimId}/lines — add a line to a DRAFT claim. Body: { "label": "...", "qty": "3",
# "unit": "2.50" }; refused as an edit of the claim is (not a DRAFT, due-by in a closed period, locked by another user).
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: validate
validate:
  class: net.officefloor.hq.app.claim.ValidateLine
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: claim
claim:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: lock
lock:
  class: net.officefloor.hq.app.claim.GuardClaimLock
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.claim.ApplyLine
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditLineAdded
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
