# Add a line to a DRAFT claim: a label, a quantity (a whole number, at least 1) and a unit amount (two decimals). The
# claim's amount becomes its lines' quantities times their unit amounts, added up, and CLAIM_LINE_ADDED is written.
# Adding a line counts as editing the claim: the user is recorded as its last editor.
# A blank label, a bad quantity or unit amount, a claim that is not a DRAFT, one whose due-by falls inside a closed
# period, or one another user has locked is refused (400) and writes nothing.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: validate
validate:
  class: net.officefloor.hq.app.claim.ValidateLineRequest
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: checkLock
checkLock:
  class: net.officefloor.hq.app.claim.CheckClaimNotLocked
  govern: [ transaction ]
  next: checkDraft
checkDraft:
  class: net.officefloor.hq.app.claim.CheckClaimDraft
  govern: [ transaction ]
  next: checkPeriod
checkPeriod:
  class: net.officefloor.hq.app.claim.CheckClaimPeriodOpen
  govern: [ transaction ]
  next: add
add:
  class: net.officefloor.hq.app.claim.AddClaimLine
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveClaim
  govern: [ transaction ]
  next: edited
edited:
  class: net.officefloor.hq.app.claim.MarkClaimEdited
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimLineAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
