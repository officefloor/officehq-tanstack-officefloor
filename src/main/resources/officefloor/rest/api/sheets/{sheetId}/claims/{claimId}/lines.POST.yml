# Add a line to a DRAFT claim: a label, a quantity (a whole number, at least 1) and a unit amount (two decimals); the claim's amount becomes its lines' quantities times unit amounts, added up, and the user its last editor. A refused line (a bad label, quantity or unit amount, unknown claim, a claim that is not a DRAFT, a claim whose editor another user holds locked, a claim whose due-by is in a closed period) writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.claim.ValidateLine
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: draft
draft:
  class: net.officefloor.hq.app.claim.RefuseNonDraftClaimEdit
  govern: [ transaction ]
  next: locked
locked:
  class: net.officefloor.hq.app.claim.RefuseLockedClaimLine
  govern: [ transaction ]
  next: closed
closed:
  class: net.officefloor.hq.app.period.RefuseClosedClaimEdit
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveLine
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditLineAdded
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditLineRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
