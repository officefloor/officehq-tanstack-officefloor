# Add a line to a draft claim: its amount becomes its lines' total. Adding a line is an edit of the
# claim, so the edit's rules hold: a bad line is a 400; a claim that is not a draft, whose editor
# another user has open, or due by a date inside a closed period is a 409; all write nothing.
# A viewer may change nothing: refused before anything is read or written.
viewer:
  class: net.officefloor.hq.app.role.CheckCanChange
  next: validate
validate:
  class: net.officefloor.hq.app.claim.ValidateLine
  next: loadSheet
loadSheet:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: before
# The sheet's figures before the change, so the rollup lines tell which moved.
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: locked
locked:
  class: net.officefloor.hq.app.claim.CheckClaimLock
  govern: [ transaction ]
  next: closed
closed:
  class: net.officefloor.hq.app.period.CheckClaimPeriod
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.claim.AddClaimLine
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.claim.SaveClaim
  govern: [ transaction ]
  next: audit
# Last before the response: every rule has passed and the line is saved.
audit:
  class: net.officefloor.hq.app.claim.AuditClaimLineAdded
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
