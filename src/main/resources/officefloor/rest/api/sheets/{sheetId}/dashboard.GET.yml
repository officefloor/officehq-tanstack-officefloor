# GET /api/sheets/{sheetId}/dashboard — the steward's dashboard for the user named by X-User: the PENDING and
# REVIEW claims and the overdue claims that count, over the sheet and all its descendants, each by its own today
# ({"pending":1,"review":0,"overdue":2}); every count null for a user who is not a steward on the sheet (as of the
# sheet's today, or the as-of date).
respond:
  class: net.officefloor.hq.app.dashboard.RespondWithDashboard
  govern: [ readonly-transaction ]
