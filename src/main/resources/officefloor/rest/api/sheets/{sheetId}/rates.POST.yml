# Set the rate for a grade of the sheet: a percent, 0.00 or more with up to two decimals, from an
# optional from-date (blank: from the beginning of time) through an optional to-date (blank: no end;
# before the from-date is refused). Replaces the grade's rate from that date
# when it has one.
guard:
  class: net.officefloor.hq.app.settings.RefuseViewer
  next: validate
validate:
  class: net.officefloor.hq.app.rate.ValidateRate
  next: save
save:
  class: net.officefloor.hq.app.rate.SaveRate
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.rate.RespondWithRate
