validate:
  class: net.officefloor.hq.app.rate.ValidateRate
  next: snapshot
# The sheet's figures before the change, so the change can audit what it moved.
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.rate.SaveRate
  govern: [ transaction ]
