# Set the rate for a grade (A, B or C): a percent, 0.00 or more with up to two decimals. Replaces
# the grade's rate when it has one.
validate:
  class: net.officefloor.hq.app.rate.ValidateRate
  next: save
save:
  class: net.officefloor.hq.app.rate.SaveRate
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.rate.RespondWithRate
