# GET /api/sheets/{sheetId}/claims/{claimId}/timeline — the audit lines about the claim, newest first:
# those carrying its number, or for a claim with no number those naming its person, amount and date.
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ readonly-transaction ]
  next: list
list:
  class: net.officefloor.hq.app.audit.ListClaimTimeline
  govern: [ readonly-transaction ]
