# GET /api/sheets/{sheetId}/plans — the sheet's plans, in the order they were added, each with how many claims it has made.
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheetForRead
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlans
  govern: [ transaction ]
