# GET /api/sheets/{sheetId}/plans — the sheet's plans, in the order added ({id, personId, amount, start, every, end, generated, day, nextDates, paused}),
# `generated` being how many claims the plan has made so far, `nextDates` its first five dates after the sheet's today
# and on or before its end that no pause skips, comma and space separated, and `paused` yes/no.
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlans
  govern: [ readonly-transaction ]
