# The sheet's plans, in the order they were added, each with how many claims it has made so far.
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ readonly-transaction ]
  next: plans
plans:
  class: net.officefloor.hq.app.plan.LoadPlans
  govern: [ readonly-transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlans
  govern: [ readonly-transaction ]
