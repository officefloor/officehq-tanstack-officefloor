# The sheet's plans, in the order added, each with how many claims it has made so far.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: asof
asof:
  class: net.officefloor.hq.app.history.ValidateViewAsOf
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlans
  govern: [ readonly-transaction ]
