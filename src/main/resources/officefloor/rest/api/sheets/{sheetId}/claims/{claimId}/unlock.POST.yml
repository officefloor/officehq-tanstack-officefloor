# Cancelling a claim's editor releases the user's lock on it.
validate:
  class: net.officefloor.hq.app.claim.ValidateUnlock
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: release
release:
  class: net.officefloor.hq.app.claim.ReleaseLock
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
