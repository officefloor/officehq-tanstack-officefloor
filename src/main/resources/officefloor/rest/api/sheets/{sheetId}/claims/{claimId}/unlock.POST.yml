# Cancel a claim's editor: drop the user's lock on it (none held: nothing changes).
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: by
by:
  class: net.officefloor.hq.app.claim.ValidateClaimLock
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: release
release:
  class: net.officefloor.hq.app.claim.ReleaseClaimLock
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
