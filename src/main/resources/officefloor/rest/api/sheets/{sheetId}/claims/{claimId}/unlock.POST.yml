# Cancel a claim's editor: releases the user's lock on the claim (nothing when they hold none).
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: unlock
unlock:
  class: net.officefloor.hq.app.claim.UnlockClaim
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
