# POST /api/sheets/{sheetId}/claims/{claimId}/unlock — cancel a claim's editor, releasing its lock
# when the user holds it.
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: unlock
unlock:
  class: net.officefloor.hq.app.claim.UnlockClaim
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
