# A steward waives an OPEN or PENDING claim's late charge, once. Refused for anyone else, any other status, or a claim
# already waived.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: waive
waive:
  class: net.officefloor.hq.app.claim.ValidateWaive
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.claim.ApplyWaive
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.RecordClaimWaived
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
