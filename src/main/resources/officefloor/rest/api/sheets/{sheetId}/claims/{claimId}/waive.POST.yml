# POST /api/sheets/{sheetId}/claims/{claimId}/waive — a steward waives an OPEN or PENDING claim's late charge
# (body {user}): from then on it bears no late charge, whatever its overdue state. Refused (400) for anyone but a
# steward, a claim not on the sheet, one in any other status, or one already waived; nothing is stored then. A
# stored waiver is recorded in the audit file as CLAIM_WAIVED, then any move in the sheet's figures.
validate:
  class: net.officefloor.hq.app.claim.ValidateWaive
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: checkWaive
checkWaive:
  class: net.officefloor.hq.app.claim.CheckWaive
  govern: [ transaction ]
  next: snapshot
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.claim.ApplyWaive
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.claim.AuditClaimWaived
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaim
  govern: [ transaction ]
