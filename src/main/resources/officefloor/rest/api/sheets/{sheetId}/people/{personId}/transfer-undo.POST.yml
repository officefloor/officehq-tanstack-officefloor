# Undo the transfer that brought the person to this sheet. Anyone but a steward, a person who did not arrive by
# transfer, or any sheet-today but the one they arrived on is refused (400); a person not on the sheet (404). The
# person is transferred back to the sheet they came from exactly as a transfer does (its rules and records), then this
# sheet records the undo, followed by its rollup.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: undo
undo:
  class: net.officefloor.hq.app.person.CheckTransferUndo
  govern: [ transaction ]
  next: check
check:
  class: net.officefloor.hq.app.person.CheckTransfer
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: target
target:
  class: net.officefloor.hq.app.person.SnapshotTransferTarget
  govern: [ transaction ]
  next: transfer
transfer:
  class: net.officefloor.hq.app.person.TransferPerson
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.person.AuditPersonTransferred
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: undone
undone:
  class: net.officefloor.hq.app.person.AuditPersonTransferUndone
  govern: [ transaction ]
  next: undoneRollup
undoneRollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: arrived
arrived:
  class: net.officefloor.hq.app.person.AuditPersonArrived
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithTransfer
  govern: [ transaction ]
