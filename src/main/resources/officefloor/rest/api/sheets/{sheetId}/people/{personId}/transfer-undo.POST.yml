# POST /api/sheets/{sheetId}/people/{personId}/transfer-undo — a steward undoes the transfer that brought the person to
# this sheet, on the same sheet-today they arrived: they are transferred back to the sheet they came from by exactly
# the transfer rules and lines (see transfer.POST.yml), then this sheet records PERSON_TRANSFER_UNDONE and its ROLLUP and
# TOTALS lines. 422, storing nothing, for anyone but a steward, a person who did not arrive by transfer, any later day,
# or anything a transfer refuses; 404 for a person not on the sheet. Responds with the person as they arrived back.
viewer:
  class: net.officefloor.hq.app.setting.RefuseViewer
  next: archived
  govern: [ transaction ]
archived:
  class: net.officefloor.hq.app.sheet.RefuseArchived
  next: snapshot
  govern: [ transaction ]
snapshot:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  next: load
  govern: [ transaction ]
load:
  class: net.officefloor.hq.app.person.LoadPerson
  next: undo
  govern: [ transaction ]
undo:
  class: net.officefloor.hq.app.person.UndoTransfer
  next: audit
  govern: [ transaction ]
audit:
  class: net.officefloor.hq.app.person.AuditPersonTransferred
  next: undone
  govern: [ transaction ]
undone:
  class: net.officefloor.hq.app.person.AuditPersonTransferUndone
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.person.RespondWithEditedPerson
  govern: [ transaction ]
