# Start or stop the signed-in user watching the person.
validate:
  class: net.officefloor.hq.app.person.ValidateWatch
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: watch
watch:
  class: net.officefloor.hq.app.person.WatchPerson
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPerson
  govern: [ transaction ]
