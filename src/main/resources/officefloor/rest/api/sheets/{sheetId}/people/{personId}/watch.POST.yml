# Toggle whether the signed-in user watches the person: start watching (PERSON_WATCHED) or stop (PERSON_UNWATCHED).
# A viewer changes nothing, so a viewer's watch is refused (400). A person not on the sheet (404).
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: toggle
toggle:
  class: net.officefloor.hq.app.watch.ToggleWatch
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.watch.AuditWatchToggled
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.watch.RespondWithWatching
  govern: [ transaction ]
