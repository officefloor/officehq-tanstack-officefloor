# Toggle whether the signed-in user watches the person: start watching (PERSON_WATCHED) or stop (PERSON_UNWATCHED).
# Watching changes no figure, so any role may watch. A person not on the sheet (404).
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: toggle
toggle:
  class: net.officefloor.hq.app.watch.ToggleWatch
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.watch.AuditWatchToggled
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.watch.RespondWithWatching
  govern: [ transaction ]
