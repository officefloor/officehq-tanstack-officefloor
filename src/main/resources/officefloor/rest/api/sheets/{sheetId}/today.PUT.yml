# Change the sheet's today. A refused change (bad date, unknown sheet) writes nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateToday
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: snapshot
snapshot:
  class: net.officefloor.hq.app.rollup.AuditSnapshots
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.sheet.SaveToday
  govern: [ transaction ]
  next: autoclose
autoclose:
  class: net.officefloor.hq.app.period.AutoClosePeriods
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditTodayRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.sheet.RespondWithSheet
  govern: [ transaction ]
