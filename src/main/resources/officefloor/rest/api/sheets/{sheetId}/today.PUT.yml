# PUT /api/sheets/{sheetId}/today — change the sheet's today. A body that is not a real date is a
# 400 and writes nothing. Once stored, every open period whose to-date plus the sheet's grace days is before the new
# today is closed (PERIOD_CLOSED ... auto=yes), before the figures it moved are written. Responds with the sheet as
# stored. A today that differs from the stored one releases every claim's lock (closes every open claim editor).
validate:
  class: net.officefloor.hq.app.sheet.ValidateToday
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: unlock
unlock:
  class: net.officefloor.hq.app.claim.ReleaseClaimLocks
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.sheet.ApplyToday
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.sheet.SaveSheet
  govern: [ transaction ]
  next: autoclose
autoclose:
  class: net.officefloor.hq.app.period.AutoClosePeriods
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.sheet.RecordTodayChanged
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.sheet.RespondWithSheet
