# Change the sheet's today; a blank date resets it to the real date. Once it is set, every open period whose to-date
# plus the sheet's grace days (blank: off) is before the new today is closed, in order of their to-dates, as a close by hand would.
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: validate
validate:
  class: net.officefloor.hq.app.sheet.ValidateTodayRequest
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.sheet.ApplySheetToday
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.sheet.SaveSheet
  govern: [ transaction ]
  next: autoClose
autoClose:
  class: net.officefloor.hq.app.period.AutoClosePeriods
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.sheet.RespondWithSheet
  govern: [ transaction ]
