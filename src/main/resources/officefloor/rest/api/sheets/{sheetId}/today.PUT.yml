# PUT /api/sheets/{sheetId}/today — change the sheet's today. Body: { "today": "YYYY-MM-DD" }.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: validate
validate:
  class: net.officefloor.hq.app.sheet.ValidateToday
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: permitted
permitted:
  class: net.officefloor.hq.app.sheet.GuardTodayPermission
  govern: [ transaction ]
  next: snapshot
snapshot:
  class: net.officefloor.hq.app.rollup.AuditSnapshot
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.sheet.ApplyToday
  govern: [ transaction ]
  next: autoclose
autoclose:
  class: net.officefloor.hq.app.period.AutoClosePeriods
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.sheet.RespondWithSheet
  govern: [ transaction ]
