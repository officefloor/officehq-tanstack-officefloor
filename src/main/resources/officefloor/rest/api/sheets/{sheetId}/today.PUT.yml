# Change the sheet's today. A refused change (bad date, unknown sheet) writes nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateToday
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.sheet.SaveToday
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.sheet.RespondWithSheet
  govern: [ transaction ]
