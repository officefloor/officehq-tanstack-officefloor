# Change the sheet's today; a blank date resets it to the real date. The sheet is kept as it stood at the end of the
# old today first (a statement can be taken as of it); while the score log is on, each person's score on it is recorded as SCORE,
# in list order; and each person's due-total on it is recorded as SNAPSHOT, in list order, and kept as
# the person's snapshot line. Once it is set, every open period whose to-date
# plus the sheet's grace days (blank: off) is before the new today is closed, in order of their to-dates, as a close by hand would. Every claim lock on the sheet is released.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: validate
validate:
  class: net.officefloor.hq.app.sheet.ValidateTodayRequest
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: day
day:
  class: net.officefloor.hq.app.asof.RecordSheetDay
  govern: [ transaction ]
  next: before
before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: scores
scores:
  class: net.officefloor.hq.app.rollup.AuditScores
  govern: [ transaction ]
  next: snapshot
snapshot:
  class: net.officefloor.hq.app.rollup.AuditSnapshot
  govern: [ transaction ]
  next: keep
keep:
  class: net.officefloor.hq.app.snapshot.SaveSnapshots
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.sheet.ApplySheetToday
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.sheet.SaveSheet
  govern: [ transaction ]
  next: unlock
unlock:
  class: net.officefloor.hq.app.sheet.UnlockSheetClaims
  govern: [ transaction ]
  next: autoClose
autoClose:
  class: net.officefloor.hq.app.period.AutoClosePeriods
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.sheet.RespondWithSheet
  govern: [ transaction ]
