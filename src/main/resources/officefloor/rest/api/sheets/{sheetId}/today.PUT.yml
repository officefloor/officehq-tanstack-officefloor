# PUT /api/sheets/{sheetId}/today — change the sheet's today. A body that is not a real date is a
# 400 and writes nothing, and so is a change by a role the sheet's today permission (perm-today) does not allow. Once stored, every open period whose to-date plus the sheet's grace days is before the new
# today is closed (PERIOD_CLOSED ... auto=yes), before the figures it moved are written. Responds with the sheet as
# stored. A today that differs from the stored one first writes SNAPSHOT for every person, in list order, with
# their due-total on the day being left (preceded, while the score log is on, by SCORE for every person with their
# score on that day), before any period closes; it also releases every claim's lock (closes every
# open claim editor).
validate:
  class: net.officefloor.hq.app.sheet.ValidateToday
  next: permit
permit:
  class: net.officefloor.hq.app.sheet.PermitToday
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: snapshot
snapshot:
  class: net.officefloor.hq.app.sheet.RecordSnapshot
  govern: [ transaction ]
  next: unlock
unlock:
  class: net.officefloor.hq.app.claim.ReleaseClaimLocks
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.sheet.ApplyToday
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.sheet.SaveSheet
  govern: [ transaction ]
  next: autoclose
autoclose:
  class: net.officefloor.hq.app.period.AutoClosePeriods
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.sheet.RecordTodayChanged
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.sheet.RespondWithSheet
