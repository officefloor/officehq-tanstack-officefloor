# Validate first so an invalid date is a 400 and nothing is written.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetToday
  next: before
before:
  class: net.officefloor.hq.app.rollup.TakeRollup
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.sheet.SaveSheetToday
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.AuditRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.sheet.RespondWithSheetToday
  govern: [ transaction ]
