# Change the sheet's today. Validate the date before touching the store, so a refusal writes nothing.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetId
  next: date
date:
  class: net.officefloor.hq.app.sheet.ValidateSheetToday
  next: viewer
viewer:
  class: net.officefloor.hq.app.access.RefuseViewer
  next: ensure
ensure:
  class: net.officefloor.hq.app.sheet.EnsureSheet
  govern: [ transaction ]
  next: rollup-before
rollup-before:
  class: net.officefloor.hq.app.rollup.SnapshotRollup
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.sheet.ApplySheetToday
  govern: [ transaction ]
  next: auto-close
auto-close:
  class: net.officefloor.hq.app.period.AutoClosePeriods
  govern: [ transaction ]
  next: rollup
rollup:
  class: net.officefloor.hq.app.rollup.RecordRollup
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.sheet.RespondWithSheetToday
  govern: [ transaction ]
