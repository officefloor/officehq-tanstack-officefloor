# POST /api/sheets/{sheetId}/crews/{crewId}/members — adds a person to a crew (body: {personId, user}). The
# crew's lead, a person already in the crew, or a viewer is refused (400) and nothing is stored. Recorded as
# CREW_MEMBER_ADDED.
validate:
  class: net.officefloor.hq.app.crew.ValidateMember
  next: save
save:
  class: net.officefloor.hq.app.crew.SaveMember
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.crew.AuditMemberAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.crew.RespondWithMemberAdded
  govern: [ transaction ]
