# Add a person to a crew. A refused add (unknown crew or person, the crew's lead, a person already in the crew)
# writes nothing, not even an audit line.
validate:
  class: net.officefloor.hq.app.crew.ValidateCrewMember
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.crew.SaveCrewMember
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.crew.AuditCrewMemberAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.crew.RespondWithCrewMember
  govern: [ transaction ]
