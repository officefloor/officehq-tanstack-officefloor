# Add a member to a crew (CREW_MEMBER_ADDED): a person on the sheet. The crew's lead, or a person already in the crew,
# is refused (400). Responds with the sheet's crews.
archived:
  class: net.officefloor.hq.app.sheet.CheckNotArchived
  next: viewer
viewer:
  class: net.officefloor.hq.app.setting.CheckNotViewer
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadSheet
  govern: [ transaction ]
  next: validate
validate:
  class: net.officefloor.hq.app.crew.ValidateCrewMemberRequest
  govern: [ transaction ]
  next: save
save:
  class: net.officefloor.hq.app.crew.SaveCrewMember
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.crew.AuditCrewMemberAdded
  govern: [ transaction ]
  next: crews
crews:
  class: net.officefloor.hq.app.crew.LoadCrews
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.crew.RespondWithCrews
  govern: [ transaction ]
