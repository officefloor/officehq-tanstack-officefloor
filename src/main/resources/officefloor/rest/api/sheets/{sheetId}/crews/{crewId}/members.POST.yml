# POST /api/sheets/{sheetId}/crews/{crewId}/members — add a person to the crew.
# Body: { "personId": <id> }. Answers the sheet's crews.
guard:
  class: net.officefloor.hq.app.role.GuardViewer
  next: archived
archived:
  class: net.officefloor.hq.app.sheet.GuardArchived
  next: validate
validate:
  class: net.officefloor.hq.app.crew.ValidateCrewMember
  next: load
load:
  class: net.officefloor.hq.app.sheet.LoadOrCreateSheet
  govern: [ transaction ]
  next: crew
crew:
  class: net.officefloor.hq.app.crew.LoadCrew
  govern: [ transaction ]
  next: apply
apply:
  class: net.officefloor.hq.app.crew.ApplyCrewMember
  govern: [ transaction ]
  next: audit
audit:
  class: net.officefloor.hq.app.crew.AuditCrewMemberAdded
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.crew.RespondWithCrews
  govern: [ transaction ]
