# GET /api/sheets/{sheetId}/search?text= — every person on the sheet's tree whose name or an alias contains the text
# (case ignored; empty matches everyone), one line each as "<sheet id> <name> <due-total>": this sheet's people first
# in list order, then the other sheets' by sheet id.
respond:
  class: net.officefloor.hq.app.rollup.RespondWithTreeSearch
  govern: [ readonly-transaction ]
