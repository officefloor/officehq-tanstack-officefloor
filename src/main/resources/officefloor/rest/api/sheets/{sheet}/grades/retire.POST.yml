# Retires a grade: refused (400, nothing written) for a grade not the sheet's or already retired.
# Responds with the sheet's grades.
retire:
  class: net.officefloor.hq.app.grade.RetireGrade
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.grade.RespondWithGrades
  govern: [ transaction ]
