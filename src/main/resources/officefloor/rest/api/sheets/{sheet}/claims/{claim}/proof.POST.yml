# Raise a claim's proofs count by one, of the kind given (receipt or photo; receipt when none), not on a SETTLED or VOID claim, nor one dated inside a closed period. Responds with the sheet's claims.
validate:
  class: net.officefloor.hq.app.claim.ValidateProof
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: add
add:
  class: net.officefloor.hq.app.claim.AddClaimProof
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaims
  govern: [ transaction ]
