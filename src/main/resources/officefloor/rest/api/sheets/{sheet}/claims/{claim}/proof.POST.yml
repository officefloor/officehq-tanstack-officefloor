# Raise a claim's proofs count by one (not on a SETTLED or VOID claim, nor one dated inside a closed period). Responds with the sheet's claims.
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: add
add:
  class: net.officefloor.hq.app.claim.AddClaimProof
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaims
  govern: [ transaction ]
