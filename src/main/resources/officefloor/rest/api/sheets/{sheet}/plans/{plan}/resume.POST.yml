# Resumes the paused plan from the sheet's today: refused (400, nothing written) when it is not paused.
# Responds with the sheet's plans.
load:
  class: net.officefloor.hq.app.plan.LoadPlan
  govern: [ transaction ]
  next: resume
resume:
  class: net.officefloor.hq.app.plan.ResumePlan
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlans
  govern: [ transaction ]
