# Validate first so an unknown column is a 400 and writes nothing. Not audited. Responds with the columns switched off.
validate:
  class: net.officefloor.hq.app.columns.ValidateColumnChoice
  next: save
save:
  class: net.officefloor.hq.app.columns.SaveColumnChoice
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.columns.RespondWithColumns
  govern: [ transaction ]
