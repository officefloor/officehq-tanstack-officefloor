# Starts ({"on": true}) or stops ({"on": false}) the signed-in user watching the person.
# Responds with the ids of the people the user watches.
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: watch
watch:
  class: net.officefloor.hq.app.watch.WatchPerson
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.watch.RespondWithWatches
  govern: [ transaction ]
