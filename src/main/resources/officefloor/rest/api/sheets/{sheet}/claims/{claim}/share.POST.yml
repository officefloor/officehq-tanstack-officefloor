# Share a claim with another person on the sheet, who holds a share of its due. Responds with the sheet's claims.
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: share
share:
  class: net.officefloor.hq.app.claim.ShareClaim
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaims
  govern: [ transaction ]
