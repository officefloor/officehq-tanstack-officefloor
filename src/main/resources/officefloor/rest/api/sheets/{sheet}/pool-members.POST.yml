# Adds a person to a pool with a share: refused (400, nothing written) for a person already in the pool or a bad
# share. Responds with the sheet's pools.
add:
  class: net.officefloor.hq.app.pool.AddPoolMember
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.pool.RespondWithPools
  govern: [ transaction ]
