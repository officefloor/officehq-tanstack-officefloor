# Adds a person to a pool with a share and optional from/to dates: refused (400, nothing written) for a person
# already in the pool, a bad share, or a to-date before the from-date. Responds with the sheet's pools.
add:
  class: net.officefloor.hq.app.pool.AddPoolMember
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.pool.RespondWithPools
  govern: [ transaction ]
