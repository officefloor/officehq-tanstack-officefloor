# Holds an OPEN or PENDING claim, or releases it when held. Responds with the sheet's claims.
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: hold
hold:
  class: net.officefloor.hq.app.claim.HoldClaim
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaims
  govern: [ transaction ]
