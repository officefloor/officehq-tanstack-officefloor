# Adds a holiday: refused (400, nothing written) for a date not valid or already on the list.
# Responds with the sheet's holidays.
add:
  class: net.officefloor.hq.app.holiday.AddHoliday
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.holiday.RespondWithHolidays
  govern: [ transaction ]
