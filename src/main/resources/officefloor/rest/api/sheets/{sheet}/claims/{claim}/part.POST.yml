# Part-settle an OPEN claim ({"amount": "n.nn"}): split the amount off it and settle the new claim at once; any
# refusal refuses the whole action. Responds with the sheet's claims.
validate:
  class: net.officefloor.hq.app.claim.ValidateSplit
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: settle
settle:
  class: net.officefloor.hq.app.claim.SettlePartClaim
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaims
  govern: [ transaction ]
