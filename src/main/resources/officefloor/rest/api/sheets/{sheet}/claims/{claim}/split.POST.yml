# Split an amount off an OPEN claim ({"amount": "n.nn"}) into a new OPEN claim. Responds with the sheet's claims.
validate:
  class: net.officefloor.hq.app.claim.ValidateSplit
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: split
split:
  class: net.officefloor.hq.app.claim.SplitClaim
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaims
  govern: [ transaction ]
