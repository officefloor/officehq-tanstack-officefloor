# Validate first so an unknown key or a bad value is a 400 and writes nothing. Responds with the sheet's settings.
validate:
  class: net.officefloor.hq.app.setting.ValidateSetting
  next: save
save:
  class: net.officefloor.hq.app.setting.SaveSetting
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.setting.RespondWithSettings
  govern: [ transaction ]
