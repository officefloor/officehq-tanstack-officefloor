# Adds a grade: refused (400, nothing written) for a code not one to three capital letters, or already a grade.
# Responds with the sheet's grades.
add:
  class: net.officefloor.hq.app.grade.AddGrade
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.grade.RespondWithGrades
  govern: [ transaction ]
