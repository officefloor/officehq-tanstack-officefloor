# Unlock a locked period so it may be reopened; refuses a user who is not a steward, a period not on the sheet, or one
# not locked. Responds with the sheet's periods.
unlock:
  class: net.officefloor.hq.app.period.UnlockPeriod
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithPeriods
  govern: [ transaction ]
