# Adds a pool: refused (400, nothing written) for a blank name or one already a pool on the sheet.
# Responds with the sheet's pools.
add:
  class: net.officefloor.hq.app.pool.AddPool
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.pool.RespondWithPools
  govern: [ transaction ]
