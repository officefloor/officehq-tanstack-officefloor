# Lock a period so it cannot be reopened; refuses a user who is not a steward, a period not on the sheet, or one
# already locked. Responds with the sheet's periods.
lock:
  class: net.officefloor.hq.app.period.LockPeriod
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.period.RespondWithPeriods
  govern: [ transaction ]
