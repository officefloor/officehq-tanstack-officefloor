# Names a patron for the person: refused (400, nothing written) for themselves or a patron already named.
# Responds with the sheet's patrons.
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: add
add:
  class: net.officefloor.hq.app.patron.AddPatron
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.patron.RespondWithPatrons
  govern: [ transaction ]
