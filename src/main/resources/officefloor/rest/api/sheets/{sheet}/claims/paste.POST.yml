# Check every pasted line by the claim form's rules first so a refusal writes nothing, then add (or update the
# matching DRAFT) and open a claim per line, in order; any refusal refuses the whole paste. Responds with how many
# lines went through, and the claims.
validate:
  class: net.officefloor.hq.app.paste.ValidatePaste
  govern: [ transaction ]
  next: add
add:
  class: net.officefloor.hq.app.paste.AddPastedClaims
  govern: [ transaction ]
