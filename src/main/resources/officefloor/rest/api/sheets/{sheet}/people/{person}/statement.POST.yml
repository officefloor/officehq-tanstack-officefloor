# Take a statement of the person. Responds with the sheet's statements.
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: take
take:
  class: net.officefloor.hq.app.statement.TakeStatement
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.statement.RespondWithStatements
  govern: [ transaction ]
