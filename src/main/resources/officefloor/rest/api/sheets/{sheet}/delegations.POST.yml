# Validate first so a non-steward or out-of-order dates are a 400 and write nothing. Responds with the sheet's delegations.
validate:
  class: net.officefloor.hq.app.delegation.ValidateDelegation
  next: save
save:
  class: net.officefloor.hq.app.delegation.SaveDelegation
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.delegation.RespondWithDelegations
  govern: [ transaction ]
