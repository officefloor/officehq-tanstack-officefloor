# A steward assigns a REVIEW claim to a user to review ({"user"} in the body). Responds with the sheet's claims.
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: assign
assign:
  class: net.officefloor.hq.app.claim.AssignReview
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaims
  govern: [ transaction ]
