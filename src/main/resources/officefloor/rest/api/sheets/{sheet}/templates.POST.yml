# Saves a claim template (a name saved again replaces it): refused (400, nothing written) for a blank name or an
# amount the claim form would refuse. Responds with the sheet's templates.
save:
  class: net.officefloor.hq.app.template.SaveTemplate
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.template.RespondWithTemplates
  govern: [ transaction ]
