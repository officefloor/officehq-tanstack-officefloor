# Moves the person up or down the list, swapping them with their neighbour. Responds with the sheet's people.
validate:
  class: net.officefloor.hq.app.person.ValidateMove
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: move
move:
  class: net.officefloor.hq.app.person.MovePerson
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPeople
  govern: [ transaction ]
