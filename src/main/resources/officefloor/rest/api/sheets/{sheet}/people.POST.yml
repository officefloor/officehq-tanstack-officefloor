# Validate first so an empty name is a 400 and writes nothing. Responds with the sheet's people.
validate:
  class: net.officefloor.hq.app.person.ValidatePerson
  next: build
build:
  class: net.officefloor.hq.app.person.BuildPerson
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPeople
  govern: [ transaction ]
