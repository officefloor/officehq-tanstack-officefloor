# Validate first so a blank name or an unknown role is a 400 and writes nothing. Responds with the sheet's roles.
validate:
  class: net.officefloor.hq.app.role.ValidateRole
  next: save
save:
  class: net.officefloor.hq.app.role.SaveRole
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.role.RespondWithRoles
  govern: [ transaction ]
