# Adds a DRAFT claim from a template: its amount and note as they are now, dated like a claim with no date, then
# every rule of the claim form (a 400 for a template not on the sheet). Responds with the sheet's claims.
validate:
  class: net.officefloor.hq.app.template.ValidateTemplateClaim
  govern: [ transaction ]
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: build
build:
  class: net.officefloor.hq.app.claim.BuildClaim
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaims
  govern: [ transaction ]
