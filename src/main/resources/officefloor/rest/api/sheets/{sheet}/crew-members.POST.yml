# Adds a person to a crew: refused (400, nothing written) for an unknown crew or person, the crew's lead, or a person
# already in the crew. Responds with the sheet's crews.
add:
  class: net.officefloor.hq.app.crew.AddCrewMember
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.crew.RespondWithCrews
  govern: [ transaction ]
