# Validate first so a bad grade or percent is a 400 and writes nothing. Responds with the sheet's rates.
validate:
  class: net.officefloor.hq.app.rate.ValidateRate
  next: save
save:
  class: net.officefloor.hq.app.rate.SaveRate
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.rate.RespondWithRates
  govern: [ transaction ]
