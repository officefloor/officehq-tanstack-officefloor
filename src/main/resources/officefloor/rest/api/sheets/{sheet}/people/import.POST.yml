# Check every imported line by the person form's rules first so a refusal writes nothing, then, per line in order,
# update the person its name matches or add one. Responds with how many were added and updated, and the people.
validate:
  class: net.officefloor.hq.app.person.ValidateImport
  govern: [ transaction ]
  next: add
add:
  class: net.officefloor.hq.app.person.AddImportedPeople
  govern: [ transaction ]
