# Check every imported line by the person form's rules first so a refusal writes nothing, then add a person per line,
# in order. Responds with how many were added, and the people.
validate:
  class: net.officefloor.hq.app.person.ValidateImport
  govern: [ transaction ]
  next: add
add:
  class: net.officefloor.hq.app.person.AddImportedPeople
  govern: [ transaction ]
