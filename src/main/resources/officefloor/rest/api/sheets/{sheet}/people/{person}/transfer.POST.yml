# A steward transfers the person to another sheet ({"to": <sheet id>}): refused (400, nothing written) for anyone
# else, a retired person, this sheet's own id, or a name, alias or contact already on the other sheet. Responds with
# this sheet's people.
validate:
  class: net.officefloor.hq.app.person.ValidateTransfer
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: transfer
transfer:
  class: net.officefloor.hq.app.person.TransferPerson
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPeople
  govern: [ transaction ]
handle:
  class: net.officefloor.hq.app.person.HandleInvalidPerson
