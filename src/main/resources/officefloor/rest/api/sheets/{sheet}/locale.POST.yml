# Validate first so a locale other than en or de is a 400 and writes nothing. Not audited. Responds with the locale.
validate:
  class: net.officefloor.hq.app.locale.ValidateLocale
  next: save
save:
  class: net.officefloor.hq.app.locale.SaveLocale
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.locale.RespondWithLocale
  govern: [ transaction ]
