# Add a line to a DRAFT claim; its amount becomes the lines' total. Responds with the sheet's claims.
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: line
line:
  class: net.officefloor.hq.app.claim.AddClaimLine
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaims
  govern: [ transaction ]
