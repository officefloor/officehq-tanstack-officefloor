# A steward sets a DRAFT, OPEN or PENDING claim's due-by directly ({"dueBy": "yyyy-MM-dd"}); it stays as set when a holiday is added. Responds with the sheet's claims.
validate:
  class: net.officefloor.hq.app.claim.ValidateDueBy
  next: load
load:
  class: net.officefloor.hq.app.claim.LoadClaim
  govern: [ transaction ]
  next: set
set:
  class: net.officefloor.hq.app.claim.SetClaimDueBy
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.claim.RespondWithClaims
  govern: [ transaction ]
