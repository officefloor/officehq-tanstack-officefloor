# Adds a hold to the person. Validate before load so a bad date is a 400, not masked by a 404. Responds with the sheet's people.
validate:
  class: net.officefloor.hq.app.person.ValidateHold
  next: load
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: hold
hold:
  class: net.officefloor.hq.app.person.HoldPerson
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.person.RespondWithPeople
  govern: [ transaction ]
