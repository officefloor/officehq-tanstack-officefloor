# Adds a void reason: refused (400, nothing written) for a blank one or one already on the list.
# Responds with the sheet's void reasons.
add:
  class: net.officefloor.hq.app.voidreason.AddVoidReason
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.voidreason.RespondWithVoidReasons
  govern: [ transaction ]
