# Changes the plan's amount from the sheet's today, and of the claims it generated that are still DRAFT (each as the
# claim form edits it): refused (400, nothing written) when the amount is not 0.00 or more with up to two decimals.
# Responds with the sheet's plans.
load:
  class: net.officefloor.hq.app.plan.LoadPlan
  govern: [ transaction ]
  next: change
change:
  class: net.officefloor.hq.app.plan.ChangePlanAmount
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlans
  govern: [ transaction ]
