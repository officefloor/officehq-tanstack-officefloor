# Adds a crew with a lead: refused (400, nothing written) for a blank name, one already a crew on the sheet, or an
# unknown lead. Responds with the sheet's crews.
add:
  class: net.officefloor.hq.app.crew.AddCrew
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.crew.RespondWithCrews
  govern: [ transaction ]
