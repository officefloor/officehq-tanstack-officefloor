# Adds a plan for the person: refused (400, nothing written) for a bad amount or interval, or an end before the start.
# Responds with the sheet's plans.
load:
  class: net.officefloor.hq.app.person.LoadPerson
  govern: [ transaction ]
  next: add
add:
  class: net.officefloor.hq.app.plan.AddPlan
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.plan.RespondWithPlans
  govern: [ transaction ]
