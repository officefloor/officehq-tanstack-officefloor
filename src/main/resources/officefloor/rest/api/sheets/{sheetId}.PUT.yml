# Load a sheet: creates it (empty) the first time its id is used, then returns it.
validate:
  class: net.officefloor.hq.app.sheet.ValidateSheetLoad
  next: save
save:
  class: net.officefloor.hq.app.sheet.SaveSheet
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.sheet.RespondWithSheet
  govern: [ transaction ]
