# PUT /api/users/{userName}/locale — save the user name's locale. Body: { "locale": "en|de" }. No audit line.
validate:
  class: net.officefloor.hq.app.locale.ValidateLocale
  next: save
save:
  class: net.officefloor.hq.app.locale.SaveLocale
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.locale.RespondWithLocale
  govern: [ transaction ]
