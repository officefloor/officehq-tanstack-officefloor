# Save the user's locale (en or de). Writes no audit line.
validate:
  class: net.officefloor.hq.app.user.ValidateLocale
  next: save
save:
  class: net.officefloor.hq.app.user.SaveLocale
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.user.RespondWithSavedLocale
  govern: [ transaction ]
