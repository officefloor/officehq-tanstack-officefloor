# Choose the user's locale (en or de): how figures are shown to them. Writes no audit line. A refused choice (no
# user, a locale not offered) writes nothing.
validate:
  class: net.officefloor.hq.app.locale.ValidateLocale
  next: save
save:
  class: net.officefloor.hq.app.locale.SaveLocale
  govern: [ transaction ]
  next: respond
respond:
  class: net.officefloor.hq.app.locale.RespondWithLocale
  govern: [ transaction ]
