# PUT /api/users/{user}/locale — the user chooses their locale. Body {"locale":"en"|"de"}; 400 for any other.
# Kept per user, not per sheet, and not written to the audit file.
validate:
  class: net.officefloor.hq.app.user.ValidateLocale
  next: apply
  govern: [ transaction ]
apply:
  class: net.officefloor.hq.app.user.ApplyLocale
  next: respond
  govern: [ transaction ]
respond:
  class: net.officefloor.hq.app.user.RespondWithLocale
  govern: [ transaction ]
